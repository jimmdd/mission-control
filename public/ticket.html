          <text class="snum" x="${x + 12}" y="${y + 18}">STEP ${esc(String(s.step))}</text>
          ${model ? `<text class="srepo" x="${x + BOX_W - 12}" y="${y + 18}" text-anchor="end">${esc(clip(model, 14))}</text>` : ""}
          <text class="stitle" x="${x + 12}" y="${y + 38}">${esc(clip(s.title, 26))}</text>
          ${noGsd ? `<rect class="nogsd-edge" x="${x}" y="${y}" width="4" height="${BOX_H}" rx="2"/>` : ""}
          ${check ? `
            <rect class="cbox" x="${x + 12}" y="${y + 48}" width="${BOX_W - 24}" height="18" rx="5"/>
            <text class="ctext" x="${x + 18}" y="${y + 61}">✓ ${esc(clip(check.split("&&")[0].trim(), 22))}</text>` : ""}
        </g>`);
    });
  });

  // Edges: step → step from declared dependencies, decisions → the roots.
  const edges = [];
  const link = (a, b, cls) => {
    if (!a || !b) return;
    const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
    const dx = Math.max(20, (x2 - x1) / 2);
    edges.push(`<path class="${cls}" d="M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}"/>`);
  };
  for (const s of plan.steps) {
    // The edge takes the state of the step it leads into, so the travelled route is
    // green up to the pulsing station and quiet after it.
    for (const dep of s.depends_on || []) {
      const into = states[s.step] || "";
      const cls = into === "done" || into === "run" ? `flow ${into}` : "flow";
      link(pos[`s${dep}`], pos[`s${s.step}`], cls);
    }
  }
  if (hasDec) {
    const roots = plan.steps.filter(s => !(s.depends_on || []).length);
    decisions.forEach((q, i) => {
      for (const r of roots) link(pos[`d${i}`], pos[`s${r.step}`], `dlink ${q.answer ? "set" : "open"}`);
    });
  }

  return `
    <div class="maplegend">
      <span><i class="f"></i> depends on</span>
      ${hasDec ? `<span><i class="s"></i> decision locked</span>` : ""}
      ${open.length ? `<span><i class="d"></i> decision open — work is provisional</span>` : ""}
      ${anyNoGsd ? `<span><i class="d"></i> no GSD — step ran without task decomposition</span>` : ""}
    </div>
    <div class="diagram-wrap">
      <svg class="plan-map" viewBox="0 0 ${width} ${height}" style="min-width:${width}px">
        ${edges.join("")}${parts.join("")}
      </svg>
    </div>
    <div id="stepdetail"></div>`;
}

/** Full detail for one step — the node itself is all truncation. */
function stepDetail(plan, progress, num) {
  const s = (plan.steps || []).find(x => String(x.step) === String(num));
  if (!s) return "";
  const st = (progress?.steps || {})[String(num)] || {};
  const acs = (s.acceptance_criteria || s.done_when || []);
  const deps = (s.depends_on || []);
  return `
    <div class="sd">
      <div class="sd-head">
        <span class="sd-num">STEP ${esc(String(s.step))}</span>
        <span class="sd-title">${esc(s.title)}</span>
        <button class="sd-close" id="sd-close" title="Close">×</button>
      </div>
      <div class="sd-meta">
        ${esc(st.status || "pending")}
        ${st.agent_profile ? ` · ran on ${esc(st.agent_profile)}` : ""}
        ${!st.agent_profile && (st.category || s.category) ? ` · routed as ${esc(st.category || s.category)}` : ""}
        ${st.retry_count ? ` · attempt ${st.retry_count + 1}` : ""}
        ${deps.length ? ` · needs step ${deps.join(", ")}` : " · no dependencies"}
        ${s.repo ? ` · ${esc(s.repo)}` : ""}
      </div>
      ${st.gsd_ran === false ? `<div class="sd-warn">Not spec-driven: ${esc(st.gsd_reason || "no GSD artifacts")}</div>` : ""}
      ${st.outcome ? `<div class="sd-sec"><div class="sd-lab">Outcome</div><div class="sd-body">${esc(st.outcome)}</div></div>` : ""}
      ${s.description ? `<div class="sd-sec"><div class="sd-lab">What it does</div><div class="sd-body">${esc(s.description)}</div></div>` : ""}
      ${acs.length ? `<div class="sd-sec"><div class="sd-lab">Done when</div>${acs.map(c => `<div class="sd-ac">${esc(c)}</div>`).join("")}</div>` : ""}
      ${s.verify_command ? `<div class="sd-sec"><div class="sd-lab">Checked by</div><div class="sd-cmd">${esc(s.verify_command)}</div></div>` : ""}
    </div>`;
}

const clip = (s, n) => (String(s).length > n ? String(s).slice(0, n - 1) + "…" : String(s));

function renderPlan(plan, progress, triage) {
  if (!plan || !(plan.steps || []).length) {
    return `<div class="card">
      <div class="glab">The plan</div>
      <p class="empty">No plan yet — it's written once the questions are answered.</p></div>`;
  }
  const rounds = (plan.parallel_groups && plan.parallel_groups.length) ? plan.parallel_groups.length : plan.steps.length;
  return `<div class="card">
    <div class="glab">The plan <span class="gn">${plan.steps.length} steps · ${rounds} rounds</span></div>
    ${planMap(plan, progress, triage)}
  </div>`;
}

/* ─────────── findings and questions ─────────── */

/**
 * The ticket before it has any questions.
 *
 * "Nothing yet — triage hasn't run" was the only empty state, so a ticket triage
 * had read and passed as ready looked identical to one it had never seen. Those
 * are opposite facts: the first means nobody needs to do anything, the second
 * means nothing has happened yet. Triage having no questions is also the case that
 * dispatches without a confirmation, so it is exactly the one worth naming.
 */
function renderFound(triage, activities) {
  const items = [];
  const brief = triage?.triage_brief;
  if (brief?.task) items.push({ kind: "Task", text: brief.task });
  if (brief?.issues) items.push({ kind: "Issues", text: brief.issues });
  if (brief?.solution) items.push({ kind: "Solution", text: brief.solution });
  if (triage?.triage_reasoning) items.push({ kind: "Read", text: triage.triage_reasoning });
  (triage?.questions || []).filter(q => q.answer && q.answered_by === "agent")
    .forEach(q => items.push({ kind: "Worked out", text: `${q.question}\n→ ${q.answer}` }));

  // A ticket triage passes as ready persists no triage_state at all —
  // `post_planning_questions` only runs on the not-ready branch — so "did triage
  // run" cannot be read from the state. The activity log still carries the marker,
  // and it is the only trace that the ticket was assessed and waved through.
  const triagedActivity = (activities || []).some(a =>
    /triaged as ready/i.test(a.message || ""));
  const ranWithNoQuestions = triagedActivity || (!!triage && !(triage.questions || []).length);
  const empty = ranWithNoQuestions
    ? `<p class="empty">Triage read this and had no questions. Nothing has been created yet —
       confirm below to branch and start planning.</p>`
    : `<p class="empty">Nothing yet — triage hasn't run.</p>`;

  return `<div class="card">
    <div class="glab">What triage found</div>
    ${items.length ? items.map(i => `<div class="fitem"><span class="fk">${esc(i.kind)}</span><div class="ftx">${esc(i.text)}</div></div>`).join("") : empty}
  </div>`;
}

/** Questions raised by the planner, not by triage. Deferred ones no longer block. */

/** The conversation about a question, plus the box to add to it. */
/** Questions raised by the planner, not by triage. Deferred ones no longer block. */
function followUps(qs) {
  return qs.filter(q => !q.answer && !q.deferred && (q.source === "planner" || q.round > 1));
}

/**
 * One conversation, not a page of forms.
 *
 * Only the one live question carries an answer box. Settled questions remain a
 * compact transcript, while the bottom composer remains a separate chat channel.
 *
 * So the agent has one surface. Everything it has asked, everything you have said
 * back, and everything that got decided runs down a single stream, with one
 * composer at the bottom. The panel beside it is the durable record — what is
 * settled, what is still blocking — because that is the thing a transcript is
 * worst at and the thing this page exists to answer.
 *
 * The split is spatial as well as behavioral: typing on the question answers it;
 * typing in the composer asks the agent something. Neither field changes meaning
 * based on which submit control happens to be pressed.
 */

/** Everything that has happened, in order, across every question. */
function chatTimeline(questions) {
  const events = [];
  (questions || []).forEach((q, i) => {
    const seq = String(i).padStart(4, "0");
    events.push({
      at: q.asked_at || "", seq, kind: "asked", q,
      role: q.source === "planner" ? "planner" : "triage",
    });
    (q.thread || []).forEach(m => events.push({
      at: m.at || "", seq, kind: "said", q, role: m.role, text: m.text, model: m.model || "",
    }));
    if (q.answer) {
      events.push({
        at: q.answered_at || "", seq, kind: "decided", q,
        role: q.answered_by === "agent" ? "agent" : "you",
      });
    } else if (q.deferred) {
      events.push({ at: q.deferred_at || "", seq, kind: "deferred", q, role: "you" });
    }
  });
  // Question order first, time only within a question. Sorting on the timestamp
  // first put every question at the front — they carry no asked_at, and an empty
  // string sorts before everything — so any reply you typed trailed at the very
  // bottom, detached from the question it answered and looking like it came from
  // nowhere. A conversation reads: question, what was said about it, what it
  // settled; then the next question.
  return events.sort((a, b) =>
    a.seq.localeCompare(b.seq) || (a.at || "").localeCompare(b.at || ""));
}

/**
 * One message in the stream, per design 2b.
 *
 * Agent turns get an avatar and run full width; yours is a right-aligned bubble
 * with one corner squared off, so whose turn it was is legible without reading.
 * A decision is a receipt line rather than a message, because it records something
 * settled rather than somebody speaking.
 */
function renderChatEvent(ev) {
  // One avatar for the agent, and the role spelled out beside it only where it
  // means something. The split between triage, research and planner is our
  // plumbing; from the reader's side it is all the agent, so triage — the default
  // voice on this page — says nothing, and planner and research say who they are
  // because "the plan stopped" and "this was looked up" are different claims.
  const role = { planner: "planner", triage: "triage", research: "research" }[ev.role] || "agent";
  const tag = ev.q.becomes ? esc(ev.q.becomes) : "";

  if (ev.kind === "asked") {
    // Why it is asked renders as a finding — amber, which in this design means one
    // thing only: a human is the blocker.
    const why = ev.q.why
      ? `<div class="cfind"><div class="ft">Why this is being asked</div><div class="fb">${esc(ev.q.why)}</div></div>`
      : "";
    // Suggested replies as pills. Cyan means the agent recommended that option — so
    // it is only ever worn by an option the data actually names. Highlighting the
    // first one because it is first invents a recommendation nobody made, and reads
    // as a value already selected on a question that is still wide open.
    // A settled question is the record. Offering its options again invites you to
    // answer something already decided, and the receipt below already says so.
    const settled = ev.q.answer || ev.q.deferred;
    const delegating = !settled && !!ev.q.delegate_requested;
    const pills = settled || delegating ? "" : (ev.q.options || []).map(o =>
      `<button class="cpill${o === ev.q.recommended ? " rec" : ""}" data-answer="${esc(o)}" data-q="${esc(ev.q.id)}">${esc(o)}</button>`).join("");
    const escapePill = settled || delegating ? "" : `<button class="cpill esc" data-act="delegate" data-q="${esc(ev.q.id)}">Let the agent decide</button>`;
    const rec = ev.q.recommended
      ? `<div class="crec">research suggests <b>${esc(ev.q.recommended)}</b> — still your call</div>` : "";
    const answerBox = settled || delegating ? "" : `<div class="qanswer" data-answer-box="${esc(ev.q.id)}">
      <div class="qanswer-head"><b>Your answer</b><span>${tag ? `settles ${tag}` : "settles this question"}</span></div>
      <div class="crow">
        <input type="text" data-free="${esc(ev.q.id)}" placeholder="Write your answer…">
        <button class="cbtn qsubmit" data-submit-answer="${esc(ev.q.id)}">Submit answer</button>
      </div>
      <div class="qanswer-note" data-answer-error="${esc(ev.q.id)}">Press Enter to submit · chat stays separate below</div>
    </div>`;
    // "Working it out" is a claim about right now, so it expires. The last word
    // being yours was the only condition, which meant any question the agent never
    // came back to pulsed away indefinitely — and a synced Linear comment landing in
    // the thread as something you said started that clock without anything actually
    // running. The bridge polls once a minute; past a few of those, nothing is being
    // worked out and the honest line says when it was last said instead.
    const last = (ev.q.thread || [])[(ev.q.thread || []).length - 1];
    const owed = !!last && last.role === "you";
    const saidAt = owed ? Date.parse(last.at || "") : NaN;
    const fresh = owed && Number.isFinite(saidAt) && (Date.now() - saidAt) < 5 * 60_000;
    const waiting = delegating
      ? `<div class="cwait"><i></i>Agent deciding…<span class="el">question stays open</span></div>`
      : !owed ? ""
      : fresh
        ? `<div class="cwait"><i></i>working it out<span class="el">read-only</span></div>`
        : `<div class="cwait"><span class="el">no reply yet${
            Number.isFinite(saidAt) ? ` · asked ${esc(shortTime(last.at))}` : ""}</span></div>`;
    return `<div class="cmsg" data-for="${esc(ev.q.id)}">
      <span class="cav">${esc(AVATAR)}</span>
      <div>${ev.role === "planner" ? `<span class="crole">${esc(role)}</span>` : ""}
      <div class="cq">${esc(ev.q.question)}</div>
      ${tag ? `<span class="cbecomes">becomes ${tag}</span>` : ""}${why}
      ${settled ? "" : delegating ? waiting
        : `${rec}<div class="cpills">${pills}${escapePill}</div>${answerBox}${waiting}`}</div></div>`;
  }

  if (ev.kind === "said") {
    if (ev.role === "you") {
      return `<div class="cmsg me" data-for="${esc(ev.q.id)}"><div class="cbody">${mdInline(ev.text)}</div></div>`;
    }
    // Which model said it, so an answer can be weighed rather than just read.
    const by = ev.model ? ` · ${esc(ev.model)}` : "";
    return `<div class="cmsg" data-for="${esc(ev.q.id)}">
      <span class="cav">${esc(AVATAR)}</span>
      <div><span class="crole">${esc(role)}${by}</span><div class="cbody">${mdInline(ev.text)}</div></div></div>`;
  }

  if (ev.kind === "deferred") {
    return `<div class="cdec" data-for="${esc(ev.q.id)}">
      <div class="creceipt"><span>◦</span>${tag} set aside — not blocking planning
      <button class="cbtn" data-act="undefer" data-q="${esc(ev.q.id)}">bring it back</button></div></div>`;
  }

  // A decision is a receipt: it records something settled rather than somebody
  // speaking, so it carries no avatar and sits inline where the answer landed.
  const byAgent = ev.role === "agent";
  // Amber on this page means one thing — a human is the blocker — so the reasoning
  // behind a settled decision is not amber. It is the record explaining itself.
  const reason = ev.q.reason ? `<div class="creason">${esc(ev.q.reason)}</div>` : "";
  // Every recorded decision can be taken back, not just the ones the agent chose
  // for you. This was gated on `byAgent`, so once you answered a question yourself
  // the options were gone (a settled question stops offering them) and nothing
  // offered them back — your own answer was the one kind that could not be changed.
  const undo = `<button class="cbtn" data-act="reopen" data-q="${esc(ev.q.id)}">change it</button>`;
  return `<div class="cdec" data-for="${esc(ev.q.id)}">
    <div class="creceipt"><span class="ok">✓</span>Recorded as <b>${tag}</b> — the plan has to cite it${undo}</div>
    <div class="cbody">${mdInline(ev.q.answer)}${byAgent ? " · chosen for you" : ""}</div>
    ${reason}</div>`;
}

/**
 * The moment triage stopped asking (design 2c).
 *
 * The same thread keeps going rather than handing off to a new screen, so the
 * transition needs a mark or the plan arrives looking like another answer.
 */
function renderSettledMark(questions) {
  const stamps = (questions || []).map(q => q.answered_at || q.deferred_at || "").filter(Boolean).sort();
  const at = stamps.length ? shortTime(stamps[stamps.length - 1]) : "";
  return `<div class="cmark"><span class="ln"></span>
    <span>TRIAGE SETTLED${at ? ` · ${esc(at)}` : ""}</span><span class="ln"></span></div>`;
}

/**
 * The plan, as a message in the same thread.
 *
 * It was a separate view, below the conversation and below the fold, which put the
 * decomposition on the far side of a scroll from the decisions it was built out of.
 * The design's answer is that the plan is something the agent hands you at a moment
 * in the conversation — so it arrives as one, compact, with the full map behind
 * "open ▸" for when the shape of the thing is the question.
 *
 * "from D-01 · D-02" is deliberately not "cites": what is true is that those
 * decisions were settled and passed to the planner. Whether the plan text cites
 * them is a claim about a document nobody here has read.
 */
function renderPlanCard(plan, progress, questions, open = false, agentProgress = null) {
  const steps = (plan && plan.steps) || [];
  if (!steps.length) return "";
  const waves = (plan.parallel_groups && plan.parallel_groups.length) || steps.length;
  const st = n => (progress && progress.steps && progress.steps[String(n)]) || {};
  const waveOf = n => {
    const groups = plan.parallel_groups || [];
    const i = groups.findIndex(g => g.includes(n));
    return i < 0 ? 0 : i + 1;
  };

  const states = stepStates(plan, progress, agentProgress);
  const done = steps.filter(s => states[s.step] === "done").length;
  const running = steps.find(s => states[s.step] === "run");
  const lead = running
    ? `The plan is in — ${steps.length} steps, ${waves} ${waves === 1 ? "wave" : "waves"}. Step ${running.step} is running.`
    : done === steps.length
      ? `All ${steps.length} steps are done.`
      : done
        ? `The plan is in — ${steps.length} steps, ${waves} ${waves === 1 ? "wave" : "waves"}. ${done} done, nothing running.`
        : `The plan is in — ${steps.length} steps, ${waves} ${waves === 1 ? "wave" : "waves"}. Nothing dispatched yet.`;

  const cites = (questions || []).filter(q => q.answer).map(q => q.becomes).filter(Boolean);

  const rows = steps.map(s => {
    const p = st(s.step);
    const state = states[s.step] || "";
    const mark = state === "done" ? "✓" : state === "run" ? "▸" : state === "blocked" ? "!" : "○";
    const note = state === "done" ? (p.agent_profile || "done")
      : state === "run" ? "running"
      : state === "blocked" ? esc(p.status)
      : waves > 1 ? `wave ${waveOf(s.step)}` : "pending";
    return `<div class="prow ${state}">
      <span class="pm">${mark}</span><span class="pt">${esc(s.title)}</span><span class="pn">${note}</span></div>`;
  }).join("");

  return `<div class="cmsg" data-plan>
    <span class="cav">${esc(AVATAR)}</span>
    <div><div class="cbody">${esc(lead)}</div>
      <div class="pcard">
        <div class="ph">
          <span class="pf">PLAN</span>
          ${cites.length ? `<span class="pc">from ${esc(cites.join(" · "))}</span>` : ""}
          <button class="popen" data-planopen aria-expanded="${open}">${open ? "close ▾" : "open ▸"}</button>
        </div>
        <div class="psteps">${rows}</div>
      </div>
    </div></div>`;
}

/**
 * Talking to the ticket, not to a question.
 *
 * Every message used to be scoped to a question, so once the last one settled the
 * box went dead — exactly when "how was this implemented" and "actually, change
 * this" start being the things you want to say. The channel for that already
 * existed: the dashboard drawer posts to `/api/tasks/:id/activities` with a type
 * chosen by ticket status, and `bridge.py:4561` collects unacknowledged
 * `manual_feedback` and feeds it into a relaunch. Nothing new was needed — the
 * ticket page simply never wired to it.
 *
 * The type mapping is the drawer's, verbatim (`app.js:1839`). Diverging would mean
 * a note typed here and a note typed there reach the agent differently.
 */
function noteType(status) {
  if (status === "planning") return "planning_answer";
  if (status === "review" || status === "testing" || status === "in_review") return "manual_feedback";
  return "updated";
}

/** What the bridge writes itself. Echoing it back as conversation is noise. */
const BRIDGE_MARKERS = [
  "Bridge needs clarification", "Bridge picked up", "Completed by bridge",
  "Bridge agent completed", "Bridge agent acknowledged", "Needs clarification before work",
  "Change request received", "Self-answered", "All questions answered",
  "Triage could not identify target repos", "posted a repo-selection follow-up",
  "Could not identify target repos even after", "Repo not found on disk",
  "Multi-repo task detected", "Decided on your behalf", "Settled without asking",
  "dispatching for", "Task triaged as ready", "Agent spawn failed", "Checkpoint",
];
const isBridgeGenerated = m => BRIDGE_MARKERS.some(x => (m || "").includes(x));

/**
 * The ticket-level exchange, from the activity log.
 *
 * Attribution has to be positive, never inferred from a missing field. The first
 * version treated "no agent_id" as "the human said this", and MC writes plenty of
 * agent-less activities — so 37 entries on MET-635, almost all identical
 * heartbeats, rendered as right-aligned messages from the user. A note the page
 * sends now says so in its metadata; nothing else is ever attributed to a person.
 *
 * `updated` cannot be used as the signal either: it is both the drawer's type for
 * a human note on an in-progress ticket and MC's catch-all for narrating itself.
 */
const HUMAN_TYPES = ["manual_feedback", "planning_answer", "linear_comment"];
const HUMAN_MARK = '"source":"human"';

/** Routine transport chatter. It is not a timeline event and is omitted there. */
const NOISE = /^Agent heartbeat|^Lease |lease (claimed|released)|^Prompt sent|^Liveness/i;
/** The full prompt an agent was handed. Useful in a transcript, not in a column. */
const NOISE_TYPES = ["liveness", "prompt_sent", "lease_claimed", "lease_released"];
/** Things that went wrong. These are never collapsed, whatever else is.
 *  No `attempt \d` here: a heartbeat says "(attempt 1/3)" on every beat, so it
 *  matched every one of them as a failure. The real failures say so in words. */
const TROUBLE = /^(agent spawn failed|spawn failed|escalated to human|verification failed|step failed|planning failed|could not create|failed to)/i;
/** Types that mean trouble whatever the wording. */
const TROUBLE_TYPES = ["step_escalated", "step_retry", "checkpoint_raised", "needs_human"];
/** Events worth a line in the thread even though nobody said them. */
const MILESTONE_TYPES = ["step_dispatched", "step_completed", "step_escalated", "step_retry",
  "plan_created", "checkpoint_raised", "checkpoint_resolved", "spawned", "status_changed", "needs_human"];

/**
 * When the run currently in progress began.
 *
 * Taken from the newest spawn in the activity list, because that is the moment a
 * previous attempt's troubles stopped being about anything live. Self-contained on
 * purpose: no extra fetch, and it works on whatever history the page already has.
 */
function currentRunStart(activities) {
  const stamps = (activities || [])
    .filter(a => /agent spawned|spawned agents/i.test(a.message || ""))
    .map(a => a.created_at || "")
    .filter(Boolean)
    .sort();
  return stamps.length ? stamps[stamps.length - 1] : "";
}

function classifyActivity(a, since = "") {
  const msg = a.message || "";
  const meta = typeof a.metadata === "string" ? a.metadata : JSON.stringify(a.metadata || "");
  if (!msg.trim()) return null;
  if ((meta || "").includes(HUMAN_MARK)) return "human";
  if (HUMAN_TYPES.includes(a.activity_type) && !isBridgeGenerated(msg)) return "human";
  if (a.activity_type === "agent_reply") return "agent";
  // Noise is tested first: a heartbeat is routine even when its wording overlaps
  // whatever a failure would say. Nothing that repeats every 60 seconds is news.
  if (NOISE.test(msg) || NOISE_TYPES.includes(a.activity_type)) return "noise";
  if (TROUBLE_TYPES.includes(a.activity_type) || TROUBLE.test(msg.trim())) {
    // Trouble from before the current run is history, not a problem. MET-640 kept
    // showing "Escalated to human: Planning failed: planner finished with a GSD
    // project but no plan and no question" in amber, at the top of the column, while
    // a later run had planned successfully and its agent was committing code. Still
    // listed — the record matters — but as an ordinary entry, not as an alarm.
    if (since && (a.created_at || "") < since) return "event";
    return "trouble";
  }
  if (MILESTONE_TYPES.includes(a.activity_type)) return "event";
  return "noise";
}

function ticketNotes(activities) {
  const since = currentRunStart(activities);
  return (activities || [])
    .map(a => ({ a, kind: classifyActivity(a, since) }))
    .filter(x => x.kind)
    .sort((x, y) => (x.a.created_at || "").localeCompare(y.a.created_at || ""));
}

/**
 * The thread's system half: milestones and trouble in full, routine chatter
 * collapsed to a count. Fifty repetitions of "heartbeat: running (attempt 1/3)"
 * is not a conversation, but neither is silence — the run of them becomes one
 * line saying how many there were.
 */
/**
 * The chat: only what was said. Machine events moved to the rail — a conversation
 * interleaved with "step 2 completed" every few lines is a log with speech in it,
 * and the two are read at different moments for different reasons.
 */
function renderNotes(activities, checkpoints = []) {
  const rows = ticketNotes(activities).filter(x => x.kind === "human" || x.kind === "agent");
  for (const checkpoint of checkpoints || []) {
    rows.push({
      kind: "checkpoint",
      a: {
        ...checkpoint,
        message: checkpoint.prompt || "An agent needs your input.",
        created_at: checkpoint.created_at || checkpoint.updated_at || "",
      },
    });
  }
  rows.sort((x, y) => (x.a.created_at || "").localeCompare(y.a.created_at || ""));
  if (!rows.length) return "";
  const out = rows.map(({ a, kind }) => {
    if (kind === "human") return `<div class="cmsg me"><div class="cbody">${mdInline(a.message)}</div></div>`;
    if (kind === "checkpoint") {
      const state = a.status === "pending" ? "input needed" : "resolved";
      return `<div class="cmsg checkpoint-message" data-checkpoint-message="${esc(a.id)}">
        <span class="cav">${esc(AVATAR)}</span><div><span class="crole">agent · ${state}</span>
        <div class="cbody">${mdInline(a.message)}</div></div></div>`;
    }
    return `<div class="cmsg"><span class="cav">${esc(AVATAR)}</span>
        <div><span class="crole">agent</span><div class="cbody">${mdInline(a.message)}</div></div></div>`;
  });
  // Only promise a reply when this activity was actually placed on the durable
  // chat queue. Review feedback can also be consumed as a lifecycle change request;
  // older/dashboard clients posted those notes with expects_reply=0, and drawing a
  // typing indicator for them left the animation running forever after the agent
  // had already relaunched and completed the change.
  const latest = rows[rows.length - 1];
  if (latest.kind === "human" && (latest.a.expects_reply === true || latest.a.expects_reply === 1)) {
    out.push(`<div class="cmsg"><span class="cav">${esc(AVATAR)}</span>
      <div class="cthink"><i></i><i></i><i></i></div></div>`);
  }
  return out.join("");
}

/**
 * What the machine did, in the rail beneath the decisions.
 *
 * Newest first, with five events visible before the section scrolls. Every real
 * event gets its own row; transport-only heartbeat/lease chatter is omitted so it
 * cannot crowd state changes and failures out of the visible window.
 */
function renderActivity(activities, checkpoints = []) {
  const since = currentRunStart(activities);
  const rows = (activities || [])
    .filter(a => (a.message || "").trim())
    // Checkpoint prompts are questions in the conversation. Repeating the same
    // long prompt in this narrow rail made it look missing in both places.
    .filter(a => !(checkpoints.length && a.activity_type === "checkpoint_raised"))
    .filter(a => !NOISE.test(a.message || "") && !NOISE_TYPES.includes(a.activity_type))
    .map(a => {
      const classified = classifyActivity(a, since);
      return { a, kind: classified === "noise" ? "event" : classified };
    })
    .filter(x => x.kind)
    .sort((x, y) => (y.a.created_at || "").localeCompare(x.a.created_at || ""));
  if (!rows.length) return "";
  const out = rows.map(({ a, kind }) => {
    const at = shortTime(a.created_at);
    const tone = kind === "trouble" ? "bad" : kind;
    const label = kind === "human" ? "You"
      : kind === "agent" ? "Agent"
      : kind === "trouble" ? "Attention"
      : String(a.activity_type || "Event").replace(/_/g, " ");
    return `<div class="activity-item cevent ${tone}">
      <span class="mk" aria-hidden="true"></span>
      <div class="activity-body">
        <div class="activity-meta"><span class="ts">${esc(at || "—")}</span><span>${esc(label)}</span></div>
        <div class="tx" title="${esc(a.message)}">${esc(a.message)}</div>
      </div></div>`;
  }).join("");
  return `<div class="dsec grow"><h2>Activity <span class="activity-count">${rows.length}</span></h2><div class="dacts" tabindex="0" aria-label="Ticket activity timeline">${out}</div></div>`;
}

/** The question the composer is currently pointed at. */
function activeQuestion(questions, wantedId) {
  const open = blockingQuestions(questions);
  if (wantedId) {
    const found = (questions || []).find(q => q.id === wantedId);
    if (found) return found;
  }
  // Planner questions first: work is halted behind those.
  return open.find(q => q.source === "planner") || open[0] || null;
}

function blockingQuestions(questions) {
  return (questions || []).filter(q => !q.answer && !q.deferred);
}

function checkpointOptions(checkpoint) {
  if (!checkpoint?.options) return [];
  try {
    const parsed = typeof checkpoint.options === "string"
      ? JSON.parse(checkpoint.options) : checkpoint.options;
    return Array.isArray(parsed) ? parsed.map(String) : [];
  } catch { return []; }
}

function renderCheckpointComposer(checkpoints) {
  const checkpoint = checkpoints[0];
  if (!checkpoint) return "";
  const options = checkpointOptions(checkpoint);
  const optionButtons = options.map(option =>
    `<button class="cpill" data-cp-decision="answer" data-cp-response="${esc(option)}">${esc(option)}</button>`
  ).join("");
  const approvalButtons = checkpoint.kind === "approval"
    ? `<button class="cpill rec" data-cp-decision="approve">Approve</button>
       <button class="cpill esc" data-cp-decision="reject">Reject</button>`
    : "";
  const position = checkpoints.length > 1 ? ` · 1 of ${checkpoints.length}` : "";
  return `<div class="composer checkpoint-composer" data-checkpoint="${esc(checkpoint.id)}"><div class="cin">
    <div class="cactive"><b>Your input is needed</b>${position}</div>
    <div class="cbind">Answer the question above. Choose an option or write the answer the agent needs.</div>
    ${(optionButtons || approvalButtons) ? `<div class="cexits">${optionButtons}${approvalButtons}</div>` : ""}
    <div class="crow">
      <input type="text" id="checkpoint-reply" placeholder="Write your answer…">
      <button class="cbtn" data-cp-submit title="Send this answer">Submit answer</button>
    </div>
    <div class="cfoot">Resolving this clears the alert${checkpoints.length > 1 ? ` · ${checkpoints.length - 1} more after this` : ""}</div>
  </div></div>`;
}

function renderComposer(active, openCount, side = {}) {
  const pendingCheckpoints = (side.checkpoints || []).filter(c => c.status === "pending");
  if (pendingCheckpoints.length) return renderCheckpointComposer(pendingCheckpoints);
  if (!active) {
    const questions = side.questions || [];
    const last = [...questions].reverse().find(q => q.answer);
    if (side.needsRepoConfirm) {
      return `<div class="composer"><div class="cin">
        <div class="cactive">Choose one repository in the status card.</div>
        <div class="cbind">Use the Repo dropdown on the right. Planning stays paused until that selection is saved.</div>
        ${last ? `<div class="cexits"><button class="cpill esc" data-focus="${esc(last.id)}">Change a decision</button></div>` : ""}
        <div class="cfoot">one ticket uses one repository · no branch or worktree has been created</div>
      </div></div>`;
    }
    // Nothing dispatches until a human confirms — `bridge.py:5050` parks the ticket
    // on `confirmed` and polls it forever otherwise. That gate only had a button in
    // the dashboard's triage modal, so a ticket settled entirely in this thread sat
    // unplanned with the page cheerfully reporting that the planner would run next.
    // MET-635 sat that way for two days, once a minute, saying so in the log.
    //
    // This is design 3d's rule arriving where the work actually happens: confirm is
    // the one write, and it is deliberate.
    if (side.needsConfirm) {
      // Why it is being asked at all. A gate with no stated reason is the same
      // unreviewable judgement as no gate — you cannot disagree with a verdict
      // you cannot see.
      const why = (side.assessedWhy || []).length
        ? `<div class="cwhy"><b>${esc(side.assessedLevel || "normal")}</b> — ${esc(side.assessedWhy.join(" · "))}</div>`
        : "";
      const target = side.executionTarget || {};
      const targetRepos = (target.repos || []).map(r =>
        `${r.label || `${r.project}/${r.repo}`}${r.base_branch ? ` · base ${r.base_branch}` : ""}${r.branch ? ` · branch ${r.branch}` : ""}`);
      const targetApps = target.apps || [];
      const targetLine = targetRepos.length
        ? `<div class="ctarget"><b>execution target</b> — ${esc(targetRepos.join("; "))}${targetApps.length ? ` · app ${esc(targetApps.join(", "))}` : ""}</div>`
        : `<div class="ctarget"><b>execution target unresolved</b> — wait for a repository before confirming</div>`;
      return `<div class="composer"><div class="cin">
        <div class="cactive">Every question is settled. Nothing has been dispatched yet.</div>
        ${why}
        ${targetLine}
        <div class="cexits">
          <button class="cpill rec" data-act="confirm">Confirm and start planning</button>
          ${last ? `<button class="cpill esc" data-focus="${esc(last.id)}">Change a decision</button>` : ""}
        </div>
        <div class="cfoot">confirming creates the branch and worktree · nothing is written before it</div>
      </div></div>`;
    }
    // Design 2c: confirmed and running. Nothing is waiting on you, but the box
    // stays live — this is exactly when "how was this done" and "change this" come
    // up. Typed text becomes a ticket note, which the bridge picks up as a change
    // request at review and as an answer during planning.
    const kind = noteType(side.taskStatus);
    const hint = kind === "manual_feedback"
      ? "asks and change requests reach the agent on its next pass"
      : "notes reach the planner on its next pass";
    const statusPrefix = ["review", "in_review", "testing"].includes(side.taskStatus)
      ? ""
      : `${esc(side.status || "planning can proceed")} · `;
    return `<div class="composer" data-note="${esc(kind)}"><div class="cin">
      <div class="cactive">Nothing is waiting on you.</div>
      ${last ? `<div class="cexits">
        <button class="cpill esc" data-focus="${esc(last.id)}">Change a decision</button>
      </div>` : ""}
      <div class="crow">
        <input type="text" id="say" placeholder="Ask about this ticket, or say what to change…">
        <button class="csend" data-send="note" title="Send to the agent">↑</button>
      </div>
      <div class="cfoot">${statusPrefix}${hint}</div>
    </div></div>`;
  }
  // A live question owns its answer field above. This composer has one job: chat
  // about that question. Enter and the Ask button therefore use the same endpoint,
  // and no control here can accidentally settle a decision.
  return `<div class="composer" data-active="${esc(active.id)}"><div class="cin">
    <div class="cactive">Ask a follow-up about this question</div>
    <div class="cbind">Submit answers on the question above. Messages here only continue the conversation.</div>
    <div class="crow">
      <input type="text" id="say" placeholder="Ask a follow-up question…">
      <button class="csend text" data-send="ask" title="Ask a follow-up question">Ask</button>
    </div>
    <div class="cfoot">${openCount > 0
      ? `${openCount} more after this · planning starts when the last is settled`
      : "last one — planning starts when this is settled"}</div>
  </div></div>`;
}

/**
 * The decision rail: what is settled, what is still open, without scrolling.
 * The one thing a transcript is worst at, and the thing this page exists to answer.
 */
/**
 * A few words naming what a question decides, for the rail.
 *
 * Triage writes this. The full question runs to several hundred characters — one
 * on MET-635 is 511 — and truncating one lands mid-parenthesis, so the fallback
 * keeps the opening words rather than pretending to summarise. The full text is
 * still there on hover, and in the chat.
 */
function questionLabel(q) {
  if (q.summary) return q.summary;
  const text = (q.question || "").replace(/\s+/g, " ").trim();
  return text.length > 58 ? text.slice(0, 58).replace(/\s\S*$/, "") + "…" : text;
}

/**
 * Autonomy, per ticket (design 4a) — presets, not a permission matrix.
 *
 * The bridge assesses a level from what it already knows and this is where you
 * disagree with it. `requires_confirmation` takes the override first, in both
 * directions: marking a ticket careful keeps the gate when the rules would skip
 * it, and marking it simple skips the gate — but deliberately, on a ticket, where
 * it is visible. That visibility is the whole difference from the silent
 * auto-dispatch this replaces.
 *
 * The design's matrix rows — push the branch, open the PR, install dependencies,
 * migrations — are not here. Nothing enforces them: `no_pr` is a line in a prompt,
 * and there is no mechanism behind "never touch migrations". Drawing them as
 * switches would promise a guarantee the system cannot keep, which is worse than
 * their absence.
 */
const LEVELS = [
  ["", "Auto", "run it — the rules still assess and report, but do not stop to ask"],
  ["simple", "Simple", "no confirmation — plan and build straight through"],
  ["normal", "Normal", "confirm before anything is created"],
  ["careful", "Careful", "confirm, and keep confirming"],
];

function renderAutonomy(triage) {
  if (!triage) return "";
  const chosen = triage.process_level || "";
  const rows = LEVELS.map(([value, label, hint]) => {
    const on = chosen === value;
    return `<button class="lvl ${on ? "on" : ""}" data-level="${esc(value)}" title="${esc(hint)}">
      <span class="nm">${esc(label)}</span>
      ${on ? `<span class="tick">✓</span>` : ""}
    </button>`;
  }).join("");
  const current = (LEVELS.find(([v]) => v === chosen) || LEVELS[0])[1];
  return `<details class="autos autonomy-badge" data-autonomy ${autonomyOpen ? "open" : ""}>
    <summary title="Autonomy mode">
      <span class="cur">${esc(current)}</span>
      <span class="chev">▼</span>
    </summary>
    <div class="lvls">${rows}</div>
  </details>`;
}

function renderDecisions(questions, activeId, side = {}) {
  const recalled = side.recalled || null;
  const rows = (questions || []).map(q => {
    let state = "open", label = "open";
    if (q.answer) { state = "set"; label = "settled"; }
    else if (q.deferred) { label = "set aside"; }
    else if (q.delegate_requested) { state = "agent"; label = "agent deciding"; }
    else if (q.id === activeId) { state = "on"; label = "discussing"; }
    return `<button class="drow2 ${state}" data-focus="${esc(q.id)}" title="${esc(q.question)}">
      <span class="dtag"><b>${esc(q.becomes || "—")}</b>${esc(label)}</span>
      <span class="dq2">${esc(questionLabel(q))}</span>
    </button>`;
  }).join("");
  const settled = (questions || []).filter(q => q.answer).length;
  const blocking = blockingQuestions(questions).length;
  // What this project already learned that bears on the ticket. Only rendered when
  // the knowledge store actually returns something — an empty "RECALLED" heading
  // reads as "nothing was remembered", which is a different claim from "we did not
  // ask", and only one of them is true when the store is unreachable.
  const memory = recalled
    ? `<div class="dsec"><h2>Recalled</h2>
        <div class="dmem">“${esc(recalled.text)}”
        <div class="src">${esc(recalled.category || "note")}${recalled.domain ? ` · ${esc(recalled.domain)}` : ""}</div></div></div>`
    : "";

  // Design 2c's two extra sections. Both are real endpoints, and both render only
  // when they have something — an empty "DELIVERABLES" heading claims the run
  // produced nothing, which is a different statement from "nothing is recorded".
  // A PR can be observed by the bridge, the completion monitor and the completion
  // webhook. Older databases may therefore contain the same URL more than once;
  // it is still one deliverable on the ticket, so render it once.
  const seenDeliverables = new Set();
  const files = (side.deliverables || []).filter(d => {
    const type = String(d.deliverable_type || "").toLowerCase();
    if (!["pr", "pull_request"].includes(type)) return true;
    const key = `pr:${d.path || d.title || d.id}`;
    if (seenDeliverables.has(key)) return false;
    seenDeliverables.add(key);
    return true;
  }).slice(0, 6);
  const deliverables = files.length
    ? `<div class="dsec"><h2>Deliverables</h2><div class="dlist2">${files.map(d =>
        `<div class="drow3"><span class="ic">▤</span><span class="nm" title="${esc(d.path || "")}">${esc(d.title || d.path || d.deliverable_type)}</span></div>`).join("")}</div></div>`
    : "";
  const kids = side.children || [];
  const subtasks = kids.length
    ? `<div class="dsec"><h2>Subtask${kids.length > 1 ? "s" : ""}</h2><div class="dlist2">${kids.slice(0, 5).map(c =>
        `<a class="drow3" href="/ticket?id=${encodeURIComponent(c.id)}">
           <span class="dot ${c.status === "in_progress" ? "live" : ""}"></span>
           <span class="nm">${esc(c.external_id || c.id.slice(0, 6))} · ${esc(c.title || "")}</span></a>`).join("")}</div>
       <div class="dnote">merges back before review</div></div>`
    : "";

  const allSettled = (questions || []).length > 0 && !blocking;
  const task = side.task || { status: side.taskStatus || "planning" };
  const tone = taskTone(task.status);
  const awaitingHumanReview = ["review", "in_review", "testing"].includes(task.status);
  const prDeliverable = (side.deliverables || []).find(d =>
    ["pr", "pull_request"].includes(String(d.deliverable_type || "").toLowerCase())
      && /^https?:\/\//.test(d.path || ""));
  const prUrl = awaitingHumanReview
    ? [task.pr_url, prDeliverable?.path].find(url => /^https?:\/\//.test(url || "")) || ""
    : "";
  const statusLabel = String(task.status || "unknown").replace(/_/g, " ");
  const statusSymbol = ({ planning: "→", review: "✓", building: "↗", hold: "Ⅱ", done: "✓", closed: "×", intake: "○" })[tone] || "○";
  return `<section class="ticket-status-panel tone-${tone}">
      <div class="status-heading">
        <div class="status-kicker"><span class="status-symbol" aria-hidden="true">${statusSymbol}</span>${esc(statusLabel)}</div>
        <div class="status-heading-actions">
          ${task.external_url
            ? `<a class="status-ticket-ref" href="${esc(task.external_url)}" target="_blank" rel="noopener">${esc(taskRef(task))} ↗</a>`
            : `<span class="status-ticket-ref">${esc(taskRef(task))}</span>`}
          ${renderAutonomy(side.triage)}
        </div>
      </div>
      ${renderExecutionTarget(task, side.triage, side)}
      ${prUrl ? `<div class="status-controls">
        <a class="status-pr" href="${esc(prUrl)}" target="_blank" rel="noopener">Go to pull request</a>
      </div>` : ""}
    </section>
    <aside class="decisions"><div class="record-sections">
      <details class="dsec decision-section" ${allSettled ? "" : "open"}>
        <summary class="drail-h">Decisions<span class="gn ${allSettled ? "set" : ""}">${settled}/${(questions || []).length}</span><span class="decision-chevron">▼</span></summary>
        <div class="decision-list">${rows || `<p class="empty">No questions yet.</p>`}</div>
        ${allSettled ? `<div class="dnote">Reopen one and it goes back to the agent as an open question.</div>` : ""}
      </details>
      ${memory}
      ${renderActivity(side.activities, side.checkpoints)}
      ${deliverables}
      ${subtasks}
      <div class="dsum">${blocking ? `<b>${blocking}</b> blocking planning<br>`
        : side.needsRepoConfirm ? `<b>confirm repository</b> before planning<br>`
        : side.needsConfirm ? `<b>confirm</b> to start planning<br>` : ""}
        Everything settled here lands in <code>.planning/</code> as the phase brief.</div>
    </div></aside>`;
}

function renderConversation(triage, activeId, side = {}) {
  const qs = triage?.questions || [];
  const active = activeQuestion(qs, activeId);
  // Everything settled, then the one question being answered. Nothing further:
  // dumping all six at once is a form, not a conversation, and it forced the
  // composer to restate which one you were on — the same question twice, once
  // full size and once as a grey line by the box.
  // Everything settled, then the one question being answered. Nothing further.
  // Settled questions collapse to a single line: they are the record, and a record
  // does not need to occupy the room the live question needs. Open one and the
  // whole exchange is still there.
  const groups = new Map();
  for (const ev of chatTimeline(qs)) {
    if (!(ev.q.answer || ev.q.deferred || ev.q.id === active?.id)) continue;
    if (!groups.has(ev.q.id)) groups.set(ev.q.id, { q: ev.q, events: [] });
    groups.get(ev.q.id).events.push(ev);
  }
  const later = blockingQuestions(qs).filter(q => q.id !== active?.id).length;
  const stream = [...groups.values()].map(({ q, events }) => {
    const inner = events.map(renderChatEvent).join("");
    if (q.id === active?.id) return inner;
    const said = events.filter(e => e.kind === "said").length;
    const outcome = q.answer
      ? `${esc(String(q.answer).slice(0, 60))}${q.answered_by === "agent" ? " · chosen for you" : ""}`
      : "set aside";
    return `<details class="csettled"${q.delegated_answer ? " open" : ""}><summary>
      <span class="cs-tag">${esc(q.becomes || "—")}</span>
      <span class="cs-q">${esc(q.question)}</span>
      <span class="cs-a">${outcome}</span>
      ${said ? `<span class="cs-n">${said} message${said > 1 ? "s" : ""}</span>` : ""}
    </summary><div class="cs-body">${inner}</div></details>`;
  }).join("") || renderFound(triage, side.activities);

  // Design 2c: when the last question settles the thread keeps going in place. The
  // rule marks where triage ended and the plan lands underneath it as a message.
  const nothingBlocking = !blockingQuestions(qs).length;
  const settledMark = (nothingBlocking && qs.some(q => q.answer || q.deferred))
    ? renderSettledMark(qs) : "";
  // The gate the daemon actually enforces. Deferred questions do not block the
  // thread, but the bridge's confirm path requires every question answered, so a
  // ticket with one set aside cannot be confirmed from here and must not pretend
  // otherwise.
  // A ticket triage had no questions about still needs confirming — that is the
  // path with no gate at all until now, and the one where nobody was consulted.
  // Its state exists only because the bridge creates one for exactly this.
  const targetRepos = triage?.execution_target?.repos?.length
    ? triage.execution_target.repos : (triage?.triage_repos || []);
  const targetLabels = targetRepos.map(r => r.label || `${r.project}/${r.repo}`).filter(Boolean);
  // Existing confirmed tickets predate the explicit repository receipt. Honour
  // those while making every new unconfirmed ticket acknowledge exactly one repo.
  const legacyRepoConfirmed = !!triage?.confirmed && !("repo_confirmed" in triage);
  const repoReady = !side.task || (targetLabels.length === 1
    && (triage?.repo_confirmed === targetLabels[0] || legacyRepoConfirmed));
  // Confirmation is a pre-dispatch gate. Older triage receipts may not carry the
  // explicit confirmation fields, but once a ticket has left inbox/planning the
  // branch/worktree already exists and asking for confirmation is both stale and
  // impossible because the execution target is intentionally read-only.
  const canConfirmBeforeDispatch = !side.task
    || ["inbox", "planning"].includes(side.task.status);
  const needsRepoConfirm = canConfirmBeforeDispatch
    && nothingBlocking && !!triage && !triage.confirmed && !repoReady
    && (qs.length ? qs.every(q => q.answer) : true);
  const needsConfirm = canConfirmBeforeDispatch
    && nothingBlocking && !!triage && !triage.confirmed && repoReady
    && (qs.length ? qs.every(q => q.answer) : true);
  // Between the last answer and the plan landing there is a real wait — planning
  // took 18 minutes on the run this was built against. The thread says so rather
  // than ending on a rule with nothing under it.
  const planCard = renderPlanCard(side.plan, side.progress, qs, side.planOpen, side.agentProgress)
    || (settledMark ? `<div class="cmsg"><span class="cav">${esc(AVATAR)}</span>
        <div><div class="cbody">${needsRepoConfirm
          ? "That is everything. Choose the Repo dropdown in the status card before planning starts."
          : needsConfirm
            ? "That is everything. Confirm below and I will branch, set up a worktree and write the plan."
            : "That is everything. Writing the plan next — it lands here."}</div>
        ${needsConfirm || needsRepoConfirm ? "" : `<div class="cwait"><i></i>planning<span class="el">no plan on disk yet</span></div>`}</div></div>` : "");
  const map = (side.planOpen && side.plan)
    ? `<div class="pmap">${planMap(side.plan, side.progress, triage, side.agentProgress)}</div>` : "";

  // Two flat siblings, not a box inside a box: the shell places the stream in the
  // middle column and the record in the right rail, and each runs its own height.
  // "n of m settled" moved onto the ticket header, where the design has it — it is
  // a fact about the ticket, and it was being stated twice.
  return `<div class="convo">
      <div class="stream" id="stream"><div class="stream-in">${stream}${settledMark}${planCard}${map}${renderNotes(side.activities, side.checkpoints)}</div></div>
      ${renderComposer(active, later, { ...side, questions: qs, needsConfirm, needsRepoConfirm,
          executionTarget: triage?.execution_target || {},
          // Read off the triage state here rather than only in load(), so the
          // renderer is complete on its own and testable without the page.
          assessedLevel: triage?.assessed_level || side.assessedLevel || "",
          assessedWhy: triage?.assessed_why || side.assessedWhy || [] })}
    </div>
    ${renderDecisions(qs, active?.id, { ...side, needsConfirm, needsRepoConfirm, triage })}`;
}

/**
 * One place a question action is posted, so the exits and the composer cannot drift
 * apart. `onOk` runs only after the response is checked, which keeps a failed
 * request from clearing what you typed.
 */
async function postQuestionAction(qid, action, payload = {}, onOk = null) {
  try {
    const res = await fetch(
      `/api/tasks/${encodeURIComponent(taskId)}/questions/${encodeURIComponent(qid)}/${action}`,
      { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) },
    );
    if (!res.ok) throw new Error(`${action} failed (${res.status})`);
    onOk?.();
    load({ force: true });
    return true;
  } catch (e) {
    const note = document.querySelector(".cactive") || document.querySelector(".cfoot");
    if (note) note.textContent = String(e.message || e);
    return false;
  }
}

async function resolveCheckpoint(checkpointId, decision, response = "") {
  try {
    const res = await fetch(`/api/checkpoints/${encodeURIComponent(checkpointId)}/resolve`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ decision, response: response || undefined }),
    });
    if (!res.ok) throw new Error(`decision failed (${res.status})`);
    load({ force: true });
    return true;
  } catch (e) {
    const note = document.querySelector(".checkpoint-composer .cfoot");
    if (note) note.textContent = String(e.message || e);
    return false;
  }
}

/**
 * The exits, delegated once. "Let the agent decide" settles a question
 * without answering it; reopen takes an answer or a deferral back.
 */
/**
 * Switching tickets without reloading the document.
 *
 * The rail's rows stay real links — middle-click, ⌘-click and "copy link address"
 * keep working, and landing on the URL directly still works. A plain left click is
 * intercepted instead: swapping one column does not justify refetching the page,
 * the rail, and every ticket in it.
 *
 * Delegated once at the document, because the rail is replaced on every render.
 */
function wireRailNavigation() {
  document.addEventListener("click", (ev) => {
    // Anything the browser should handle itself, it still does.
    if (ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
    const link = ev.target.closest("a.rt");
    if (!link) return;
    ev.preventDefault();
    const next = new URL(link.href, location.href).searchParams.get("id");
    if (next && next !== taskId) goToTicket(next, true);
  });
  // Back and forward move between tickets, because they are separate URLs.
  window.addEventListener("popstate", () => {
    const id = new URLSearchParams(location.search).get("id") || "";
    if (id && id !== taskId) goToTicket(id, false);
  });
}

/** Point the page at another ticket, clearing everything scoped to the old one. */
function goToTicket(id, push) {
  taskId = id;
  // All of this belongs to the ticket you were on. Carried over, the new ticket
  // opens focused on a question that is not on it, or showing its plan map open.
  focusedQuestion = null;
  selectedStep = null;
  planOpen = false;
  lastRenderKey = null;
  sideData = { ...sideData, children: [], deliverables: [], recalled: null, loaded: false };
  if (push) history.pushState({ id }, "", `/ticket?id=${encodeURIComponent(id)}`);
  load({ force: true });
}

function wireQuestionActions() {
  document.addEventListener("click", async (ev) => {
    const btn = ev.target.closest("[data-act][data-q]");
    if (!btn) return;
    const { act, q: qid } = btn.dataset;
    // Bringing a question back is the same edit as taking an answer back: reopen
    // clears the answer and the deferral together.
    const action = act === "undefer" ? "reopen" : act;
    btn.disabled = true;
    const ok = await postQuestionAction(qid, action);
    if (!ok) btn.disabled = false;
  });
}

// Which question is live. Held outside the render so a poll cannot move the
// inline answer field or its related chat under someone mid-sentence.
let focusedQuestion = null;

/**
 * Options that ask for prose instead of standing for an answer.
 *
 * Triage always appends "Other (please specify)" so none of its choices is a dead
 * end. It is a placeholder: binding it verbatim records a decision that says
 * nothing, and the plan then has to cite it.
 */
function isFreeTextOption(option) {
  return /please specify|^\s*other\s*$/i.test(String(option || ""));
}
// Whether the plan card has the full map open under it.
let planOpen = false;

/**
 * What the footer says when nothing is waiting on you.
 *
 * Read off progress rather than status, because "in_progress" on the ticket and a
 * step actually running are different claims and only one of them is checkable.
 */
function runStatus(task, plan, progress, questions = [], agentProgress = null) {
  const steps = (plan && plan.steps) || [];
  const st = n => (progress && progress.steps && progress.steps[String(n)]) || {};
  if (!steps.length) {
    // Saying "planning starts when the questions are settled" under a thread where
    // they are all settled is the page disagreeing with itself.
    return (questions.length && !blockingQuestions(questions).length)
      ? "everything is settled · the planner runs next"
      : "planning starts when the questions are settled";
  }
  if (["review", "in_review", "testing"].includes(task.status)) {
    return "every step is done · human review required";
  }
  // Same derivation the map and the card use, so the footer cannot disagree with the
  // picture above it — it said "0 of 22 done" beside a plan whose first steps were
  // committed.
  const states = stepStates(plan, progress, agentProgress);
  const running = steps.filter(s => states[s.step] === "run").length;
  const done = steps.filter(s => states[s.step] === "done").length;
  const stuck = steps.filter(s => states[s.step] === "blocked").length;
  if (stuck) return `nothing needs you yet · ${stuck} step${stuck > 1 ? "s" : ""} stopped`;
  if (running) return `nothing needs you · ${done} of ${steps.length} done, ${running} running`;
  if (done === steps.length) return `every step is done · next stop is review`;
  return `nothing needs you · ${done} of ${steps.length} done, nothing running`;
}

/**
 * What is running on this ticket right now, for the header's live chip.
 *
 * Taken from the step that is actually in progress rather than from the registry:
 * `agent_profile` is the runtime that ran it, which is the thing a reader wants
 * when they are deciding how much to trust what just came back. Nothing running,
 * nothing claimed.
 */
function liveAgent(task, progress, agentProgress = null) {
  const steps = Object.values((progress && progress.steps) || {});
  const running = steps.find(s => s.status === "in_progress");
  if (running) return running.agent_profile || "working";
  if (["running", "waiting", "blocked"].includes(agentProgress?.state)) {
    return agentProgress.agent_profile || task.agent_profile || "working";
  }
  return task.status === "planning" ? "triage" : "";
}

/** The description toggle. */
function wireHeader() {
  const more = document.querySelector("[data-more]");
  const full = document.querySelector("[data-fulldesc]");
  if (more && full) {
    more.addEventListener("click", () => {
      const open = !full.hidden;
      full.hidden = open;
      more.setAttribute("aria-expanded", String(!open));
      more.textContent = open ? "▾ description" : "▴ description";
    });
  }
  document.querySelector("[data-start-preview]")?.addEventListener("click", ev =>
    startTaskPreview(ev.currentTarget));
}
// What the last render was built from, so an unchanged poll is a no-op.
let lastRenderKey = null;

/**
 * The composer, the option buttons, and focusing a question from the panel.
 *
 * Question fields answer; the bottom composer chats. They are wired separately so
 * Enter never crosses from one intent into the other.
 */
function wireConversation(triage, keptScroll = null, openGroups = []) {
  // Re-open whatever the reader had expanded; a poll should not fold their place away.
  for (const id of openGroups) {
    document.querySelector(`[data-for="${CSS.escape(id)}"]`)?.closest("details.csettled")
      ?.setAttribute("open", "");
  }
  const stream = $("#stream");
  if (stream) {
    // Follow the conversation only for someone already at the bottom of it.
    // Yanking a reader back to the newest message every fifteen seconds is how
    // the page ends up moving under them.
    if (!keptScroll || keptScroll.atBottom) stream.scrollTop = stream.scrollHeight;
    else stream.scrollTop = keptScroll.top;
  }

  const say = $("#say");
  const checkpointReply = $("#checkpoint-reply");
  const checkpointId = document.querySelector("[data-checkpoint]")?.dataset.checkpoint || "";
  const composer = document.querySelector("[data-active]");
  const activeId = composer?.dataset.active || null;

  const noteKind = document.querySelector("[data-note]")?.dataset.note || "";

  const send = async (mode) => {
    const text = (say?.value || "").trim();
    if (!text) { say?.focus(); return; }
    // No question in focus means the message is about the ticket, not about a
    // question — the drawer's channel, so both surfaces reach the agent alike.
    if (mode === "note" || !activeId) { await postNote(text, noteKind, say); return; }
    await postQuestionAction(activeId, "ask", { text }, () => { if (say) say.value = ""; });
  };

  document.querySelectorAll("[data-send]").forEach(btn =>
    btn.addEventListener("click", () => send(btn.dataset.send)));

  const submitCheckpoint = () => {
    const response = (checkpointReply?.value || "").trim();
    if (!response) { checkpointReply?.focus(); return; }
    resolveCheckpoint(checkpointId, "answer", response);
  };
  document.querySelectorAll("[data-cp-decision]").forEach(btn =>
    btn.addEventListener("click", () =>
      resolveCheckpoint(checkpointId, btn.dataset.cpDecision, btn.dataset.cpResponse || "")));
  document.querySelector("[data-cp-submit]")?.addEventListener("click", submitCheckpoint);
  checkpointReply?.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitCheckpoint(); }
  });

  // Enter sends as a message. Recording a decision is the deliberate button.
  say?.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send("ask"); }
  });

  // The live question has its own answer field. Both Enter and its button settle
  // the decision directly; neither can enter the chat/ask path.
  document.querySelectorAll("[data-free]").forEach(field => {
    const submit = () => {
      const answer = field.value.trim();
      if (!answer) { field.focus(); return; }
      recordAnswer(triage, field.dataset.free, answer);
    };
    field.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
    });
    document.querySelector(`[data-submit-answer="${CSS.escape(field.dataset.free)}"]`)
      ?.addEventListener("click", submit);
  });

  document.querySelectorAll("[data-answer]").forEach(btn =>
    btn.addEventListener("click", () => {
      // "Other (please specify)" is a prompt for an answer, not an answer. Triage
      // appends it to every multiple_choice question (`bridge.py:5293`), and this
      // handler bound it like any other option — so choosing it recorded the
      // literal string "Other (please specify)" as the decision and settled the
      // question, with no way to say what you actually meant. It has to point the
      // composer at the question instead and let what you type be the answer.
      if (isFreeTextOption(btn.dataset.answer)) {
        focusedQuestion = btn.dataset.q;
        document.querySelector(`[data-free="${CSS.escape(btn.dataset.q)}"]`)?.focus();
        return;
      }
      recordAnswer(triage, btn.dataset.q, btn.dataset.answer);
    }));

  // Confirm is the only write on this page that causes anything to be created —
  // branch, worktree, tmux session. It says so, and it asks once.
  document.querySelectorAll('[data-act="confirm"]').forEach(btn =>
    btn.addEventListener("click", () => confirmTriage(triage, btn)));

  document.querySelectorAll("[data-focus]").forEach(btn =>
    btn.addEventListener("click", () => { focusedQuestion = btn.dataset.focus; load({ force: true }); }));

  // Choosing an autonomy preset. Written to the same triage state the bridge reads,
  // so the next poll honours it — including turning a gate back on.
  document.querySelectorAll("[data-level]").forEach(btn =>
    btn.addEventListener("click", () => setProcessLevel(triage, btn.dataset.level)));

  document.querySelectorAll("[data-autonomy]").forEach(el =>
    el.addEventListener("toggle", () => { autonomyOpen = el.open; }));

  // The plan card is a summary; the map is the shape. One switch between them.
  document.querySelectorAll("[data-planopen]").forEach(btn =>
    btn.addEventListener("click", () => { planOpen = !planOpen; load({ force: true }); }));

  document.querySelector("[data-hold-task]")?.addEventListener("click", ev =>
    putTaskOnHold(ev.currentTarget));
  document.querySelector("[data-close-task]")?.addEventListener("click", ev =>
    closeTask(ev.currentTarget));
  document.querySelector("[data-reset-triage]")?.addEventListener("click", ev =>
    resetTaskTriage(ev.currentTarget));

  const repoSelect = document.querySelector("[data-repo-select]");
  repoSelect?.addEventListener("change", () => confirmTaskRepo(triage, repoSelect));
}

/** One consistent safety panel for reversible but disruptive ticket actions. */
function confirmSafety(title, message, confirmLabel) {
  const dialog = document.querySelector("#safety-confirm");
  if (!dialog?.showModal) return Promise.resolve(window.confirm(message));
  dialog.querySelector("[data-safety-title]").textContent = title;
  dialog.querySelector("[data-safety-message]").textContent = message;
  dialog.querySelector("[data-safety-confirm]").textContent = confirmLabel;
  return new Promise(resolve => {
    dialog.addEventListener("close", () => resolve(dialog.returnValue === "confirm"), { once: true });
    dialog.showModal();
  });
}

/** Start the existing local preview service and open the ticket's branch. */
async function startTaskPreview(btn) {
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Starting preview…";
  try {
    const res = await fetch(`/api/tasks/${encodeURIComponent(taskId)}/preview`, { method: "POST" });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.url) throw new Error(data.error || `preview failed (${res.status})`);
    window.open(data.url, "_blank", "noopener");
    load({ force: true });
  } catch (e) {
    btn.disabled = false;
    btn.textContent = original;
    const note = document.querySelector(".summary-note") || document.querySelector(".cfoot");
    if (note) note.textContent = String(e.message || e);
  }
}

/** Park the task without deleting its plan, history, branch, or worktree. */
async function putTaskOnHold(btn) {
  const confirmed = await confirmSafety(
    "Pause this task?",
    "Mission Control will put it on hold. The plan, history, branch, and worktree stay intact.",
    "Pause task",
  );
  if (!confirmed) return;
  if (btn) { btn.disabled = true; btn.textContent = "Pausing…"; }
  try {
    const res = await fetch(`/api/tasks/${encodeURIComponent(taskId)}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status: "on_hold" }),
    });
    if (!res.ok) throw new Error(`could not pause task (${res.status})`);
    load({ force: true });
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Pause task"; }
    const note = document.querySelector(".summary-note") || document.querySelector(".cfoot");
    if (note) note.textContent = String(e.message || e);
  }
}

/** Close the ticket locally and, when linked, in Linear before recording success. */
async function closeTask(btn) {
  const confirmed = await confirmSafety(
    "Close this ticket?",
    "Mission Control will move it to Closed and clear pending decisions. A linked Linear issue will be canceled too. The ticket itself is not deleted.",
    "Close ticket",
  );
  if (!confirmed) return;
  if (btn) { btn.disabled = true; btn.textContent = "Closing…"; }
  try {
    const res = await fetch(`/api/tasks/${encodeURIComponent(taskId)}/close`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({}),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || `could not close ticket (${res.status})`);
    }
    load({ force: true });
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Close ticket"; }
    const note = document.querySelector(".summary-note") || document.querySelector(".cfoot");
    if (note) note.textContent = String(e.message || e);
  }
}

/** Return the ticket to triage, clearing decisions and archiving its current plan. */
async function resetTaskTriage(btn) {
  const currentTask = (sideData.tasks || []).find(row => row.id === taskId);
  const hasPullRequest = [currentTask?.pr_url, ...(sideData.deliverables || [])
    .filter(d => ["pr", "pull_request"].includes(String(d.deliverable_type || "").toLowerCase()))
    .map(d => d.path)].some(Boolean);
  const confirmed = await confirmSafety(
    "Reset triage?",
    `This clears the current triage decisions and archives the active plan. The ticket itself is kept.${hasPullRequest
      ? " Its pull request will be closed now, then reopened and updated if re-triage keeps the same repository."
      : ""}`,
    "Reset triage",
  );
  if (!confirmed) return;
  if (btn) { btn.disabled = true; btn.textContent = "Resetting…"; }
  try {
    const res = await fetch(`/api/tasks/${encodeURIComponent(taskId)}/reset-triage`, { method: "POST" });
    if (!res.ok) throw new Error(`could not reset triage (${res.status})`);
    delete ticketPlanCache[taskId];
    focusedQuestion = null;
    planOpen = false;
    load({ force: true });
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Reset triage"; }
    const note = document.querySelector(".summary-note") || document.querySelector(".cfoot");
    if (note) note.textContent = String(e.message || e);
  }
}

/**
 * A message about the ticket rather than about a question.
 *
 * Posted as an activity, which is the channel the bridge already reads: at review
 * an unacknowledged `manual_feedback` becomes a change request and relaunches the
 * agent (`bridge.py:4561`); during planning a `planning_answer` is folded into the
 * planner's context. Same endpoint and same type mapping as the dashboard drawer,
 * so a note typed here and one typed there are indistinguishable downstream.
 */
async function postNote(text, kind, say) {
  try {
    const res = await fetch(`/api/tasks/${encodeURIComponent(taskId)}/activities`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      // Marked as a person's, positively. Without it a note on an in-progress
      // ticket is an `updated` activity, which is also what MC narrates itself
      // with — indistinguishable, and the reader is told the bridge is talking.
      body: JSON.stringify({
        activity_type: kind || "updated",
        message: text,
        metadata: JSON.stringify({ source: "human", via: "ticket-page" }),
        expects_reply: true,
      }),
    });
    if (!res.ok) throw new Error(`send failed (${res.status})`);
    if (say) say.value = "";
    load({ force: true });
  } catch (e) {
    const note = document.querySelector(".cfoot");
    if (note) note.textContent = String(e.message || e);
  }
}

/** Confirm the single repository before the broader start-planning gate. */
async function confirmTaskRepo(triage, btn) {
  const select = document.querySelector("[data-repo-select]");
  const label = (select?.value || "").trim();
  const slash = label.indexOf("/");
  if (!triage || slash < 1 || slash === label.length - 1) return;
  const project = label.slice(0, slash);
  const repo = label.slice(slash + 1);
  const next = JSON.parse(JSON.stringify(triage));
  const previous = (next.execution_target?.repos || []).find(r =>
    (r.label || `${r.project}/${r.repo}`) === label) || {};
  next.triage_repos = [{ project, repo }];
  next.execution_target = {
    ...(next.execution_target || {}),
    repos: [{ ...previous, project, repo, label }],
  };
  next.repo_confirmed = label;
  // Repository selection and authorization to create a branch are separate
  // receipts. Changing the former must require the latter again.
  next.confirmed = false;
  if (btn) btn.disabled = true;
  try {
    const res = await fetch(`/api/tasks/${encodeURIComponent(taskId)}/triage-state`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(next),
    });
    if (!res.ok) throw new Error(`repository confirmation failed (${res.status})`);
    load({ force: true });
  } catch (e) {
    if (btn) btn.disabled = false;
    const note = document.querySelector(".repo-field .k") || document.querySelector(".cactive");
    if (note) note.textContent = String(e.message || e);
  }
}

/**
 * Confirm: the one write on this page that creates anything.
 *
 * `bridge.py:5050` will not dispatch until `confirmed` is true, and it polls the
 * ticket every 60 seconds while it waits. The dashboard's triage modal has always
 * been able to set this; the ticket page could not, so a ticket settled here sat
 * unplanned indefinitely. `status: "answered"` matches what that modal writes, so
 * the two surfaces leave the ticket in the same state.
 */
async function confirmTriage(triage, btn) {
  const next = JSON.parse(JSON.stringify(triage));
  next.confirmed = true;
  next.status = "answered";
  if (btn) { btn.disabled = true; btn.textContent = "Confirming…"; }
  try {
    const res = await fetch(`/api/tasks/${encodeURIComponent(taskId)}/triage-state`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(next),
    });
    if (!res.ok) throw new Error(`confirm failed (${res.status})`);
    load({ force: true });
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Confirm and start planning"; }
    const note = document.querySelector(".cactive");
    if (note) note.textContent = String(e.message || e);
  }
}

/** Choose how much process this ticket needs, overriding what was assessed. */
async function setProcessLevel(triage, level) {
  const next = JSON.parse(JSON.stringify(triage || {}));
  next.process_level = level || "";
  // Picking one is the end of the errand: fold back to the single line, the way
  // the mode switch you just used does.
  autonomyOpen = false;
  try {
    const res = await fetch(`/api/tasks/${encodeURIComponent(taskId)}/triage-state`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(next),
    });
    if (!res.ok) throw new Error(`could not set level (${res.status})`);
    load({ force: true });
  } catch (e) {
    const note = document.querySelector(".dnote");
    if (note) note.textContent = String(e.message || e);
  }
}

/** Record one answer as the decision it binds. */
async function recordAnswer(triage, qid, answer) {
  const next = JSON.parse(JSON.stringify(triage));
  const q = (next.questions || []).find(x => x.id === qid);
  if (!q) return;
  q.answer = answer;
  q.answered_at = new Date().toISOString();
  q.answered_by = "you";
  q.deferred = false;
  q.delegate_requested = false;
  try {
    const res = await fetch(`/api/tasks/${encodeURIComponent(taskId)}/triage-state`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(next),
    });
    if (!res.ok) throw new Error(`save failed (${res.status})`);
    const field = document.querySelector(`[data-free="${CSS.escape(qid)}"]`);
    if (field) field.value = "";
    focusedQuestion = null;      // settled, so the composer moves to whatever is next
    load({ force: true });
  } catch (e) {
    const note = document.querySelector(`[data-answer-error="${CSS.escape(qid)}"]`) || document.querySelector(".cactive");
    if (note) note.textContent = String(e.message || e);
  }
}

/** Every field someone can be part-way through typing into. */
const DRAFT_FIELDS = "#say,#checkpoint-reply,[data-free],[data-ask]";

/**
 * Is someone part-way through typing?
 *
 * The page re-renders by replacing all of #root, so a poll landing mid-sentence
 * threw the sentence away. Anything focused counts, and so does anything with text
 * in it — a draft you have clicked away from is still a draft.
 */
function isEditing() {
  const active = document.activeElement;
  if (active && /^(INPUT|TEXTAREA)$/.test(active.tagName)) return true;
  return [...document.querySelectorAll(DRAFT_FIELDS)].some(el => el.value.trim());
}

/** What has been typed but not sent, so a re-render can put it back. */
function captureDrafts() {
  const drafts = {};
  document.querySelectorAll(DRAFT_FIELDS).forEach(el => {
    // The composer is one field for the whole conversation, so it keys on itself
    // rather than on a question id: the text belongs to the person typing, not to
    // whichever question happened to be in focus when they started.
    const key = el.id === "say" ? "say"
      : el.id === "checkpoint-reply" ? "checkpoint-reply"
      : el.dataset.free ? `free:${el.dataset.free}` : `ask:${el.dataset.ask}`;
    if (el.value.trim()) drafts[key] = el.value;
  });
  return drafts;
}

function restoreDrafts(drafts) {
  for (const [key, value] of Object.entries(drafts)) {
    let el;
    if (key === "say" || key === "checkpoint-reply") {
      el = document.querySelector(`#${key}`);
    } else {
      const kind = key.slice(0, key.indexOf(":"));
      const id = key.slice(key.indexOf(":") + 1);
      el = document.querySelector(`[data-${kind === "free" ? "free" : "ask"}="${CSS.escape(id)}"]`);
    }
    // Never over a value the new render already put there — the saved answer wins
    // over a stale draft of itself.
    if (el && !el.value) el.value = value;
  }
}

/**
 * The side data the ticket shell needs.
 *
 * Recall shells out to Python and depends on a store that may not be configured,
 * so it is allowed to fail quietly: the rail simply has no RECALLED section. The
 * ticket list also carries the lightweight attention signals used by the rail, so
 * it is refreshed without re-fetching every ticket's detail payload.
 */
let sideData = { tasks: [], children: [], deliverables: [], recalled: null, repoOptions: [], loaded: false };
// A visited ticket keeps its own plan snapshot. Without this, selecting another
// ticket replaced the previous card's step bars with the generic lifecycle track.
const ticketPlanCache = {};

async function refreshRailTasks() {
  const rows = await getJson("/api/tasks");
  sideData.tasks = Array.isArray(rows) ? rows : (rows?.tasks || []);
  return sideData.tasks;
}

async function loadSideData(task) {
  if (sideData.loaded) return;
  sideData.loaded = true;
  refreshRailTasks().then(() => load({ force: true })).catch(() => {});
  getJson("/api/repos").then(res => {
    sideData.repoOptions = (res?.repos || [])
      .map(repo => repo.domain || [repo.project, repo.repo].filter(Boolean).join("/"))
      .filter(Boolean);
    load({ force: true });
  }).catch(() => {});
  // The rail's other two sections, per design 2c. Both are allowed to be empty and
  // neither renders a heading when it is.
  getJson(`/api/tasks/${encodeURIComponent(taskId)}/children`).then(rows => {
    if (Array.isArray(rows) && rows.length) { sideData.children = rows; load({ force: true }); }
  }).catch(() => {});
  getJson(`/api/tasks/${encodeURIComponent(taskId)}/deliverables`).then(rows => {
    if (Array.isArray(rows) && rows.length) { sideData.deliverables = rows; load({ force: true }); }
