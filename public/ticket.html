<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket · Mission Control</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231A1F29'/%3E%3Cpath d='M8 20h16M8 20l4-8 4 5 3-4 5 7' stroke='%232563EB' stroke-width='1.8' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
  /* The dashboard's tokens, verbatim. Colour carries one meaning here: amber means
     a human is the blocker and nothing else may use it, green is live/settled,
     cyan is the current actionable thing, red is dead/denied. */
  :root {
    --bg-main:   #0a0a0f;
    --bg-card:   #12121a;
    --bg-drawer: #161622;
    --line:      #1a1a2e;
    --line-soft: rgba(255,255,255,.05);
    --ink:       #e0e0e0;
    --ink-2:     rgba(224,224,224,.86);
    --ink-3:     rgba(224,224,224,.44);
    --ink-4:     rgba(224,224,224,.34);
    --accent:    #00d4ff;
    --accent-bg: rgba(0,212,255,.06);
    --accent-line: rgba(0,212,255,.16);
    --amber:     #f59e0b;
    --amber-bg:  rgba(245,158,11,.05);
    --amber-line:rgba(245,158,11,.28);
    --green:     #00ff88;
    --green-bg:  rgba(0,255,136,.13);
    --cyan:      #00d4ff;
    --cyan-bg:   rgba(0,212,255,.08);
    --red:       #ef4444;
    --red-bg:    rgba(239,68,68,.1);
    --indigo:    #818cf8;
    --card:      #12121a;
    --sunk:      rgba(255,255,255,.035);
    --ground:    #0a0a0f;
    --shadow:    none;
    --ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--ui); font-size: 14px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1180px; margin: 0 auto; padding: 26px 22px 90px; }
  a { color: var(--accent); }
  h1, h2 { margin: 0; font-weight: 600; }
  .crumb { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 12.5px; }
  .crumb .brand { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-size: 11px; }

  /* ─────────── ticket ─────────── */
  .ticket {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 26px 28px 24px; box-shadow: var(--shadow);
  }
  .tk-row1 { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .tk-id {
    display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono);
    font-size: 12px; font-weight: 600; color: var(--ink-2); text-decoration: none;
  }
  .tk-id:hover { color: var(--accent); }
  .state { font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 20px; display: inline-flex; align-items: center; gap: 6px; }
  .state i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .state.s-plan { color: var(--amber); background: var(--amber-bg); }
  .state.s-run  { color: var(--cyan);  background: var(--cyan-bg); }
  .state.s-rev  { color: var(--green); background: var(--green-bg); }
  .tk-meta { margin-left: auto; display: flex; gap: 18px; font-size: 12.5px; color: var(--ink-3); flex-wrap: wrap; }
  .tk-meta b { color: var(--ink-2); font-weight: 500; font-family: var(--mono); }
  h1.tk-title { font-size: 25px; letter-spacing: -.028em; margin: 0 0 9px; line-height: 1.22; }
  .tk-desc { font-size: 14.5px; color: var(--ink-2); margin: 0; max-width: 74ch; }

  /* ─────────── progress track ─────────── */
  .tracker { margin-top: 24px; padding-top: 8px; border-top: 1px solid var(--line-soft); }
  /* overflow-x:auto clips vertically too, so the pill's headroom must live on the
     scrolling element itself — negative margin keeps it from pushing the layout down */
  .track-scroll { overflow-x: auto; overflow-y: hidden; padding: 48px 10px 2px; margin: -6px -10px 0; }
  .track-inner { min-width: 700px; }
  .tk-bar { position: relative; height: 6px; border-radius: 3px; background: var(--line); }
  .tk-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--cyan); transition: width .45s cubic-bezier(.4,0,.2,1); }
  .tk-bar.finished .tk-fill { background: var(--green); }
  .tk-tick { position: absolute; top: 50%; width: 3px; height: 3px; border-radius: 50%; background: var(--card); transform: translate(-50%,-50%); opacity: .8; }
  .tk-knob {
    position: absolute; top: 50%; width: 17px; height: 17px; border-radius: 50%;
    background: var(--card); border: 3px solid var(--cyan);
    transform: translate(-50%,-50%); z-index: 3; transition: left .45s cubic-bezier(.4,0,.2,1);
  }
  .tk-bar.finished .tk-knob { border-color: var(--green); }
  .tk-pill {
    position: absolute; bottom: 21px; left: 50%; transform: translateX(-50%);
    white-space: nowrap; background: var(--ink); color: var(--ground);
    font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 8px;
  }
  .tk-pill .dim { opacity: .6; font-weight: 500; margin-right: 5px; }
  .tk-pill::after { content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: var(--ink); }
  .tk-labels { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; margin-top: 13px; }
  .tk-labels span { display: flex; flex-direction: column; gap: 1px; align-items: center; text-align: center; }
  .tk-labels .n { font-size: 12px; color: var(--ink-3); }
  .tk-labels .done .n { color: var(--ink-2); }
  .tk-labels .now .n { color: var(--cyan); font-weight: 600; }
  .tk-labels .t { font-family: var(--mono); font-size: 10px; color: var(--ink-3); opacity: .75; }
  .tk-labels .now .t { color: var(--cyan); opacity: 1; }

  /* ─────────── cards ─────────── */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; box-shadow: var(--shadow); margin-top: 20px; }
  .card.sunk { background: var(--sunk); box-shadow: none; }
  .glab {
    font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink-3); margin: 0 0 13px; display: flex; align-items: center; gap: 8px;
  }
  .glab .gn { margin-left: auto; font-family: var(--mono); font-size: 11px; letter-spacing: 0; font-weight: 500; }
  .cols { display: grid; grid-template-columns: 1fr 1.9fr; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

  /* ─────────── plan map (SVG) ─────────── */
  .diagram-wrap { overflow-x: auto; padding: 4px 0 10px; }
  svg.plan-map { display: block; width: 100%; height: auto; }
  svg.plan-map text { font-family: var(--ui); }
  svg.plan-map .sbox { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
  svg.plan-map g.stepg:hover .sbox { stroke: var(--accent); }
  svg.plan-map .snum { fill: var(--ink-3); font-size: 11px; font-weight: 700; font-family: var(--mono); }
  svg.plan-map .stitle { fill: var(--ink); font-size: 13px; font-weight: 600; }
  svg.plan-map .srepo { fill: var(--ink-3); font-size: 11px; font-family: var(--mono); }
  svg.plan-map .flow { stroke: var(--ink-3); stroke-width: 1.5; fill: none; }
  svg.plan-map .cbox { fill: var(--green-bg); stroke: none; }
  svg.plan-map .ctext { fill: var(--green); font-size: 11.5px; font-weight: 600; font-family: var(--mono); }
  svg.plan-map .clab { fill: var(--ink-3); font-size: 10.5px; font-weight: 600; letter-spacing: .1em; font-family: var(--mono); }
  svg.plan-map .dec rect { stroke-width: 1.5; }
  svg.plan-map .dec.open rect { fill: var(--amber-bg); stroke: var(--amber); stroke-dasharray: 4 3; }
  svg.plan-map .dec.set rect { fill: var(--green-bg); stroke: var(--green); }
  svg.plan-map .dec .dt { font-family: var(--mono); font-size: 11px; font-weight: 700; }
  svg.plan-map .dec.open .dt, svg.plan-map .dec.open .ds { fill: var(--amber); }
  svg.plan-map .dec.set .dt, svg.plan-map .dec.set .ds { fill: var(--green); }
  svg.plan-map .dec .ds { font-size: 10.5px; }
  svg.plan-map .dlink { fill: none; stroke-width: 1.5; }
  svg.plan-map .dlink.open { stroke: var(--amber); stroke-dasharray: 4 3; }
  svg.plan-map .dlink.set { stroke: var(--green); opacity: .6; }
  svg.plan-map .nogsd-edge { fill: var(--amber); }
  svg.plan-map g.stepg { cursor: pointer; }
  svg.plan-map g.stepg.sel rect.sbox { stroke: var(--accent); stroke-width: 2.5; }
  svg.plan-map .wv { font-family: var(--mono); font-size: 9.5px; font-weight: 700; fill: var(--ink-3); letter-spacing: .1em; }
  svg.plan-map .wv.wait { fill: var(--amber); }
  svg.plan-map .ghost rect { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 4; }
  svg.plan-map .ghost .stitle, svg.plan-map .ghost .srepo { opacity: .55; }
  svg.plan-map .run rect.sbox { stroke: var(--cyan); stroke-width: 2; }
  svg.plan-map .done rect.sbox { fill: var(--green-bg); stroke: var(--green); }
  svg.plan-map .blocked rect.sbox { stroke: var(--red); }
  svg.plan-map .blocked .snum { fill: var(--red); }
  .sd { background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-top: 14px; }
  .sd-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
  .sd-num { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--ink-3); }
  .sd-title { font-size: 15px; font-weight: 600; letter-spacing: -.014em; }
  .sd-close { margin-left: auto; cursor: pointer; border: none; background: none; color: var(--ink-3); font-size: 18px; line-height: 1; }
  .sd-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-bottom: 10px; }
  .sd-sec { margin-top: 12px; }
  .sd-lab { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px; }
  .sd-body { font-size: 13.5px; color: var(--ink-2); white-space: pre-wrap; }
  .sd-cmd { font-family: var(--mono); font-size: 11.5px; background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; overflow-x: auto; white-space: pre; }
  .sd-ac { font-size: 13px; color: var(--ink-2); padding-left: 16px; position: relative; margin-bottom: 5px; }
  .sd-ac::before { content: "—"; position: absolute; left: 0; color: var(--ink-3); }
  .sd-warn { background: var(--amber-bg); border: 1px solid var(--amber-line); color: var(--amber); border-radius: 8px; padding: 9px 11px; font-size: 12.5px; }
  .maplegend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); padding-bottom: 10px; }
  .maplegend span { display: flex; align-items: center; gap: 6px; }
  .maplegend i { width: 14px; height: 2px; border-radius: 1px; display: block; }
  .maplegend i.f { background: var(--ink-3); }
  .maplegend i.d { background: var(--amber); }
  .maplegend i.s { background: var(--green); opacity: .6; }


  /* ─────────── conversation (design 2b) ─────────── */
  /* Chat column and decision rail. The thread rail from the design is cross-ticket
     navigation and belongs on the dashboard, not on one ticket's page. */
  .convo { display: grid; grid-template-columns: 1fr 224px; gap: 26px; align-items: start; margin-top: 22px; }
  @media (max-width: 900px) { .convo { grid-template-columns: 1fr; } }

  .chat { min-width: 0; }
  .chead {
    display: flex; align-items: center; gap: 10px; padding-bottom: 16px;
    border-bottom: 1px solid var(--line-soft); font-size: 12px; color: var(--ink-3);
  }
  .chead .live { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--green); }
  .chead .live i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: mcpulse 2s ease-in-out infinite; }
  @keyframes mcpulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .chead .settled { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }

  .stream { max-width: 668px; margin: 0 auto; padding: 26px 0; display: flex; flex-direction: column; gap: 26px; max-height: 60vh; overflow-y: auto; }
  .cmsg { display: grid; grid-template-columns: 24px 1fr; gap: 13px; align-items: start; }
  .cav {
    width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--mono); font-size: 9.5px; background: var(--green-bg); color: var(--green);
  }
  .cav.you { background: rgba(255,255,255,.07); color: var(--ink-3); }
  .cbody { font-size: 13.5px; line-height: 1.7; color: var(--ink-2); white-space: pre-wrap; }
  .cq { font-size: 13.5px; line-height: 1.7; color: var(--ink); white-space: pre-wrap; }

  /* A finding is amber because a human is the blocker — the one meaning amber has. */
  .cfind {
    border-left: 2px solid var(--amber); background: var(--amber-bg);
    border-radius: 0 7px 7px 0; padding: 12px 15px; margin-top: 12px;
  }
  .cfind .ft { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .cfind .fb { font-size: 12px; line-height: 1.6; color: var(--ink-2); margin-top: 3px; white-space: normal; }

  .cpills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .cpill {
    font-family: inherit; font-size: 12.5px; padding: 9px 14px; border-radius: 16px;
    border: 1px solid rgba(255,255,255,.12); background: transparent; color: var(--ink-2); cursor: pointer;
  }
  .cpill:hover { border-color: rgba(255,255,255,.28); color: var(--ink); }
  .cpill.rec { border-color: rgba(0,212,255,.3); color: var(--cyan); }
  .cpill.esc { color: var(--ink-3); }

  /* Your turn reads as yours: right-aligned, one corner squared off. */
  .cmsg.me { grid-template-columns: 1fr; }
  .cmsg.me .cbody {
    justify-self: end; max-width: 440px; background: rgba(255,255,255,.07);
    border-radius: 14px 14px 3px 14px; padding: 13px 16px; color: var(--ink);
  }

  .creceipt { font-size: 10.5px; color: var(--green); font-family: var(--mono); }
  .ctool {
    display: flex; gap: 10px; align-items: center; font-family: var(--mono); font-size: 11px;
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 11px; color: var(--ink-3);
  }
  .ctool .ok { color: var(--green); margin-left: auto; }
  .cwait {
    display: flex; align-items: center; gap: 9px; border: 1px dashed rgba(255,255,255,.14);
    border-radius: 7px; padding: 10px 13px; font-size: 12px; color: var(--ink-3); margin-top: 12px;
  }
  .cwait i { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); animation: mcpulse 1.4s ease-in-out infinite; }

  /* ─── composer ─── */
  .composer { max-width: 668px; margin: 0 auto; padding-top: 16px; border-top: 1px solid var(--line-soft); }
  .cactive { font-size: 11.5px; color: var(--ink-4); margin-bottom: 10px; }
  .cactive b { font-family: var(--mono); color: var(--cyan); font-weight: 500; }
  .crow { display: flex; gap: 9px; align-items: center; }
  .crow input {
    flex: 1; min-width: 0; font-family: inherit; font-size: 13.5px; color: var(--ink);
    background: transparent; border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 12px 15px;
  }
  .crow input::placeholder { color: var(--ink-4); }
  .crow input:focus { outline: none; border-color: rgba(0,212,255,.4); }
  .csend {
    width: 30px; height: 30px; border-radius: 8px; border: none; background: var(--cyan);
    color: #04121a; font-size: 15px; cursor: pointer; flex: none;
  }
  .csend:hover { filter: brightness(1.12); }
  .cbtn {
    font-family: inherit; font-size: 12px; padding: 9px 13px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.14); background: transparent; color: var(--ink-2); cursor: pointer;
  }
  .cbtn:hover { border-color: var(--cyan); color: var(--cyan); }
  .cfoot { margin-top: 10px; font-size: 11.5px; color: var(--ink-4); }
  .cexits { display: flex; align-items: center; gap: 8px; margin-top: 11px; font-size: 11.5px; color: var(--ink-4); }

  /* ─── decision rail ─── */
  .decisions { position: sticky; top: 20px; }
  .drail-h { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-4); margin-bottom: 14px; }
  .drow2 {
    display: block; width: 100%; text-align: left; font-family: inherit; cursor: pointer;
    background: none; border: none; border-left: 2px solid rgba(255,255,255,.12);
    padding: 2px 0 2px 11px; margin-bottom: 15px; color: inherit;
  }
  .drow2.set { border-left-color: var(--green); }
  .drow2.on  { border-left-color: var(--cyan); }
  .drow2.agent { border-left-color: var(--amber); }
  .drow2 .dtag { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); display: block; }
  .drow2.set .dtag { color: var(--green); }
  .drow2.on .dtag { color: var(--cyan); }
  .drow2.agent .dtag { color: var(--amber); }
  .drow2 .dq2 { font-size: 11.5px; line-height: 1.4; color: var(--ink-2); display: block; margin-top: 3px; }
  .drow2 .dv { font-size: 11px; color: var(--ink-4); display: block; margin-top: 2px; }
  .dsum { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line-soft); font-size: 11px; line-height: 1.6; color: var(--ink-4); }
  .dsum b { color: var(--amber); font-weight: 500; }

  /* ─────────── questions ─────────── */
  .qbox { border-bottom: 1px solid var(--line-soft); padding: 16px 0; }
  .qbox:first-of-type { padding-top: 0; }
  .qbox:last-of-type { border-bottom: none; padding-bottom: 0; }
  .qhead { display: flex; gap: 9px; align-items: baseline; margin-bottom: 11px; }
  .qnum { font-family: var(--mono); font-size: 11px; color: var(--ink-3); flex: 0 0 auto; }
  .qtext { font-size: 14.5px; letter-spacing: -.012em; line-height: 1.42; }
  .qfrom { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; flex: 0 0 auto; }
  .choices { display: flex; flex-direction: column; gap: 7px; margin-left: 26px; }
  .choice {
    display: flex; gap: 9px; align-items: flex-start; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
    background: var(--card); font-size: 13.5px; transition: border-color .12s, background .12s;
  }
  .choice:hover { border-color: var(--accent-line); }
  .choice.on { border-color: var(--accent); background: var(--accent-bg); }
  .choice input { margin-top: 3px; accent-color: var(--accent); flex: 0 0 auto; }
  .qadd {
    margin: 8px 0 0 26px; width: calc(100% - 26px); min-height: 54px; resize: vertical;
    font-family: inherit; font-size: 13.5px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
  }
  .qadd:focus { outline: none; border-color: var(--accent); }
  /* Why it is being asked. A question whose consequence is invisible gets answered
     carelessly, or not at all. */
  .qwhy { font-size: 13px; color: var(--ink-2); margin: -4px 0 11px 26px; max-width: 68ch; }
  /* What the answer binds. An answer that binds nothing is a comment. */
  .dchip {
    margin-left: auto; font-family: var(--mono); font-size: 10px; font-weight: 700;
    letter-spacing: .06em; padding: 2px 7px; border-radius: 5px; flex: 0 0 auto;
    background: var(--sunk); color: var(--ink-3); border: 1px solid var(--line); white-space: nowrap;
  }
  .dchip.disc { background: var(--amber-bg); color: var(--amber); border-color: transparent; }

  /* The exits. "Answer or the ticket stalls" is a false choice. */
  .qouts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 11px 0 0 26px; }
  .qouts .lead { font-size: 12.5px; color: var(--ink-3); }
  .qout {
    font-family: inherit; font-size: 12.5px; font-weight: 500; padding: 6px 12px;
    border-radius: 20px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink-2); cursor: pointer;
  }
  .qout:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
  .qout:disabled { opacity: .5; cursor: progress; }

  /* The conversation. The person who can answer is usually not the person who can
     look it up, so the question has to be answerable in both directions. */
  .qthread {
    margin: 12px 0 0 26px; padding: 13px 15px; background: var(--sunk);
    border-radius: 11px; display: flex; flex-direction: column; gap: 11px;
  }
  .qmsg { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
  .qwho {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-3); background: var(--card); border: 1px solid var(--line);
    padding: 3px 7px; border-radius: 5px; white-space: nowrap; margin-top: 1px;
  }
  .qmsg.me .qwho { background: var(--accent-bg); border-color: transparent; color: var(--accent); }
  .qbody { font-size: 13.5px; color: var(--ink-2); line-height: 1.55; white-space: pre-wrap; }
  .qpending {
    display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: 9px;
    background: var(--card); border: 1px dashed var(--line); font-size: 12.5px; color: var(--ink-3);
  }
  .qpending .st { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--accent); }
  .qask { display: flex; gap: 8px; align-items: center; }
  .qask input {
    flex: 1; min-width: 0; font-family: inherit; font-size: 13.5px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px;
  }
  .qask input:focus { outline: none; border-color: var(--accent); }

  .qdone { margin-left: 26px; padding: 10px 12px; border-radius: 9px; background: var(--green-bg); font-size: 13.5px; color: var(--ink-2); }
  .qdone .fby { font-size: 11px; color: var(--ink-3); display: block; margin-top: 4px; }
  /* A delegated pick reads as delegated, not decided — and can be taken back. */
  .qdone.byagent { background: var(--amber-bg); border: 1px solid var(--amber-line); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .qdone .pickmark { font-size: 14px; font-weight: 600; color: var(--ink); }
  .qdone .bychip {
    font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--amber); background: var(--card);
    border: 1px solid var(--amber-line); padding: 3px 8px; border-radius: 5px;
  }
  .qdone .undo { margin-left: auto; }
  .qreason { margin: 8px 0 0 26px; font-size: 12.5px; color: var(--ink-2); line-height: 1.55; max-width: 68ch; }
  .qreason b { color: var(--ink); }
  .qset { margin: 10px 0 0 26px; font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 10px; }
  .qbox.deferred .qtext { color: var(--ink-3); }

  .footbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-top: 16px; margin-top: 4px; border-top: 1px solid var(--line-soft); }
  .btn {
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    border-radius: 9px; padding: 9px 16px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .why { font-size: 12.5px; color: var(--ink-3); }

  /* ─────────── settled decisions ─────────── */
  .qdone-wrap { margin-top: 20px; }
  details.settled { background: var(--sunk); border: 1px solid var(--line); border-radius: 14px; }
  details.settled > summary { list-style: none; cursor: pointer; padding: 15px 20px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  details.settled > summary::-webkit-details-marker { display: none; }
  details.settled > summary::before { content: "▸"; color: var(--ink-3); }
  details.settled[open] > summary::before { content: "▾"; }
  details.settled .sct { font-size: 14px; font-weight: 600; }
  .dlist { padding: 0 20px 16px; }
  .drow { padding: 11px 0; border-top: 1px solid var(--line-soft); display: flex; gap: 11px; }
  .dtag { font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--green); background: var(--green-bg); border-radius: 4px; padding: 1px 6px; height: fit-content; flex: 0 0 auto; }
  .dq { font-size: 13px; color: var(--ink-3); }
  .da { font-size: 13.5px; color: var(--ink); margin-top: 2px; }

  /* Follow-ups are the one thing blocking progress, so they lead and they are loud. */
  .card.fu { border-color: var(--amber-line); background: var(--amber-bg); }
  .glab.hot { color: var(--amber); }
  .fu-why { font-size: 13px; color: var(--ink-2); margin: 0 0 14px; max-width: 70ch; }
  .card.fu .choice { background: var(--card); }
  .fitem { padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
  .fitem:last-child { border-bottom: none; padding-bottom: 0; }
  .fitem:first-child { padding-top: 0; }
  .fk { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--amber); background: var(--amber-bg); border-radius: 4px; padding: 1px 6px; display: inline-block; margin-bottom: 5px; }
  .ftx { font-size: 13px; color: var(--ink-2); }
  .empty { color: var(--ink-3); font-size: 13px; }
  .err { background: var(--amber-bg); border: 1px solid var(--amber-line); color: var(--amber); padding: 12px 16px; border-radius: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="crumb">
      <span class="brand">Mission Control</span>
      <a href="/">← All tasks</a>
    </div>
    <div id="root"><p class="empty">Loading…</p></div>
  </div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const taskId = new URLSearchParams(location.search).get("id") || "";
let selectedStep = null;

const LEGS = [
  { label: "Intake",  statuses: ["inbox"] },
  { label: "Triage",  statuses: ["planning"] },
  { label: "Plan",    statuses: ["assigned"] },
  { label: "Build",   statuses: ["in_progress"] },
  { label: "Review",  statuses: ["review", "in_review", "testing"] },
  { label: "Done",    statuses: ["done", "completed", "merged"] },
];

async function getJson(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`${path} → ${res.status}`);
  return res.json();
}

function parseTriage(task) {
  const raw = task.triage_state;
  if (!raw) return null;
  try { return typeof raw === "string" ? JSON.parse(raw) : raw; } catch { return null; }
}

const pick = (re, s) => (re.exec(s || "") || [])[1] || "";

/** Activity types that mark a leg being reached, newest write wins. */
const LEG_MARKERS = {
  triage: [/triage/i, /clarification/i, /planning_questions/i],
  plan:   [/plan_created/i, /execution plan/i],
  build:  [/step_dispatched/i, /spawned/i],
  review: [/review/i],
  done:   [/completed successfully/i, /merged/i],
};

function legTimes(task, activities) {
  const t = { intake: task.created_at };
  for (const a of activities || []) {
    const hay = `${a.activity_type || ""} ${a.message || ""}`;
    for (const [leg, pats] of Object.entries(LEG_MARKERS)) {
      if (!t[leg] && pats.some(p => p.test(hay))) t[leg] = a.created_at;
    }
  }
  return t;
}

const shortTime = iso => {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const today = new Date().toDateString() === d.toDateString();
  return today
    ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
    : d.toLocaleDateString([], { month: "short", day: "numeric" });
};

function renderTicket(task, triage, activities) {
  const legIndex = Math.max(0, LEGS.findIndex(l => l.statuses.includes(task.status)));
  const finished = legIndex >= LEGS.length - 1;
  // Knob sits at the centre of the current leg's slice.
  const pct = ((legIndex + 0.5) / LEGS.length) * 100;
  const stateClass = legIndex >= 4 ? "s-rev" : legIndex >= 3 ? "s-run" : "s-plan";

  const repos = [...new Set(((triage && triage.triage_repos) || []).map(r => `${r.project}/${r.repo}`))];
  const base = pick(/^\s*base[- ]?branch:\s*(\S+)\s*$/im, task.description);
  const app = pick(/^\s*target app:\s*`?([^`\s(]+)/im, task.description);

  const desc = (task.description || "").split("\n")
    .filter(l => l.trim() && !/^\s*(base[- ]?branch|target app)\s*:/i.test(l)).slice(0, 2).join(" ");

  const ticks = LEGS.map((_, i) => i === 0 ? "" :
    `<div class="tk-tick" style="left:${(i / LEGS.length) * 100}%"></div>`).join("");
  const times = legTimes(task, activities);
  const labels = LEGS.map((l, i) => {
    const stamp = shortTime(times[l.label.toLowerCase()]);
    return `<span class="${i < legIndex ? "done" : i === legIndex ? "now" : ""}">
      <span class="n">${esc(l.label)}</span>
      ${stamp ? `<span class="t">${esc(stamp)}</span>` : ""}</span>`;
  }).join("");

  return `
    <div class="ticket">
      <div class="tk-row1">
        ${task.external_url
          ? `<a class="tk-id" href="${esc(task.external_url)}" target="_blank" rel="noopener">${esc(task.external_id || task.id.slice(0, 8))} ↗</a>`
          : `<span class="tk-id">${esc(task.external_id || task.id.slice(0, 8))}</span>`}
        <span class="state ${stateClass}"><i></i>${esc((task.status || "").replace("_", " "))}</span>
        <div class="tk-meta">
          ${repos.length ? `<span>repo <b>${esc(repos.join(", "))}</b></span>` : ""}
          ${base ? `<span>branch <b>${esc(base)}</b></span>` : ""}
          ${app ? `<span>app <b>${esc(app)}</b></span>` : ""}
        </div>
      </div>
      <h1 class="tk-title">${esc(task.title)}</h1>
      <p class="tk-desc">${esc(desc)}</p>
      <div class="tracker">
        <div class="track-scroll"><div class="track-inner">
          <div class="tk-bar ${finished ? "finished" : ""}">
            <div class="tk-fill" style="width:${pct}%"></div>
            ${ticks}
            <div class="tk-knob" style="left:${pct}%">
              <div class="tk-pill"><span class="dim">now</span>${esc(LEGS[legIndex].label)}</div>
            </div>
          </div>
          <div class="tk-labels">${labels}</div>
        </div></div>
      </div>
    </div>`;
}

/* ─────────── the plan, as a map ─────────── */

const BOX_W = 208, BOX_H = 74, GAP_Y = 20, GAP_X = 74, PAD = 14;
// Decisions are one line each: a locked decision needs to be identifiable, not read
// in full — the collapsed list above has the wording.
const DEC_H = 30, DEC_GAP = 8;

function planMap(plan, progress, triage) {
  const stepById = Object.fromEntries(plan.steps.map(s => [s.step, s]));
  const rounds = (plan.parallel_groups && plan.parallel_groups.length)
    ? plan.parallel_groups : plan.steps.map(s => [s.step]);

  const decisions = (triage?.questions || []);
  const anyNoGsd = Object.values(progress?.steps || {}).some(st => st.gsd_ran === false);
  const open = decisions.filter(q => !q.answer);
  const cols = [decisions.length ? decisions : null, ...rounds].filter(Boolean);

  const colX = i => PAD + i * (BOX_W + GAP_X);
  // Every column is laid out at (height + GAP_Y) per node, so the canvas must be
  // measured the same way — reserving less clipped the decisions column top and bottom
  // as soon as answered questions accumulated.
  const tallest = Math.max(
    decisions.length * (DEC_H + DEC_GAP),
    ...rounds.map(g => g.length * (BOX_H + GAP_Y)));
  const height = PAD * 2 + 26 + tallest;
  const width = PAD * 2 + cols.length * BOX_W + (cols.length - 1) * GAP_X;

  const centre = (n, count, h, gap = GAP_Y) =>
    PAD + 26 + (tallest - count * (h + gap)) / 2 + n * (h + gap);
  const pos = {};
  const parts = [];
  const hasDec = decisions.length > 0;

  // Decisions column
  if (hasDec) {
    const x = colX(0);
    parts.push(`<text class="clab" x="${x}" y="${PAD + 12}">DECISIONS</text>`);
    decisions.forEach((q, i) => {
      const y = centre(i, decisions.length, DEC_H, DEC_GAP);
      pos[`d${i}`] = { x, y, w: BOX_W, h: DEC_H };
      const set = !!q.answer;
      const label = set ? (q.answer || "") : q.question;
      parts.push(`
        <g class="dec ${set ? "set" : "open"}">
          <rect x="${x}" y="${y}" width="${BOX_W}" height="${DEC_H}" rx="9"/>
          <text class="dt" x="${x + 11}" y="${y + 19}">D-${String(i + 1).padStart(2, "0")}</text>
          <text class="ds" x="${x + 44}" y="${y + 19}">${esc(clip(label, 22))}</text>
        </g>`);
    });
  }

  // Rounds
  rounds.forEach((group, gi) => {
    const ci = gi + (hasDec ? 1 : 0);
    const x = colX(ci);
    const waiting = group.some(n => !(stepById[n] || {}).step ? false : false);
    parts.push(`<text class="wv ${waiting ? "wait" : ""}" x="${x}" y="${PAD + 12}">ROUND ${gi + 1}${group.length > 1 ? ` · ${group.length}×` : ""}</text>`);
    group.forEach((n, i) => {
      const s = stepById[n];
      if (!s) return;
      const st = (progress?.steps || {})[String(n)] || {};
      const y = centre(i, group.length, BOX_H);
      pos[`s${n}`] = { x, y, w: BOX_W, h: BOX_H };
      const state = st.status === "completed" ? "done"
        : st.status === "in_progress" ? "run"
        : (st.status === "blocked" || st.status === "failed") ? "blocked" : "";
      // Provisional while decisions are still open — the plan may yet change.
      const ghost = open.length > 0 && !state ? "ghost" : "";
      const sel = String(selectedStep) === String(n) ? "sel" : "";
      // The runtime that ran it. Deliberately NOT the step category ("deep",
      // "quick", "review"): that is a routing hint for picking a profile, not
      // something a reader acts on, and it read as a label about the work itself.
      const model = st.agent_profile || "";
      const check = (s.verify_command || "").trim();
      // A step that produced no GSD artifacts was not spec-driven, whatever else it
      // achieved — the plan carrying the context is the whole premise.
      const noGsd = st.gsd_ran === false;
      parts.push(`
        <g class="stepg ${state} ${ghost} ${sel}" tabindex="0" role="button" data-step="${s.step}">
          <title>${esc(s.title)}${check ? `\n\n✓ ${esc(check)}` : ""}${noGsd ? `\n\n⚠ ${esc(st.gsd_reason || "no GSD artifacts — the work was not spec-driven")}` : ""}</title>
          <rect class="sbox" x="${x}" y="${y}" width="${BOX_W}" height="${BOX_H}" rx="10"/>
          <text class="snum" x="${x + 12}" y="${y + 18}">STEP ${esc(String(s.step))}</text>
          ${model ? `<text class="srepo" x="${x + BOX_W - 12}" y="${y + 18}" text-anchor="end">${esc(clip(model, 14))}</text>` : ""}
          <text class="stitle" x="${x + 12}" y="${y + 38}">${esc(clip(s.title, 26))}</text>
          ${noGsd ? `<rect class="nogsd-edge" x="${x}" y="${y}" width="4" height="${BOX_H}" rx="2"/>` : ""}
          ${check ? `
            <rect class="cbox" x="${x + 12}" y="${y + 48}" width="${BOX_W - 24}" height="18" rx="5"/>
            <text class="ctext" x="${x + 18}" y="${y + 61}">✓ ${esc(clip(check.split("&&")[0].trim(), 22))}</text>` : ""}
        </g>`);
    });
  });

  // Edges: step → step from declared dependencies, decisions → the roots.
  const edges = [];
  const link = (a, b, cls) => {
    if (!a || !b) return;
    const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
    const dx = Math.max(20, (x2 - x1) / 2);
    edges.push(`<path class="${cls}" d="M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}"/>`);
  };
  for (const s of plan.steps) {
    for (const dep of s.depends_on || []) link(pos[`s${dep}`], pos[`s${s.step}`], "flow");
  }
  if (hasDec) {
    const roots = plan.steps.filter(s => !(s.depends_on || []).length);
    decisions.forEach((q, i) => {
      for (const r of roots) link(pos[`d${i}`], pos[`s${r.step}`], `dlink ${q.answer ? "set" : "open"}`);
    });
  }

  return `
    <div class="maplegend">
      <span><i class="f"></i> depends on</span>
      ${hasDec ? `<span><i class="s"></i> decision locked</span>` : ""}
      ${open.length ? `<span><i class="d"></i> decision open — work is provisional</span>` : ""}
      ${anyNoGsd ? `<span><i class="d"></i> no GSD — step ran without task decomposition</span>` : ""}
    </div>
    <div class="diagram-wrap">
      <svg class="plan-map" viewBox="0 0 ${width} ${height}" style="min-width:${width}px">
        ${edges.join("")}${parts.join("")}
      </svg>
    </div>
    <div id="stepdetail"></div>`;
}

/** Full detail for one step — the node itself is all truncation. */
function stepDetail(plan, progress, num) {
  const s = (plan.steps || []).find(x => String(x.step) === String(num));
  if (!s) return "";
  const st = (progress?.steps || {})[String(num)] || {};
  const acs = (s.acceptance_criteria || s.done_when || []);
  const deps = (s.depends_on || []);
  return `
    <div class="sd">
      <div class="sd-head">
        <span class="sd-num">STEP ${esc(String(s.step))}</span>
        <span class="sd-title">${esc(s.title)}</span>
        <button class="sd-close" id="sd-close" title="Close">×</button>
      </div>
      <div class="sd-meta">
        ${esc(st.status || "pending")}
        ${st.agent_profile ? ` · ran on ${esc(st.agent_profile)}` : ""}
        ${!st.agent_profile && (st.category || s.category) ? ` · routed as ${esc(st.category || s.category)}` : ""}
        ${st.retry_count ? ` · attempt ${st.retry_count + 1}` : ""}
        ${deps.length ? ` · needs step ${deps.join(", ")}` : " · no dependencies"}
        ${s.repo ? ` · ${esc(s.repo)}` : ""}
      </div>
      ${st.gsd_ran === false ? `<div class="sd-warn">Not spec-driven: ${esc(st.gsd_reason || "no GSD artifacts")}</div>` : ""}
      ${st.outcome ? `<div class="sd-sec"><div class="sd-lab">Outcome</div><div class="sd-body">${esc(st.outcome)}</div></div>` : ""}
      ${s.description ? `<div class="sd-sec"><div class="sd-lab">What it does</div><div class="sd-body">${esc(s.description)}</div></div>` : ""}
      ${acs.length ? `<div class="sd-sec"><div class="sd-lab">Done when</div>${acs.map(c => `<div class="sd-ac">${esc(c)}</div>`).join("")}</div>` : ""}
      ${s.verify_command ? `<div class="sd-sec"><div class="sd-lab">Checked by</div><div class="sd-cmd">${esc(s.verify_command)}</div></div>` : ""}
    </div>`;
}

const clip = (s, n) => (String(s).length > n ? String(s).slice(0, n - 1) + "…" : String(s));

function renderPlan(plan, progress, triage) {
  if (!plan || !(plan.steps || []).length) {
    return `<div class="card">
      <div class="glab">The plan</div>
      <p class="empty">No plan yet — it's written once the questions are answered.</p></div>`;
  }
  const rounds = (plan.parallel_groups && plan.parallel_groups.length) ? plan.parallel_groups.length : plan.steps.length;
  return `<div class="card">
    <div class="glab">The plan <span class="gn">${plan.steps.length} steps · ${rounds} rounds</span></div>
    ${planMap(plan, progress, triage)}
  </div>`;
}

/* ─────────── findings and questions ─────────── */

function renderFound(triage) {
  const items = [];
  if (triage?.triage_reasoning) items.push({ kind: "Blocking", text: triage.triage_reasoning });
  (triage?.questions || []).filter(q => q.answer && q.answered_by === "agent")
    .forEach(q => items.push({ kind: "Worked out", text: `${q.question}\n→ ${q.answer}` }));
  return `<div class="card sunk">
    <div class="glab">What we found</div>
    ${items.length ? items.map(i => `<div class="fitem"><span class="fk">${esc(i.kind)}</span><div class="ftx">${esc(i.text)}</div></div>`).join("")
      : `<p class="empty">Nothing yet — triage hasn't run.</p>`}
  </div>`;
}

/** Questions raised by the planner, not by triage. Deferred ones no longer block. */
function followUps(qs) {
  return qs.filter(q => !q.answer && !q.deferred && (q.source === "planner" || q.round > 1));
}

/** The conversation about a question, plus the box to add to it. */
/** Questions raised by the planner, not by triage. Deferred ones no longer block. */
function followUps(qs) {
  return qs.filter(q => !q.answer && !q.deferred && (q.source === "planner" || q.round > 1));
}

/**
 * One conversation, not a page of forms.
 *
 * The question cards put a text box on every question, scattered down a list that
 * re-renders on a timer. That fought itself in every direction: typing raced the
 * poll, each render restacked listeners, and the actual conversation was buried
 * inside whichever card you had opened.
 *
 * So the agent has one surface. Everything it has asked, everything you have said
 * back, and everything that got decided runs down a single stream, with one
 * composer at the bottom. The panel beside it is the durable record — what is
 * settled, what is still blocking — because that is the thing a transcript is
 * worst at and the thing this page exists to answer.
 *
 * The split that matters: clicking decides, typing talks. An option or "decide for
 * me" settles the question immediately; anything you type is a message in the
 * conversation, not a silent answer to a form.
 */

/** Everything that has happened, in order, across every question. */
function chatTimeline(questions) {
  const events = [];
  (questions || []).forEach((q, i) => {
    const seq = String(i).padStart(4, "0");
    events.push({
      at: q.asked_at || "", seq, kind: "asked", q,
      role: q.source === "planner" ? "planner" : "triage",
    });
    (q.thread || []).forEach(m => events.push({
      at: m.at || "", seq, kind: "said", q, role: m.role, text: m.text,
    }));
    if (q.answer) {
      events.push({
        at: q.answered_at || "", seq, kind: "decided", q,
        role: q.answered_by === "agent" ? "agent" : "you",
      });
    } else if (q.deferred) {
      events.push({ at: q.deferred_at || "", seq, kind: "deferred", q, role: "you" });
    }
  });
  // Timestamps where we have them; otherwise the order the questions were asked.
  // Never a bare sort on `at` — an undated event would jump to the top and the
  // conversation would read out of sequence.
  return events.sort((a, b) => (a.at || "").localeCompare(b.at || "") || a.seq.localeCompare(b.seq));
}

/**
 * One message in the stream, per design 2b.
 *
 * Agent turns get an avatar and run full width; yours is a right-aligned bubble
 * with one corner squared off, so whose turn it was is legible without reading.
 * A decision is a receipt line rather than a message, because it records something
 * settled rather than somebody speaking.
 */
function renderChatEvent(ev) {
  const initials = { planner: "PL", triage: "TR", research: "RS", agent: "AG" }[ev.role] || "AG";
  const tag = ev.q.becomes ? esc(ev.q.becomes) : "";

  if (ev.kind === "asked") {
    // Why it is asked renders as a finding — amber, which in this design means one
    // thing only: a human is the blocker.
    const why = ev.q.why
      ? `<div class="cfind"><div class="ft">Why this is being asked</div><div class="fb">${esc(ev.q.why)}</div></div>`
      : "";
    // Suggested replies as pills, the first recommended. There is always an escape
    // pill, because no question may be a dead end.
    const pills = (ev.q.options || []).map((o, i) =>
      `<button class="cpill${i === 0 ? " rec" : ""}" data-answer="${esc(o)}" data-q="${esc(ev.q.id)}">${esc(o)}</button>`).join("");
    const escapePill = `<button class="cpill esc" data-act="delegate" data-q="${esc(ev.q.id)}">You decide</button>`;
    const owed = (ev.q.thread || []).length && ev.q.thread[ev.q.thread.length - 1].role === "you";
    const waiting = owed ? `<div class="cwait"><i></i>Working out an answer — read-only check</div>` : "";
    return `<div class="cmsg" data-for="${esc(ev.q.id)}">
      <span class="cav">${initials}</span>
      <div><div class="cq">${esc(ev.q.question)}</div>${why}
      <div class="cpills">${pills}${escapePill}</div>${waiting}</div></div>`;
  }

  if (ev.kind === "said") {
    if (ev.role === "you") {
      return `<div class="cmsg me" data-for="${esc(ev.q.id)}"><div class="cbody">${esc(ev.text)}</div></div>`;
    }
    return `<div class="cmsg" data-for="${esc(ev.q.id)}">
      <span class="cav">RS</span><div class="cbody">${esc(ev.text)}</div></div>`;
  }

  if (ev.kind === "deferred") {
    return `<div class="cmsg" data-for="${esc(ev.q.id)}"><span class="cav you">—</span>
      <div class="cbody"><span class="creceipt">◦ ${tag} set aside — not blocking planning</span>
      <button class="cbtn" data-act="undefer" data-q="${esc(ev.q.id)}" style="margin-left:10px">Bring it back</button></div></div>`;
  }

  const byAgent = ev.role === "agent";
  const reason = ev.q.reason ? `<div class="fb" style="margin-top:6px">${esc(ev.q.reason)}</div>` : "";
  const undo = byAgent
    ? `<button class="cbtn" data-act="reopen" data-q="${esc(ev.q.id)}" style="margin-left:10px">Change it</button>` : "";
  return `<div class="cmsg" data-for="${esc(ev.q.id)}"><span class="cav${byAgent ? "" : " you"}">${byAgent ? "AG" : "YOU"}</span>
    <div><div class="creceipt">✓ Recorded as ${tag} — the plan has to cite it</div>
    <div class="cbody" style="margin-top:4px">${esc(ev.q.answer)}${byAgent ? " · chosen for you" : ""}${undo}</div>
    ${reason}</div></div>`;
}

/** The question the composer is currently pointed at. */
function activeQuestion(questions, wantedId) {
  const open = blockingQuestions(questions);
  if (wantedId) {
    const found = (questions || []).find(q => q.id === wantedId);
    if (found) return found;
  }
  // Planner questions first: work is halted behind those.
  return open.find(q => q.source === "planner") || open[0] || null;
}

function blockingQuestions(questions) {
  return (questions || []).filter(q => !q.answer && !q.deferred);
}

function renderComposer(active, openCount) {
  if (!active) {
    return `<div class="composer">
      <div class="cactive">Nothing is waiting on you.</div>
      <div class="crow"><input type="text" id="say" placeholder="Say something to the agent…" disabled>
        <button class="csend" data-send="ask" disabled>↑</button></div>
      <div class="cfoot">Planning can proceed.</div>
    </div>`;
  }
  const left = openCount - 1;
  return `<div class="composer" data-active="${esc(active.id)}">
    <div class="cactive">Answering <b>${esc(active.becomes || "")}</b> · ${esc(active.question)}</div>
    <div class="crow">
      <input type="text" id="say" placeholder="Answer in your own words, or ask about it…">
      <button class="cbtn" data-send="answer">Answer</button>
      <button class="csend" data-send="ask" title="Send as a message">↑</button>
    </div>
    <div class="cexits"><span>Not sure?</span>
      <button class="cbtn" data-act="delegate" data-q="${esc(active.id)}">Decide for me</button>
      <button class="cbtn" data-act="defer" data-q="${esc(active.id)}">Decide later</button>
    </div>
    <div class="cfoot">planning starts when the last question is settled${left > 0 ? ` · ${left} left after this` : ""}</div>
  </div>`;
}

/**
 * The decision rail: what is settled, what is still open, without scrolling.
 * The one thing a transcript is worst at, and the thing this page exists to answer.
 */
function renderDecisions(questions, activeId) {
  const rows = (questions || []).map(q => {
    let state = "open", label = "open";
    if (q.answer) { state = "set"; label = "settled"; }
    else if (q.deferred) { label = "set aside"; }
    else if (q.delegate_requested) { state = "agent"; label = "agent deciding"; }
    else if (q.id === activeId) { state = "on"; label = "discussing"; }
    return `<button class="drow2 ${state}" data-focus="${esc(q.id)}">
      <span class="dtag">${esc(q.becomes || "—")} · ${esc(label)}</span>
      <span class="dq2">${esc(q.question)}</span>
      ${q.answer ? `<span class="dv">${esc(String(q.answer).slice(0, 48))}${q.answered_by === "agent" ? " · agent" : ""}</span>` : ""}
    </button>`;
  }).join("");
  const settled = (questions || []).filter(q => q.answer).length;
  const blocking = blockingQuestions(questions).length;
  return `<aside class="decisions">
    <div class="drail-h">Decisions ${settled}/${(questions || []).length}</div>
    ${rows || `<p class="empty">No questions yet.</p>`}
    <div class="dsum">${blocking ? `<b>${blocking}</b> blocking planning<br>` : ""}
      Everything settled here lands in <code>.planning/</code> as the phase brief.</div>
  </aside>`;
}

function renderConversation(triage, activeId) {
  const qs = triage?.questions || [];
  const active = activeQuestion(qs, activeId);
  const settled = qs.filter(q => q.answer).length;
  const stream = chatTimeline(qs).map(renderChatEvent).join("")
    || `<p class="empty">Triage hasn't asked anything yet.</p>`;
  return `<div class="convo">
    <div class="chat">
      <div class="chead"><span class="live"><i></i>discuss</span>
        <span class="settled">${settled} of ${qs.length} settled</span></div>
      <div class="stream" id="stream">${stream}</div>
      ${renderComposer(active, blockingQuestions(qs).length)}
    </div>
    ${renderDecisions(qs, active?.id)}
  </div>`;
}

/**
 * One place a question action is posted, so the exits and the composer cannot drift
 * apart. `onOk` runs only after the response is checked, which keeps a failed
 * request from clearing what you typed.
 */
async function postQuestionAction(qid, action, payload = {}, onOk = null) {
  try {
    const res = await fetch(
      `/api/tasks/${encodeURIComponent(taskId)}/questions/${encodeURIComponent(qid)}/${action}`,
      { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) },
    );
    if (!res.ok) throw new Error(`${action} failed (${res.status})`);
    onOk?.();
    load({ force: true });
    return true;
  } catch (e) {
    const note = document.querySelector(".cactive") || document.querySelector(".cfoot");
    if (note) note.textContent = String(e.message || e);
    return false;
  }
}

/**
 * The exits, delegated once. "Decide for me" and "Decide later" settle a question
 * without answering it; reopen takes an answer or a deferral back.
 */
function wireQuestionActions() {
  document.addEventListener("click", async (ev) => {
    const btn = ev.target.closest("[data-act][data-q]");
    if (!btn) return;
    const { act, q: qid } = btn.dataset;
    // Bringing a question back is the same edit as taking an answer back: reopen
    // clears the answer and the deferral together.
    const action = act === "undefer" ? "reopen" : act;
    btn.disabled = true;
    const ok = await postQuestionAction(qid, action);
    if (!ok) btn.disabled = false;
  });
}

// Which question the composer points at. Held outside the render so a poll cannot
// move it under someone mid-sentence.
let focusedQuestion = null;

/**
 * The composer, the option buttons, and focusing a question from the panel.
 *
 * Clicking decides, typing talks — an option or "decide for me" settles the
 * question outright, while anything typed is a message in the conversation unless
 * you deliberately press Answer.
 */
function wireConversation(triage) {
  const stream = $("#stream");
  if (stream) stream.scrollTop = stream.scrollHeight;

  const say = $("#say");
  const composer = document.querySelector("[data-active]");
  const activeId = composer?.dataset.active || null;

  const send = async (mode) => {
    const text = (say?.value || "").trim();
    if (!text || !activeId) { say?.focus(); return; }
    if (mode === "answer") { await recordAnswer(triage, activeId, text); return; }
    await postQuestionAction(activeId, "ask", { text }, () => { if (say) say.value = ""; });
  };

  document.querySelectorAll("[data-send]").forEach(btn =>
    btn.addEventListener("click", () => send(btn.dataset.send)));

  // Enter sends as a message. Recording a decision is the deliberate button.
  say?.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send("ask"); }
  });

  document.querySelectorAll("[data-answer]").forEach(btn =>
    btn.addEventListener("click", () => recordAnswer(triage, btn.dataset.q, btn.dataset.answer)));

  document.querySelectorAll("[data-focus]").forEach(btn =>
    btn.addEventListener("click", () => { focusedQuestion = btn.dataset.focus; load({ force: true }); }));
}

/** Record one answer as the decision it binds. */
async function recordAnswer(triage, qid, answer) {
  const next = JSON.parse(JSON.stringify(triage));
  const q = (next.questions || []).find(x => x.id === qid);
  if (!q) return;
  q.answer = answer;
  q.answered_at = new Date().toISOString();
  q.answered_by = "you";
  q.deferred = false;
  q.delegate_requested = false;
  try {
    const res = await fetch(`/api/tasks/${encodeURIComponent(taskId)}/triage-state`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(next),
    });
    if (!res.ok) throw new Error(`save failed (${res.status})`);
    const say = $("#say");
    if (say) say.value = "";
    focusedQuestion = null;      // settled, so the composer moves to whatever is next
    load({ force: true });
  } catch (e) {
    const note = document.querySelector(".cactive");
    if (note) note.textContent = String(e.message || e);
  }
}

/** Every field someone can be part-way through typing into. */
const DRAFT_FIELDS = "#say,[data-free],[data-ask]";

/**
 * Is someone part-way through typing?
 *
 * The page re-renders by replacing all of #root, so a poll landing mid-sentence
 * threw the sentence away. Anything focused counts, and so does anything with text
 * in it — a draft you have clicked away from is still a draft.
 */
function isEditing() {
  const active = document.activeElement;
  if (active && /^(INPUT|TEXTAREA)$/.test(active.tagName)) return true;
  return [...document.querySelectorAll(DRAFT_FIELDS)].some(el => el.value.trim());
}

/** What has been typed but not sent, so a re-render can put it back. */
function captureDrafts() {
  const drafts = {};
  document.querySelectorAll(DRAFT_FIELDS).forEach(el => {
    // The composer is one field for the whole conversation, so it keys on itself
    // rather than on a question id: the text belongs to the person typing, not to
    // whichever question happened to be in focus when they started.
    const key = el.id === "say" ? "say"
      : el.dataset.free ? `free:${el.dataset.free}` : `ask:${el.dataset.ask}`;
    if (el.value.trim()) drafts[key] = el.value;
  });
  return drafts;
}

function restoreDrafts(drafts) {
  for (const [key, value] of Object.entries(drafts)) {
    let el;
    if (key === "say") {
      el = document.querySelector("#say");
    } else {
      const kind = key.slice(0, key.indexOf(":"));
      const id = key.slice(key.indexOf(":") + 1);
      el = document.querySelector(`[data-${kind === "free" ? "free" : "ask"}="${CSS.escape(id)}"]`);
    }
    // Never over a value the new render already put there — the saved answer wins
    // over a stale draft of itself.
    if (el && !el.value) el.value = value;
  }
}

async function load({ force = false } = {}) {
  const root = $("#root");
  if (!taskId) {
    root.innerHTML = `<div class="err">No ticket id. Open as <code>/ticket?id=&lt;task-id&gt;</code>.</div>`;
    return;
  }
  // A background poll must never interrupt typing. Forced loads — after you submit
  // or use one of the exits — still go through, and carry drafts across.
  if (!force && isEditing()) return;
  const drafts = captureDrafts();
  try {
    const task = await getJson(`/api/tasks/${encodeURIComponent(taskId)}`);
    const planData = await getJson(`/api/tasks/${encodeURIComponent(taskId)}/plan`).catch(() => ({}));
    // Activity history is what dates the tracker; never let it hide the ticket.
    const activities = await getJson(`/api/tasks/${encodeURIComponent(taskId)}/activities`).catch(() => []);
    const triage = parseTriage(task);
    const qs = (triage?.questions || []);

    // One conversation, then the plan. What triage found only stands alone before
    // it has asked anything — after that it is in the stream with everything else.
    root.innerHTML = renderTicket(task, triage, activities)
      + (qs.length ? renderConversation(triage, focusedQuestion) : renderFound(triage))
      + renderPlan(planData.plan, planData.progress, triage);

    restoreDrafts(drafts);
    if (qs.length) wireConversation(triage);
    wireGraph(planData.plan, planData.progress);
  } catch (e) {
    root.innerHTML = `<div class="err">Couldn't load this ticket: ${esc(e.message || e)}</div>`;
  }
}

/** Clicking a node opens its detail; clicking it again closes it. */
function wireGraph(plan, progress) {
  const detail = $("#stepdetail");
  if (!detail || !plan) return;
  const paint = () => {
    detail.innerHTML = selectedStep == null ? "" : stepDetail(plan, progress, selectedStep);
    document.querySelectorAll("g.stepg").forEach(g =>
      g.classList.toggle("sel", String(g.dataset.step) === String(selectedStep)));
    const close = $("#sd-close");
    if (close) close.addEventListener("click", () => { selectedStep = null; paint(); });
  };
  document.querySelectorAll("g.stepg").forEach(g => {
    const open = () => {
      selectedStep = String(g.dataset.step) === String(selectedStep) ? null : g.dataset.step;
      paint();
    };
    g.addEventListener("click", open);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  });
  paint();
}

// ---- BOOTSTRAP ---- everything above is pure and testable; nothing below is.
// Delegated once, not per render: the question list is replaced on every poll.
wireQuestionActions();
load();
// The bridge changes this ticket out of band, so re-read it periodically. Not
// forced: a poll that lands mid-sentence skips rather than discarding it.
setInterval(() => load(), 15000);
</script>
</body>
</html>
