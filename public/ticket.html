<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket · Mission Control</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231A1F29'/%3E%3Cpath d='M8 20h16M8 20l4-8 4 5 3-4 5 7' stroke='%232563EB' stroke-width='1.8' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
  /* The dashboard's tokens, verbatim. Colour carries one meaning here: amber means
     a human is the blocker and nothing else may use it, green is live/settled,
     cyan is the current actionable thing, red is dead/denied. */
  :root {
    --bg-main:   #0a0a0f;
    --bg-card:   #12121a;
    --bg-drawer: #161622;
    --line:      #1a1a2e;
    --line-soft: rgba(255,255,255,.05);
    --ink:       #e0e0e0;
    --ink-2:     rgba(224,224,224,.86);
    /* Secondary and tertiary text. Measured against the three surfaces on this
       page (main #0a0a0f, card #12121a, drawer #161622): at the old .44/.34 these
       came out at 3.6:1 and 2.6:1, under the 4.5:1 WCAG AA floor for body text —
       and nearly everything wearing them is 9.5-11px, which needs more contrast
       than body text, not less. Now 7.1:1 and 5.3:1 at the worst surface. */
    --ink-3:     rgba(224,224,224,.70);
    --ink-4:     rgba(224,224,224,.58);
    --accent:    #00d4ff;
    --accent-bg: rgba(0,212,255,.06);
    --accent-line: rgba(0,212,255,.16);
    --amber:     #f59e0b;
    --amber-bg:  rgba(245,158,11,.05);
    --amber-line:rgba(245,158,11,.28);
    --green:     #00ff88;
    --green-bg:  rgba(0,255,136,.13);
    --cyan:      #00d4ff;
    --cyan-bg:   rgba(0,212,255,.08);
    --red:       #ef4444;
    --red-bg:    rgba(239,68,68,.1);
    --indigo:    #818cf8;
    --card:      #12121a;
    --sunk:      rgba(255,255,255,.035);
    --ground:    #0a0a0f;
    --shadow:    none;
    --ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;

    /* Shell metrics. These were fixed pixels tuned on a laptop, so on a 2000px
       display the two rails stayed exactly the size they were and the middle
       column swallowed every extra pixel: the record rail broke file paths
       mid-word beside a conversation with 350px of empty margin either side.
       They scale with the viewport now, and so does the reading measure — the
       middle column stops widening long before the rails stop growing, because
       a 1200px line of prose is unreadable and a 300px file path is not. */
    --nav-h:   52px;
    --shell-max: 1920px;
    --workspace-gap: 24px;
    --rail-w:  clamp(248px, 22vw, 370px);
    --drail-w: clamp(318px, 27vw, 454px);
    --read:    668px;
    --hold:    #f59e0b;
    --build:   #00f59a;
    --review:  #8994ff;
    --intake:  #26c9f5;
    --done:    #777c88;
    --closed:  #ef6b6b;
  }
  /* The breakpoints are the desks this runs on: laptop, 27" display, and the
     ultrawide the screenshot that prompted this was taken on. */
  @media (min-width: 1440px) {
    :root { --nav-h: 64px; --read: 720px; }
  }
  @media (min-width: 1720px) {
    :root { --read: 764px; }
  }
  @media (min-width: 2100px) {
    :root { --read: 800px; }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg-main); color: var(--ink);
    font-family: var(--ui); font-size: 13.5px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  h1, h2 { margin: 0; font-weight: 600; }

  /* ─────────── the shell (design 2b) ─────────── */
  /* Three columns, full height, one scroller: the ticket rail on the left, the
     conversation in the middle, the record on the right. Laid out as a grid rather
     than nested boxes so the two rails run the full height beside a header that
     belongs only to the middle column — and so every part stays a flat sibling
     that renders on its own. */
  #root { height: 100dvh; }
  .shell {
    display: grid; width: min(100%, var(--shell-max)); height: 100dvh; margin: 0 auto;
    grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--drail-w);
    grid-template-rows: var(--nav-h) auto minmax(0, 1fr);
  }
  .topnav    { grid-column: 1 / 4; grid-row: 1; border-bottom: 1px solid var(--line); background: #08090d; }
  .rail      { grid-column: 1; grid-row: 2 / 4; border-right: 1px solid var(--line-soft); background: #090a0f; min-height: 0; }
  .ticket    { grid-column: 2; grid-row: 2; min-width: 0; }
  .convo     { grid-column: 2; grid-row: 3; min-width: 0; min-height: 0; }
  .ticket-status-panel { grid-column: 3; grid-row: 2; min-width: 0; }
  .decisions { grid-column: 3; grid-row: 3; border-left: 1px solid var(--line-soft); min-height: 0; }
  /* Below the rails' width the page stops being an app shell and becomes a
     document: one column, ordinary scroll, nothing overlapping. */
  @media (max-width: 1080px) {
    #root { height: auto; }
    .shell { height: auto; display: flex; flex-direction: column; }
    .topnav { order: 0; }
    .ticket { order: 1; }
    .ticket-status-panel { order: 2; }
    .convo { order: 3; }
    .decisions { order: 4; }
    .rail, .decisions { border: none; }
    /* `.shell >`, not a bare `.rail`: the base `.rail { display: flex }` is
       declared later in this sheet, so at equal specificity it won the cascade
       and the rail was never actually hidden — a narrow window opened on the
       ticket page and showed a full-width list of other tickets first. */
    .shell > .rail { display: none; }
  }

  /* ─────────── the top nav ─────────── */
  /* Where in the product you are, and what is happening elsewhere in it. The
     wordmark lives here rather than in the ticket rail: it names the app, and the
     rail names one list inside it. */
  .topnav { display: flex; align-items: center; gap: 28px; padding: 0 24px; min-width: 0; }
  .topnav .wordmark {
    font-family: var(--mono); font-size: 11.5px; font-weight: 700; letter-spacing: .17em;
    color: var(--ink); text-decoration: none; flex: none;
  }
  .tabs { display: flex; gap: 2px; min-width: 0; overflow: hidden; }
  /* 10.5px secondary text in the persistent bar was the least legible thing on
     the page and the thing most often read. Destination labels get body size. */
  .tab {
    display: flex; gap: 7px; padding: 7px 13px; border-radius: 6px; font-size: 12.5px;
    color: var(--ink-2); text-decoration: none; white-space: nowrap;
  }
  .tab:hover { color: var(--ink-2); background: rgba(255,255,255,.03); }
  .tab.on { background: rgba(0,212,255,.1); color: var(--cyan); }
  .tab.on .c { color: rgba(0,212,255,.7); }
  .tab .c { font-family: var(--mono); }
  .tab .c.need { color: var(--amber); }
  .tab .c.run  { color: var(--green); }
  .tab .c.rev  { color: var(--indigo); }
  .navright {
    margin-left: auto; display: flex; align-items: center; gap: 18px; flex: none;
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-3);
  }
  .navright .live { display: flex; align-items: center; gap: 7px; }
  .navright .live i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: mcpulse 1.9s ease-in-out infinite; }
  .navright .need { color: var(--amber); }
  .navright kbd {
    font-family: var(--mono); font-size: 11px; padding: 5px 10px;
    border: 1px solid rgba(255,255,255,.12); border-radius: 5px; color: var(--ink-3);
  }
  /* The breadcrumb the design puts before the ticket id — the rail is one list
     among several now, so the header says which. */
  .tk-crumb { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); text-decoration: none; flex: none; }
  .tk-crumb:hover { color: var(--ink-2); }

  /* ─────────── the ticket rail ─────────── */
  /* Cross-ticket navigation. It is on the ticket page because the question you are
     answering here is regularly "what else is waiting on me" — and the answer
     should not cost a trip back to the board. */
  .rail { display: flex; flex-direction: column; padding: 28px 16px 20px; overflow-y: auto; }
  .rgroup {
    --group: var(--done);
    /* `flex: none` is load-bearing, not tidying. The rail is a flex column with a
       bounded height, and this bar sets `overflow: hidden` — which makes its
       automatic minimum size 0 instead of its content height. So the moment the
       rail's contents overflowed (six groups and their cards: always), every
       group bar was the first thing flex chose to shrink, and it shrank to
       exactly nothing. The headings were in the DOM, coloured correctly, and
       0px tall. */
    flex: none;
    display: grid; grid-template-columns: minmax(0, 1fr) 38px; align-items: stretch;
    margin: 0 0 12px; border-radius: 5px; overflow: hidden;
    font-family: var(--mono); font-size: 11px; font-weight: 800;
    letter-spacing: .18em; color: #050608; background: var(--group);
    cursor: pointer; list-style: none;
  }
  .rgroup::-webkit-details-marker { display: none; }
  .rgroup > span { padding: 8px 14px; }
  .rgroup > span::after {
    content: "▾"; display: inline-block; margin-left: 8px; font-size: 9px;
    transform: translateY(-1px); transition: transform .16s ease;
  }
  .rsection:not([open]) > .rgroup > span::after { transform: translateY(-1px) rotate(-90deg); }
  .rgroup > b {
    display: grid; place-items: center; border-left: 3px solid #090a0f;
    font-size: 12px; letter-spacing: 0; font-weight: 800;
  }
  .rgroup.tone-hold { --group: var(--hold); }
  .rgroup.tone-building { --group: var(--build); }
  .rgroup.tone-review { --group: var(--review); }
  .rgroup.tone-intake, .rgroup.tone-triage { --group: var(--intake); }
  .rgroup.tone-done { --group: var(--done); color: #0c0d11; }
  .rgroup.tone-closed { --group: var(--closed); color: #0c0d11; }
  .rlist { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 0 0 22px; }
  .rt { display: block; padding: 15px 16px 14px; border-radius: 9px; text-decoration: none; color: inherit;
        border-left: 3px solid transparent; background: transparent; }
  .rt:hover { background: rgba(255,255,255,.03); }
  .rt.on { background: rgba(255,255,255,.055); border-left-color: var(--group, var(--cyan)); }
  .rt.on.build { border-left-color: var(--group, var(--green)); }
  /* Amber is reserved for work that cannot advance without the operator. The
     outline keeps the signal visible away from the selected card; the wash is
     intentionally restrained so title and progress text retain their hierarchy. */
  .rt.needs-you,
  .rt.needs-you.on,
  .rt.needs-you.on.build {
    background: linear-gradient(90deg, rgba(245,158,11,.11), rgba(245,158,11,.035));
    border-left-color: var(--amber);
    box-shadow: inset 0 0 0 1px var(--amber-line);
  }
  .rt.needs-you:hover { background: linear-gradient(90deg, rgba(245,158,11,.15), rgba(245,158,11,.055)); }
  .rlist.tone-hold { --group: var(--hold); }
  .rlist.tone-building { --group: var(--build); }
  .rlist.tone-review { --group: var(--review); }
  .rlist.tone-intake, .rlist.tone-triage { --group: var(--intake); }
  .rlist.tone-done { --group: var(--done); }
  .rlist.tone-closed { --group: var(--closed); }
  .rt-top {
    display: flex; gap: 8px; align-items: baseline;
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-bottom: 9px;
  }
  .rt-top .rt-ref { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rt.on .rt-top { color: var(--ink-3); }
  .rt-needs-icon {
    width: 18px; height: 18px; margin-left: auto; flex: none; display: grid; place-items: center;
    color: var(--amber); border: 1px solid var(--amber-line); border-radius: 50%;
    background: rgba(245,158,11,.1);
  }
  .rt-needs-icon svg { width: 11px; height: 11px; display: block; }
  .rt-badge { margin-left: auto; white-space: nowrap; flex: none; }
  .rt-needs-icon + .rt-badge { margin-left: 0; }
  .rt-badge.q { color: var(--amber); }
  .rt-badge.now { color: var(--cyan); }
  .rt-badge.ok { color: var(--green); }
  .rt-title { font-size: 13px; line-height: 1.45; color: var(--ink-2);
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rt.on .rt-title { color: #f4f4f6; }
  /* The active ticket carries its own state, because that is the one you are in. */
  .rt-live { margin-top: 12px; display: flex; flex-direction: column; gap: 7px;
             font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
  .rt-live .who { display: flex; align-items: center; gap: 7px; }
  .rt-live .who i { width: 4px; height: 4px; border-radius: 50%; background: var(--green); animation: mcpulse 2s ease-in-out infinite; flex: none; }
  .rt-live .who .dim { color: var(--ink-4); }
  .rt-seg { display: flex; align-items: center; gap: 8px; }
  .rt-seg .bars { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
  .rt-seg .bars i { height: 3px; border-radius: 1px; background: rgba(255,255,255,.12); }
  .rt-seg .bars i.done { background: var(--group, var(--green)); }
  .rt-seg .bars i.now  { background: var(--group, var(--cyan)); opacity: .72; }
  .rt-seg .n { margin-left: auto; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .rail .foot { display: block; text-decoration: none; margin-top: auto; padding: 18px 14px 0; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

  /* ─────────── the ticket header ─────────── */
  /* The ticket card spans the centre and right columns, so its outside spacing
     must be symmetrical. Reusing the conversation's reading gutter only on the
     left pushed the whole card farther right as the viewport widened. */
  /* The card starts on the same row as the first rail heading. Its contents are
     deliberately dense: this is a summary to scan before entering the stream,
     not a second page header. */
  .ticket { display: flex; padding: 28px 0 18px var(--workspace-gap); }
  .ticket-summary {
    flex: 1;
    border: 1px solid rgba(255,255,255,.11); border-right: 0; border-radius: 14px 0 0 14px;
    background: #0b0c11; overflow: hidden;
  }
  .thead { display: flex; align-items: center; gap: 12px; padding: 18px 30px 0; }
  .tk-id { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); text-decoration: none; flex: none; }
  .tk-id:hover { color: var(--accent); }
  h1.tk-title {
    margin-top: 14px; max-width: 28ch; font-size: clamp(22px, 1.65vw, 30px); font-weight: 650;
    letter-spacing: -.025em; color: #f4f4f6; line-height: 1.15;
  }
  .tk-live { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); flex: none; }
  .tk-live i { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: mcpulse 2s ease-in-out infinite; }
  .tk-stamp { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); flex: none; }
  .tk-count { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); flex: none; font-variant-numeric: tabular-nums; }
  /* Green once nothing is blocking: the count stops being a tally of what you owe
     and becomes the fact that you owe nothing. */
  .tk-count.set { color: var(--green); }
  /* A status that is not a leg — parked, or waiting to dispatch. Named plainly,
     because the track cannot point at it. */
  .tk-off {
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--amber); border: 1px solid var(--amber-line); border-radius: 5px; padding: 3px 8px; flex: none;
  }

  /* The band is a pass: one card, its border sitting exactly over the column the
     conversation runs in. It replaces a run-on line of "repo x base y branch z"
     where the labels were set in the same size and weight as the values they
     labelled, so every field had to be read to find any one of them. */
  .tband { padding: 0 30px 22px; }
  .pass {
    background: transparent; border: 0; border-radius: 0; padding: 0;
  }
  /* The gutter grows on a wide display so the header and the band sit over the
     conversation instead of stretching away from it — the 52px is the stream's
     own 26px of side padding, so the brief, the track and the messages all start
     on the same vertical. The rules themselves stay full-bleed: they divide the
     column, not the content. */
  :root { --gut: 26px; }
  @media (min-width: 1440px) {
    :root { --gut: max(26px, calc((100% - var(--read) + 52px) / 2)); }
  }
  /* One line, and it stays one line however long the brief is. The band is the top
     of every screen this ticket has; a Linear description is not, and four lines of
     it above the conversation was the loudest thing on a page that exists for the
     conversation. It opens on ▾ rather than scrolling in place. */
  .tk-brief { display: flex; align-items: baseline; gap: 12px; margin: 12px 0 18px; }
  .tk-brief .lead {
    flex: 1; max-width: 70ch; font-size: 14px; line-height: 1.65; color: var(--ink-3);
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tk-brief .more {
    flex: none; font-family: var(--mono); font-size: 11px; background: none; border: none;
    padding: 0; color: var(--ink-3); cursor: pointer;
  }
  .tk-brief .more:hover { color: var(--ink-2); }
  .tk-brief .files { flex: none; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .tk-brief .ext { flex: none; font-family: var(--mono); font-size: 11px; color: var(--cyan); text-decoration: none; }
  .tk-desc.rest {
    font-size: 13px; line-height: 1.65; color: var(--ink-3); max-width: 74ch;
    white-space: pre-wrap; margin: -16px 0 22px; max-height: 26vh; overflow-y: auto;
  }
  /* Labelled execution fields use the right status card, where operational
     context belongs beside status and actions instead of lengthening the brief. */
  .fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .fld .k {
    font-family: var(--mono); font-size: 9px; letter-spacing: .19em;
    text-transform: uppercase; color: var(--ink-4);
  }
  .fld .v {
    font-family: var(--mono); font-size: 12px; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: none;
  }
  .fld.last .v { color: var(--ink-3); }

  .repo-select {
    width: 100%; min-width: 0; height: 27px; margin: -3px 0 -4px;
    padding: 0 26px 0 0; border: 0; border-radius: 0;
    background: #0b0c11; color: var(--ink); font-family: var(--mono); font-size: 12px;
  }
  .repo-select:focus-visible {
    outline: 1px solid var(--cyan); outline-offset: 3px;
  }

  .summary-actions { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
  .summary-action {
    min-height: 38px; display: inline-flex; align-items: center; justify-content: center;
    padding: 0 16px; border-radius: 9px; border: 1px solid rgba(255,255,255,.14);
    background: transparent; color: var(--ink-3); font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .06em; text-transform: uppercase; text-decoration: none; cursor: pointer;
  }
  .summary-action.primary { color: #031a12; background: var(--build); border-color: var(--build); font-weight: 800; }
  .summary-safety { margin-left: auto; display: flex; gap: 8px; }
  .summary-note + .summary-safety { margin-left: 10px; }
  .summary-action.hold { color: var(--hold); border-color: rgba(245,158,11,.42); }
  .summary-action.reset { color: var(--ink-3); }
  .summary-action.close { color: var(--red); border-color: rgba(239,68,68,.42); }
  .summary-action:disabled { opacity: .42; cursor: not-allowed; }
  .summary-action:hover { color: var(--ink); border-color: rgba(255,255,255,.28); }
  .summary-action:disabled:hover { color: var(--ink-3); border-color: rgba(255,255,255,.14); }
  .summary-action.primary:hover { color: #031a12; filter: brightness(1.08); }
  .summary-action.hold:hover { color: #ffd48a; border-color: rgba(245,158,11,.72); background: rgba(245,158,11,.07); }
  .summary-action.close:hover { color: #ff8a8a; border-color: rgba(239,68,68,.72); background: var(--red-bg); }
  .summary-note { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--ink-4); }

  /* ─────────── progress track ─────────── */
  /* A hairline with a ring on the current leg. The floating "now" pill it replaces
     said the same thing as the cyan label directly under the ring. */
  .tk-bar { position: relative; height: 3px; border-radius: 2px; background: rgba(255,255,255,.08); }
  .tk-fill { position: absolute; left: 0; top: 0; height: 3px; border-radius: 2px; background: var(--cyan);
             transition: width .45s cubic-bezier(.4,0,.2,1); }
  .tk-bar.finished .tk-fill { background: var(--green); }
  .tk-dots { position: absolute; top: 50%; left: 0; right: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
  .tk-dots i { justify-self: center; width: 4px; height: 4px; border-radius: 50%;
               background: rgba(255,255,255,.14); transform: translateY(-50%); }
  .tk-dots i.done { background: rgba(255,255,255,.5); }
  .tk-dots i.now {
    width: 9px; height: 9px; background: var(--ground); border: 2px solid var(--cyan);
  }
  .tk-bar.finished + .tk-labels .now .n, .tk-bar.finished .tk-dots i.now { border-color: var(--green); }
  .tk-labels { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; margin-top: 12px; text-align: center; }
  .tk-labels span { display: flex; flex-direction: column; gap: 3px; }
  .tk-labels .n { font-size: 11.5px; color: var(--ink-3); }
  .tk-labels .done .n { color: var(--ink-3); }
  .tk-labels .now .n { color: var(--cyan); }
  .tk-labels .t { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); }
  .tk-labels .now .t { color: rgba(0,212,255,.7); }
  /* The complete lifecycle remains in the document for screen readers and tests;
     the visible summary uses the two hand-off cards above, matching the reference. */
  .lifecycle-sr {
    position: absolute !important; width: 1px !important; height: 1px !important;
    padding: 0 !important; margin: -1px !important; overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important;
  }

  @media (max-width: 1320px) {
    .ticket { padding-top: 28px; }
    .ticket-status-panel { margin-top: 28px; }
    .thead, .tband { padding-left: 24px; padding-right: 24px; }
  }

  /* ─────────── cards ─────────── */
  /* The plan map and the pre-triage findings are the middle column's other two
     views. They scroll in the same well the stream does, so the header and the
     rails never move. */
  /* Row 3, the same row .convo occupies — row 2 is the ticket header. When the nav
     was added the grid gained a row and this was left behind, so the findings and
     the plan rendered on top of the header. */
  .pane { grid-column: 2; grid-row: 3; min-width: 0; min-height: 0; overflow: auto; padding: 20px var(--gut) 40px; }
  @media (max-width: 1080px) { .pane { overflow: visible; } }
  .card { padding: 22px 0 0; border-top: 1px solid var(--line-soft); }
  .card:first-child { border-top: none; }
  .glab {
    font-family: var(--mono); font-size: 10.5px; font-weight: 400; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-4); margin: 0 0 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .glab .gn { margin-left: auto; font-family: var(--mono); font-size: 11px; letter-spacing: 0; font-weight: 500; }

  /* ─────────── plan map (SVG) ─────────── */
  .diagram-wrap { overflow-x: auto; padding: 4px 0 10px; }
  svg.plan-map { display: block; width: 100%; height: auto; }
  svg.plan-map text { font-family: var(--ui); }
  svg.plan-map .sbox { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
  svg.plan-map g.stepg:hover .sbox { stroke: var(--accent); }
  svg.plan-map .snum { fill: var(--ink-3); font-size: 11px; font-weight: 700; font-family: var(--mono); }
  svg.plan-map .stitle { fill: var(--ink); font-size: 13px; font-weight: 600; }
  svg.plan-map .srepo { fill: var(--ink-3); font-size: 11px; font-family: var(--mono); }
  svg.plan-map .flow { stroke: var(--ink-3); stroke-width: 1.5; fill: none; }
  svg.plan-map .cbox { fill: var(--green-bg); stroke: none; }
  svg.plan-map .ctext { fill: var(--green); font-size: 11.5px; font-weight: 600; font-family: var(--mono); }
  svg.plan-map .clab { fill: var(--ink-3); font-size: 10.5px; font-weight: 600; letter-spacing: .1em; font-family: var(--mono); }
  svg.plan-map .dec rect { stroke-width: 1.5; }
  svg.plan-map .dec.open rect { fill: var(--amber-bg); stroke: var(--amber); stroke-dasharray: 4 3; }
  svg.plan-map .dec.set rect { fill: var(--green-bg); stroke: var(--green); }
  svg.plan-map .dec .dt { font-family: var(--mono); font-size: 11px; font-weight: 700; }
  svg.plan-map .dec.open .dt, svg.plan-map .dec.open .ds { fill: var(--amber); }
  svg.plan-map .dec.set .dt, svg.plan-map .dec.set .ds { fill: var(--green); }
  svg.plan-map .dec .ds { font-size: 10.5px; }
  svg.plan-map .dlink { fill: none; stroke-width: 1.5; }
  svg.plan-map .dlink.open { stroke: var(--amber); stroke-dasharray: 4 3; }
  svg.plan-map .dlink.set { stroke: var(--green); opacity: .6; }
  svg.plan-map .nogsd-edge { fill: var(--amber); }
  svg.plan-map g.stepg { cursor: pointer; }
  svg.plan-map g.stepg.sel rect.sbox { stroke: var(--accent); stroke-width: 2.5; }
  svg.plan-map .wv { font-family: var(--mono); font-size: 9.5px; font-weight: 700; fill: var(--ink-3); letter-spacing: .1em; }
  svg.plan-map .wv.wait { fill: var(--amber); }
  svg.plan-map .ghost rect { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 4; }
  svg.plan-map .ghost .stitle, svg.plan-map .ghost .srepo { opacity: .55; }
  /* Read like a subway map: the station you are at pulses, the ones behind you are
     green and solid, the ones ahead are quiet outlines. A static cyan outline for
     "running" was indistinguishable from "selected" at a glance, which is the one
     thing the map exists to answer. */
  svg.plan-map .run rect.sbox {
    stroke: var(--cyan); stroke-width: 2.5; fill: var(--cyan-bg);
    animation: mcstation 1.6s ease-in-out infinite;
  }
  svg.plan-map .run .stitle { fill: var(--ink); }
  svg.plan-map .run .snum { fill: var(--cyan); }
  svg.plan-map .done rect.sbox { fill: var(--green-bg); stroke: var(--green); }
  svg.plan-map .done .snum { fill: var(--green); }
  /* The line already travelled, so the eye can follow the route. */
  svg.plan-map .flow.done { stroke: var(--green); opacity: .75; }
  svg.plan-map .flow.run { stroke: var(--cyan); animation: mcstation 1.6s ease-in-out infinite; }
  @keyframes mcstation {
    0%, 100% { opacity: 1; }
    50% { opacity: .45; }
  }
  /* The collapsed list is the same information; it should agree with the map. */
  .prow.done .pm { color: var(--green); }
  .prow.run .pm { color: var(--cyan); animation: mcstation 1.6s ease-in-out infinite; }
  .prow.run .pt { color: var(--ink); }
  @media (prefers-reduced-motion: reduce) {
    svg.plan-map .run rect.sbox, svg.plan-map .flow.run, .prow.run .pm { animation: none; }
  }
  svg.plan-map .blocked rect.sbox { stroke: var(--red); }
  svg.plan-map .blocked .snum { fill: var(--red); }
  .sd { background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-top: 14px; }
  .sd-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
  .sd-num { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--ink-3); }
  .sd-title { font-size: 15px; font-weight: 600; letter-spacing: -.014em; }
  .sd-close { margin-left: auto; cursor: pointer; border: none; background: none; color: var(--ink-3); font-size: 18px; line-height: 1; }
  .sd-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-bottom: 10px; }
  .sd-sec { margin-top: 12px; }
  .sd-lab { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px; }
  .sd-body { font-size: 13.5px; color: var(--ink-2); white-space: pre-wrap; }
  .sd-cmd { font-family: var(--mono); font-size: 11.5px; background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; overflow-x: auto; white-space: pre; }
  .sd-ac { font-size: 13px; color: var(--ink-2); padding-left: 16px; position: relative; margin-bottom: 5px; }
  .sd-ac::before { content: "—"; position: absolute; left: 0; color: var(--ink-3); }
  .sd-warn { background: var(--amber-bg); border: 1px solid var(--amber-line); color: var(--amber); border-radius: 8px; padding: 9px 11px; font-size: 12.5px; }
  .maplegend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); padding-bottom: 10px; }
  .maplegend span { display: flex; align-items: center; gap: 6px; }
  .maplegend i { width: 14px; height: 2px; border-radius: 1px; display: block; }
  .maplegend i.f { background: var(--ink-3); }
  .maplegend i.d { background: var(--amber); }
  .maplegend i.s { background: var(--green); opacity: .6; }


  /* ─────────── conversation (design 2b) ─────────── */
  /* The middle column: the stream scrolls, the composer is pinned under it. Two
     scrollbars on one page is how a reader loses their place, so the shell holds
     the height and only .stream moves. */
  .convo { display: flex; flex-direction: column; min-height: 0; }
  @media (max-width: 1080px) { .convo { display: block; } }

  @keyframes mcpulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .stream { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 0 8px; }
  /* Top-aligned. It used to be bottom-aligned "the way a conversation is", but
     this column is not only a conversation — it hangs off a ticket header, and
     bottom-alignment put a 380px hole between the two on any screen taller than
     the thread. The stream still scrolls to the newest message on load, so a
     long thread reads exactly as before; a short one now starts where the header
     ends instead of floating away from it. */
  .stream-in { max-width: var(--read); margin: 0 auto; padding: 0 26px; display: flex; flex-direction: column;
               justify-content: flex-start; gap: 26px; }
  @media (max-width: 1080px) { .stream { max-height: 58vh; } }
  .cmsg { display: grid; grid-template-columns: 24px 1fr; gap: 13px; align-items: start; }
  .cav {
    width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--mono); font-size: 9.5px; background: var(--green-bg); color: var(--green);
  }
  .cav.you { background: rgba(255,255,255,.07); color: var(--ink-3); }
  .crole {
    display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--ink-4); margin-bottom: 5px;
  }
  .cbody { font-size: 13.5px; line-height: 1.7; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
  /* A 500-character question must not push the composer off the screen. It scrolls
     where it stands: nothing is hidden and the answer box stays reachable. */
  .cq { font-size: 16px; line-height: 1.6; color: var(--ink); white-space: pre-wrap;
        max-height: 30vh; overflow-y: auto; }
  .cfind .fb { max-height: 18vh; overflow-y: auto; }

  /* A finding is amber because a human is the blocker — the one meaning amber has. */
  .cfind {
    border-left: 2px solid var(--amber); background: rgba(245,158,11,.035);
    border-radius: 0 7px 7px 0; padding: 11px 15px; margin-top: 13px;
  }
  .cfind .ft { font-size: 12.5px; font-weight: 600; color: #f4f4f6; margin-bottom: 5px; }
  .cfind .fb { font-size: 12px; line-height: 1.6; color: var(--ink-3); white-space: normal; }

  /* The id the answer will bind. Without it on the question, the receipt below
     says "Recorded as D-02" and nothing on screen ever said which one D-02 was. */
  .cbecomes {
    display: inline-block; margin-top: 8px; font-family: var(--mono); font-size: 10px;
    letter-spacing: .06em; color: var(--ink-3); border: 1px solid rgba(255,255,255,.14);
    border-radius: 5px; padding: 2px 7px;
  }

  .crec { margin-top: 12px; font-size: 12px; color: var(--ink-3); }
  .crec b { color: var(--cyan); font-weight: 500; }

  .cpills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
  .cpill {
    font-family: inherit; font-size: 12.5px; padding: 9px 14px; border-radius: 16px;
    border: 1px solid rgba(255,255,255,.12); background: transparent;
    color: var(--ink-3); cursor: pointer;
  }
  .cpill:hover { border-color: rgba(255,255,255,.28); color: var(--ink); }
  .cpill.rec { border-color: rgba(0,212,255,.3); color: var(--cyan); }
  .cpill.esc { color: var(--ink-3); }

  /* An answer belongs to the question it resolves. Keeping this field inside the
     live question prevents ordinary chat from being silently reinterpreted as a
     decision (or Enter on an answer from being sent through the ask endpoint). */
  .qanswer {
    margin-top: 14px; padding: 13px 14px 12px; border: 1px solid rgba(0,212,255,.22);
    border-radius: 10px; background: rgba(0,212,255,.035);
  }
  .qanswer-head {
    display: flex; justify-content: space-between; gap: 12px; margin-bottom: 9px;
    font-family: var(--mono); font-size: 10px; line-height: 1.4; color: var(--ink-3);
  }
  .qanswer-head b { color: var(--cyan); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }
  .qanswer-note { margin-top: 8px; font-family: var(--mono); font-size: 9.5px; color: var(--ink-4); }

  /* Your turn reads as yours: right-aligned, one corner squared off. */
  .cmsg.me { grid-template-columns: 1fr; }
  .cmsg.me .cbody {
    justify-self: end; max-width: 440px; background: rgba(255,255,255,.07);
    border-radius: 14px 14px 3px 14px; padding: 13px 16px; line-height: 1.65; color: #f0f0f4;
  }

  /* A decision is a receipt, not somebody speaking — so it carries no avatar and
     sits directly above whatever the agent said next. */
  .cdec { display: flex; flex-direction: column; gap: 4px; }
  .creceipt {
    display: flex; align-items: center; gap: 9px; font-family: var(--mono);
    font-size: 10.5px; color: var(--ink-3);
  }
  .creceipt .ok { color: var(--green); }
  .creceipt b { color: var(--ink-3); font-weight: 400; }
  .cdec .cbody { font-size: 12.5px; }
  .creason { font-size: 12px; line-height: 1.6; color: var(--ink-3); border-left: 2px solid rgba(255,255,255,.12); padding-left: 13px; }

  /* The thread's system half. An event is not somebody speaking, so it is a line
     rather than a message — no avatar, no bubble. Trouble is amber, which on this
     page means a human is the blocker, and that is what a failure makes you. */
  /* A bounded timeline, newest first. Five 68px rows are visible before this
     section scrolls; the rail itself no longer hides history behind a vague
     "routine updates" count. Pure liveness noise is omitted by the renderer. */
  .dacts {
    height: 340px; min-height: 340px; overflow-y: auto; overscroll-behavior: contain;
    scrollbar-gutter: stable; padding-right: 8px;
  }
  .activity-item {
    position: relative; display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 10px;
    height: 68px; min-height: 68px; padding: 0 0 10px; color: var(--ink-3);
  }
  .activity-item::after {
    content: ""; position: absolute; left: 4px; top: 12px; bottom: -2px;
    width: 1px; background: rgba(255,255,255,.12);
  }
  .activity-item:last-child::after { display: none; }
  .activity-item .mk {
    position: relative; z-index: 1; width: 9px; height: 9px; margin-top: 4px;
    border: 2px solid #0b0c11; border-radius: 50%; background: var(--ink-4);
  }
  .activity-item.event .mk { background: var(--cyan); }
  .activity-item.human .mk { background: var(--green); }
  .activity-item.agent .mk { background: var(--review); }
  .activity-item.bad .mk { background: var(--amber); }
  .activity-body { min-width: 0; }
  .activity-meta {
    display: flex; align-items: baseline; gap: 7px; margin-bottom: 3px;
    font-family: var(--mono); font-size: 9.5px; line-height: 1.2;
    color: var(--ink-4); text-transform: uppercase; letter-spacing: .06em;
  }
  .activity-meta .ts { font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none; }
  .activity-item.bad .activity-meta, .activity-item.bad .tx { color: var(--amber); }
  .activity-item .tx {
    display: -webkit-box; min-width: 0; overflow: hidden; overflow-wrap: break-word;
    -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    font-size: 11.5px; line-height: 1.42; color: var(--ink-2);
  }
  /* Waiting on a reply. Three dots rather than a spinner: a spinner implies
     something is actively computing, and between polls nothing is. */
  .cthink { display: flex; align-items: center; gap: 5px; height: 24px; }
  .cthink i {
    /* A 5px dot at the old .35 came out at 2.7:1 — under the 3:1 floor for a
       graphical indicator, so the one element whose whole job is to be noticed
       was the hardest thing on the page to see. */
    width: 5px; height: 5px; border-radius: 50%; background: var(--ink-3);
    animation: mcthink 1.3s ease-in-out infinite;
  }
  .cthink i:nth-child(2) { animation-delay: .18s; }
  .cthink i:nth-child(3) { animation-delay: .36s; }
  @keyframes mcthink {
    0%, 60%, 100% { opacity: .25; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-2px); }
  }
  .cwait {
    display: flex; align-items: center; gap: 9px; border: 1px solid rgba(255,255,255,.09);
    border-radius: 7px; padding: 9px 12px; font-family: var(--mono); font-size: 10.5px;
    color: var(--ink-3); margin-top: 13px;
  }
  .cwait i { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); animation: mcpulse 1.4s ease-in-out infinite; }
  .cwait .el { margin-left: auto; color: var(--green); }

  /* ─── the thread after triage settles (design 2c) ─── */
  /* The same thread keeps going: no new screen and no "submit". A rule marks the
     moment the questions stopped, so what came after is legible as consequence. */
  .cmark { display: flex; align-items: center; gap: 12px; }
  .cmark .ln { flex: 1; height: 1px; background: rgba(255,255,255,.07); }
  .cmark span:not(.ln) { font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; color: var(--ink-3); }

  /* The plan, in the stream rather than on a page of its own. It arrives as a
     message because that is when it arrives, and the decisions it was built from
     are three lines above it. */
  .pcard { margin-top: 13px; border: 1px solid rgba(255,255,255,.1); border-radius: 9px; padding: 15px 17px; }
  .ph { display: flex; align-items: center; gap: 10px; margin-bottom: 13px; }
  .ph .pf { font-family: var(--mono); font-size: 11px; color: var(--cyan); }
  .ph .pc { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
  .ph .popen {
    margin-left: auto; font-family: var(--mono); font-size: 10px; background: none;
    border: none; padding: 0; color: var(--ink-3); cursor: pointer;
  }
  .ph .popen:hover { color: var(--ink-2); }
  .psteps { display: flex; flex-direction: column; gap: 9px; font-size: 11px; }
  .prow { display: flex; gap: 11px; align-items: baseline; }
  .prow .pm { flex: none; color: var(--ink-4); }
  .prow .pt { color: var(--ink-3); }
  .prow .pn { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--ink-4); }
  .prow.done .pm { color: var(--green); }
  .prow.done .pt { color: var(--ink-3); }
  .prow.done .pn { color: var(--ink-4); }
  .prow.run .pm { color: var(--cyan); }
  .prow.run .pt { color: #f4f4f6; }
  .prow.run .pn { color: var(--ink-4); }
  .prow.blocked .pm, .prow.blocked .pn { color: var(--red); }
  .prow.blocked .pt { color: var(--ink-3); }

  /* A settled question is the record, not the conversation. One line, openable. */
  .csettled { border-left: 2px solid var(--green); padding-left: 11px; }
  .csettled > summary {
    list-style: none; cursor: pointer; display: grid;
    grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: baseline;
  }
  .csettled > summary::-webkit-details-marker { display: none; }
  .csettled > summary:hover .cs-q { color: var(--ink); }
  .cs-tag { font-family: var(--mono); font-size: 10px; color: var(--green); }
  .cs-q { font-size: 11.5px; line-height: 1.5; color: var(--ink-3);
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The outcome on a collapsed line is an identifier, not the answer in full — that
     is inside. Uncapped it ran off the column and got sliced mid-word by the edge. */
  .cs-a { font-family: var(--mono); font-size: 10px; color: var(--green);
          white-space: nowrap; max-width: 26ch; overflow: hidden; text-overflow: ellipsis; }
  .cs-n { grid-column: 2; font-family: var(--mono); font-size: 9.5px; color: var(--ink-4); }
  .csettled[open] > summary { margin-bottom: 16px; }
  .csettled[open] > summary .cs-q { white-space: normal; }
  .cs-body { display: flex; flex-direction: column; gap: 20px; }

  /* ─── composer ─── */
  /* The exits are pills beside the box rather than a sentence under it: handing the
     choice to the agent and answering later are outcomes for the question above. */
  .composer { padding: 0 0 20px; flex: none; }
  /* Named `cin`, not `composer-in`: the test that there is exactly one composer
     counts `class="composer` prefixes, and a child sharing that prefix is a second
     one as far as a string match is concerned. */
  .cin { max-width: var(--read); margin: 0 auto; padding: 0 26px; }
  .cactive { font-family: var(--mono); font-size: 12px; line-height: 1.5; letter-spacing: .02em; color: var(--ink-2); margin-bottom: 5px; }
  .cactive b { color: var(--cyan); font-weight: 400; }
  .cbind { font-family: var(--mono); font-size: 10px; line-height: 1.5; color: var(--ink-4); margin-bottom: 11px; }
  .cbind b { color: var(--cyan); font-weight: 400; }
  /* Why the gate is being shown. A verdict you cannot see is one you cannot
     disagree with, which is the failure mode this whole gate replaces. */
  .cwhy, .ctarget { font-family: var(--mono); font-size: 10px; line-height: 1.6; color: var(--ink-4); margin-bottom: 11px; }
  .cwhy b, .ctarget b { color: var(--ink-3); font-weight: 400; text-transform: uppercase; letter-spacing: .06em; }
  .cexits { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 11px; }
  .cexits .cpill { font-size: 12px; padding: 8px 13px; }
  .crow {
    display: flex; align-items: center; gap: 12px;
    border: 1px solid rgba(255,255,255,.13); border-radius: 12px; padding: 8px 10px 8px 16px;
  }
  .crow:focus-within { border-color: rgba(0,212,255,.4); }
  .crow input {
    flex: 1; min-width: 0; font-family: inherit; font-size: 13px; color: var(--ink);
    background: transparent; border: none; padding: 6px 0;
  }
  .crow input::placeholder { color: var(--ink-3); }
  .crow input:focus { outline: none; }
  .csend {
    width: 26px; height: 26px; border-radius: 8px; border: none; background: rgba(0,212,255,.9);
    color: #031a20; font-size: 12px; cursor: pointer; flex: none; display: grid; place-items: center;
  }
  .csend.text { width: auto; padding: 0 10px; font-family: var(--mono); font-size: 10px; font-weight: 700; }
  .csend:hover { filter: brightness(1.12); }
  /* Typed text is a message by default. Binding it as the decision is the deliberate
     press, so it reads as a command beside the box rather than a second submit. */
  .cbtn {
    font-family: var(--mono); font-size: 10px; letter-spacing: .05em; padding: 5px 8px;
    border-radius: 6px; border: 1px solid transparent; background: none; color: var(--ink-4); cursor: pointer; flex: none;
  }
  .cbtn:hover { color: var(--cyan); border-color: rgba(0,212,255,.3); }

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/**
 * Message text as the writer meant it, not as raw source.
 *
 * Everything on this page ran through `esc` and stopped there, so a Linear reply
 * arrived reading `**Nick** replied on Linear:` with the asterisks intact and its
 * links as bare URLs — the markdown that Linear, the bridge and the agents all
 * write was displayed rather than rendered.
 *
 * Escaping happens FIRST and the patterns are matched against the escaped text, so
 * there is no path from message content to markup: a `<script>` in a comment is
 * already `&lt;script&gt;` before any of this runs. Deliberately just the inline
 * marks that actually appear here — bold, italic, code, links — because a general
 * markdown parser is a much larger surface than this page needs.
 */
function mdInline(text) {
  let out = esc(text);
  // Code first: its contents must not then be read as emphasis.
  const code = [];
  out = out.replace(/`([^`\n]+)`/g, (_, body) => {
    code.push(body);
    return `\u0000${code.length - 1}\u0000`;
  });
  // [label](url) — only http(s), so `javascript:` cannot be smuggled in.
  out = out.replace(/\[([^\]\n]+)\]\((https?:&#x2F;&#x2F;[^\s)]+|https?:\/\/[^\s)]+)\)/g,
    (_, label, href) => `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`);
  // Bare URLs, so a pasted link is still clickable.
  out = out.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,
    (_, pre, href) => `${pre}<a href="${href}" target="_blank" rel="noopener noreferrer">${href}</a>`);
  out = out.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>");
  out = out.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${code[Number(i)]}</code>`);
  // Newlines are meaningful in these messages; they were collapsing to one line.
  return out.replace(/\n/g, "<br>");
}

// Which ticket the page is showing. Not a constant: the rail switches between
// tickets in place, so a full document load — refetching the page, the rail and
// every ticket in it just to change one column — is work nobody asked for.
let taskId = new URLSearchParams(location.search).get("id") || "";
let selectedStep = null;
/* Whether the autonomy presets are showing. A poll re-renders the rail wholesale,
   so the disclosure's own state would reset every fifteen seconds without this —
   the same reason `planOpen` exists. */
let autonomyOpen = false;
/** The agent's mark in the stream. One identity, not one per internal stage. */
const AVATAR = "mc";

const LEGS = [
  { label: "Intake",  statuses: ["inbox"] },
  { label: "Triage",  statuses: ["planning"] },
  { label: "Plan",    statuses: ["assigned"] },
  { label: "Build",   statuses: ["in_progress"] },
  { label: "Review",  statuses: ["review", "in_review", "testing"] },
  { label: "Done",    statuses: ["done", "completed", "merged"] },
  { label: "Closed",  statuses: ["closed", "canceled", "cancelled"] },
];

async function getJson(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`${path} → ${res.status}`);
  return res.json();
}

function parseTriage(task) {
  const raw = task.triage_state;
  if (!raw) return null;
  try { return typeof raw === "string" ? JSON.parse(raw) : raw; } catch { return null; }
}

const pick = (re, s) => (re.exec(s || "") || [])[1] || "";

/** Activity types that mark a leg being reached, newest write wins. */
const LEG_MARKERS = {
  triage: [/triage/i, /clarification/i, /planning_questions/i],
  plan:   [/plan_created/i, /execution plan/i],
  build:  [/step_dispatched/i, /spawned/i],
  review: [/review/i],
  done:   [/completed successfully/i, /merged/i],
};

function legTimes(task, activities) {
  const t = { intake: task.created_at };
  for (const a of activities || []) {
    const hay = `${a.activity_type || ""} ${a.message || ""}`;
    for (const [leg, pats] of Object.entries(LEG_MARKERS)) {
      if (!t[leg] && pats.some(p => p.test(hay))) t[leg] = a.created_at;
    }
  }
  return t;
}

const shortTime = iso => {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const today = new Date().toDateString() === d.toDateString();
  return today
    ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
    : d.toLocaleDateString([], { month: "short", day: "numeric" });
};

/** How long ago, in the units the design uses: "12m", "3h", "2d". */
function since(iso) {
  if (!iso) return "";
  const ms = Date.now() - new Date(iso).getTime();
  if (!isFinite(ms) || ms < 0) return "";
  const m = Math.round(ms / 60000);
  if (m < 60) return `${Math.max(1, m)}m`;
  const h = Math.round(m / 60);
  return h < 48 ? `${h}h` : `${Math.round(h / 24)}d`;
}

/**
 * The brief, as prose rather than as its source.
 *
 * A Linear description arrives with the attachment URLs inline, and MET-635's are
 * 140 characters each: rendered raw they were the loudest thing on the page, four
 * lines of signed S3 query string above the conversation the page exists for. They
 * are not nothing, though — an attachment is a thing triage was holding — so they
 * are counted rather than dropped, and the label of a markdown link survives as the
 * words somebody wrote.
 *
 * The two lines the meta row repeats verbatim (base branch, target app) come out.
 */
function brief(description) {
  const lines = (description || "").split("\n")
    .filter(l => l.trim() && !/^\s*(base[- ]?branch|target app)\s*:/i.test(l));
  const raw = lines.join("\n");
  const attachments = (raw.match(/https?:\/\/\S+/g) || []).length;
  const prose = raw
    .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")   // markdown link → the words in it
    .replace(/<https?:\/\/[^>]*>/g, "")        // an angle-bracketed bare url
    .replace(/https?:\/\/\S+/g, "")            // anything still a url
    .replace(/\(\s*\)/g, "")
    .split("\n").map(l => l.replace(/[ \t]{2,}/g, " ").trim()).filter(Boolean);
  const full = prose.join("\n");
  // The lead is one line's worth; the band clips it and ▾ opens the whole thing.
  return { lead: prose.join(" "), full, attachments };
}

/**
 * The header, per design 2b: one line of identity, then the brief and the track.
 *
 * The status pill went. It named the leg the tracker was already pointing at, in a
 * second vocabulary ("planning" against "Triage"), and two names for one state on
 * one line is how a page stops being read.
 */
function renderTicket(task, triage, activities, extra = {}) {
  // -1 when the status is not a leg at all (on_hold, pending_dispatch). Clamping
  // that to 0 claimed the ticket was in Intake — a parked ticket that had already
  // planned and built read as one nothing had happened to yet.
  const legIndex = LEGS.findIndex(l => l.statuses.includes(task.status));
  const offTrack = legIndex < 0;
  const finished = !offTrack && legIndex >= LEGS.length - 1;
  // The fill stops at the centre of the current leg's slice, where its dot is.
  const pct = offTrack ? 0 : ((legIndex + 0.5) / LEGS.length) * 100;

  const { lead, full, attachments } = brief(task.description);

  const times = legTimes(task, activities);
  const dots = LEGS.map((_, i) =>
    `<i class="${i < legIndex ? "done" : i === legIndex ? "now" : ""}"></i>`).join("");
  const labels = LEGS.map((l, i) => {
    const here = i === legIndex;
    // A leg the ticket has not reached carries no date. The activity patterns are
    // loose on purpose — "review" appears in plenty of messages — so a leg ahead of
    // the current one was picking up a stamp and claiming the ticket had been there.
    const stamp = here ? `now · ${since(times[l.label.toLowerCase()] || task.updated_at)}`
                       : i < legIndex ? shortTime(times[l.label.toLowerCase()]) : "";
    return `<span class="${i < legIndex ? "done" : here ? "now" : ""}">
      <span class="n">${esc(l.label)}</span>
      ${stamp ? `<span class="t">${esc(stamp)}</span>` : ""}</span>`;
  }).join("");

  const qs = (triage && triage.questions) || [];
  const settled = qs.filter(q => q.answer).length;
  const planReady = !!(extra.plan && (extra.plan.steps || []).length);
  const inReview = ["review", "in_review", "testing"].includes(task.status);
  const planStates = planReady
    ? Object.values(stepStates(extra.plan, extra.progress, extra.agentProgress)) : [];
  const planComplete = planReady && planStates.length === extra.plan.steps.length
    && planStates.every(state => state === "done");
  const hasPullRequest = !!task.pr_url || (extra.deliverables || []).some(d =>
    ["pr", "pull_request"].includes(String(d.deliverable_type || "").toLowerCase())
      && /^https?:\/\//.test(d.path || ""));
  // Holding pauses execution; it does not rewind a build that already reached
  // review. Preserve preview access when durable evidence (preview, PR, completed
  // plan, or review-phase receipt) proves the held ticket was review-ready.
  const heldAfterReview = task.status === "on_hold" && (
    !!task.preview?.url || hasPullRequest || planComplete
      || ["review", "testing", "done"].includes(extra.agentProgress?.phase));
  const previewReady = ["review", "in_review", "testing", "done"].includes(task.status)
    || heldAfterReview;
  const previewAction = !previewReady ? "" : task.preview?.url
    ? `<a class="summary-action" href="${esc(task.preview.url)}" target="_blank" rel="noopener">Open preview${task.preview.apiReadOnly ? " · prod read-only" : ""}</a>`
    : `<button class="summary-action" data-start-preview title="Run this completed build locally and open it">Start preview</button>`;
  return `
    <div class="ticket">
      <section class="ticket-summary">
        <div class="thead">
          <a class="tk-crumb" href="/">Tickets ›</a>
          <span class="tk-id">${esc(taskRef(task))}</span>
          ${offTrack ? `<span class="tk-off">${esc((task.status || "").replace(/_/g, " "))}</span>` : ""}
          ${extra.agent && !offTrack ? `<span class="tk-live"><i></i>${esc(extra.agent)}</span>` : ""}
          <span class="tk-stamp">updated ${esc(since(task.updated_at) || "—")} ago</span>
          <span class="tk-count ${qs.length && settled === qs.length ? "set" : ""}">${
            qs.length ? `${settled} of ${qs.length} settled` : ""}</span>
        </div>
        <div class="tband"><div class="pass">
          <h1 class="tk-title" title="${esc(task.title)}">${esc(taskTitle(task))}</h1>
          <div class="tk-brief">
            <div class="lead">${esc(lead)}</div>
            ${full ? `<button class="more" data-more="1" aria-expanded="false">▾ description</button>` : ""}
            ${attachments ? `<span class="files">${attachments} file${attachments > 1 ? "s" : ""}</span>` : ""}
          </div>
          ${full ? `<p class="tk-desc rest" data-fulldesc hidden>${esc(full)}</p>` : ""}
          <div class="summary-actions">
            ${planReady ? `<button class="summary-action primary" data-planopen>Open plan</button>` : ""}
            ${previewAction}
            ${inReview ? "" : `<span class="summary-note">${esc(runStatus(task, extra.plan, extra.progress, qs, extra.agentProgress))}</span>`}
            ${!finished ? `<span class="summary-safety">
              ${triage && !["done", "completed", "merged"].includes(task.status) ? `<button class="summary-action reset" data-reset-triage>Reset triage</button>` : ""}
              ${!["on_hold", "done", "completed", "merged"].includes(task.status) ? `<button class="summary-action hold" data-hold-task>Pause task</button>` : ""}
              <button class="summary-action close" data-close-task>Close ticket</button>
            </span>` : ""}
          </div>
          <div class="lifecycle-sr" aria-hidden="true">
            <div class="tk-bar ${finished ? "finished" : ""}">
              <div class="tk-fill" style="width:${pct}%"></div>
              <div class="tk-dots">${dots}</div>
            </div>
            <div class="tk-labels">${labels}</div>
          </div>
        </div></div>
      </section>
    </div>`;
}

/**
 * One labelled field on the pass. An empty value renders nothing rather than a
 * caption over a dash — a pass with no APP printed on it is a pass with no app,
 * and the row reads shorter instead of emptier.
 */
function field(label, value, cls = "") {
  if (!value) return "";
  return `<div class="fld ${cls}"><span class="k">${esc(label)}</span><span class="v" title="${
    esc(value)}">${esc(value)}</span></div>`;
}

function executionFacts(task, triage) {
  const executionTarget = triage?.execution_target || {};
  const targetRepos = (executionTarget.repos || []).length
    ? executionTarget.repos
    : ((triage && triage.triage_repos) || []).map(r => ({ ...r, label: `${r.project}/${r.repo}` }));
  const repos = [...new Set(targetRepos.map(r => r.label || `${r.project}/${r.repo}`))];
  const bases = [...new Set(targetRepos.map(r => r.base_branch).filter(Boolean))];
  const fallbackBase = pick(/^\s*base[- ]?branch:\s*(\S+)\s*$/im, task?.description);
  const fallbackApp = pick(/^\s*target app:\s*`?([^`\s(]+)/im, task?.description);
  const apps = [...new Set((executionTarget.apps || []).concat(fallbackApp ? [fallbackApp] : []))];
  return { repos, bases, apps, fallbackBase };
}

function renderExecutionTarget(task, triage, side = {}) {
  const { repos, bases, apps, fallbackBase } = executionFacts(task, triage);
  const currentRepo = repos.length === 1 ? repos[0] : "";
  const repoOptions = [...new Set([currentRepo, ...(side.repoOptions || [])].filter(Boolean))]
    .sort((a, b) => {
      const an = a.split("/").pop()?.toLowerCase() === "backend" ? 0 : 1;
      const bn = b.split("/").pop()?.toLowerCase() === "backend" ? 0 : 1;
      return an - bn || a.localeCompare(b);
    });
  const planReady = !!(side.plan && (side.plan.steps || []).length);
  const buildStarted = task?.status === "in_progress"
    || Object.values(side.progress?.steps || {}).some(s => ["in_progress", "completed", "blocked"].includes(s.status));
  const buildDone = ["review", "in_review", "testing", "done", "completed", "merged", "closed", "canceled", "cancelled"].includes(task?.status);
  const legacyRepoConfirmed = !!triage?.confirmed && !("repo_confirmed" in triage);
  const repoConfirmed = !!currentRepo
    && (triage?.repo_confirmed === currentRepo || legacyRepoConfirmed);
  const repoEditable = !!triage && !planReady && !buildStarted && !buildDone;
  const repoField = repoEditable ? `<div class="fld repo-field"><span class="k">repo</span>
    <select class="repo-select" data-repo-select data-current="${esc(currentRepo)}" aria-label="Repository for this ticket">
      ${!repoConfirmed ? `<option value="" selected disabled>Select repository…</option>` : ""}
      ${repoOptions.length ? repoOptions.map(label => `<option value="${esc(label)}" ${repoConfirmed && label === currentRepo ? "selected" : ""}>${esc(label)}</option>`).join("")
        : `<option value="">Discovering repositories…</option>`}
    </select></div>` : field("repo", repos.join(", "));
  const fields = [
    repoField,
    field("base", (bases.length ? bases : fallbackBase ? [fallbackBase] : []).join(", ")),
    field("app", apps.join(", ")),
  ].filter(Boolean).join("");
  return fields ? `<div class="status-target"><div class="status-target-grid">${fields}</div></div>` : "";
}

/**
 * The ticket rail — what else is waiting on you, without a trip back to the board.
 *
 * Grouped by the same legs the tracker uses, so a ticket sits under the same word
 * in both places. The badge is the count of questions blocking that ticket, because
 * that is the only reason one of these rows is your problem rather than an agent's.
 */
/**
 * Every ticket, grouped by leg. The rail is the thread list for the whole board.
 *
 * It used to build groups from LEGS alone and drop anything that matched none —
 * so `on_hold`, `testing` and `pending_dispatch` tickets simply were not there,
 * while the nav counted them. A parked ticket disappearing from the list is the
 * worst case: it is parked precisely because someone needs to come back to it.
 *
 * Done and Closed are separate collapsed archives: Done means completed work;
 * Closed means an operator ended or archived the ticket.
 */
function railGroups(tasks) {
  // The rail is an operating queue, not a second copy of the six-step tracker.
  // Its order is fixed by the operator's scan: decisions first, then work in
  // motion, review, parked work, and finally the closed archive.
  const groups = [
    { label: "Triage", statuses: ["inbox", "planning"], tasks: [] },
    { label: "Building", statuses: ["assigned", "in_progress"], tasks: [] },
    { label: "Review", statuses: ["review", "in_review", "testing"], tasks: [] },
    { label: "Holding", statuses: ["on_hold", "pending_dispatch"], tasks: [] },
    { label: "Done", statuses: ["done", "completed", "merged"], tasks: [] },
    { label: "Closed", statuses: ["closed", "canceled", "cancelled"], tasks: [] },
  ];
  const other = { label: "Other", statuses: [], tasks: [] };
  for (const t of tasks || []) {
    const g = groups.find(x => x.statuses.includes(t.status));
    (g || other).tasks.push(t);
  }
  // Anything the legs do not name still has to show, under the status it actually
  // has rather than under a heading that would be a guess.
  const extra = [];
  for (const t of other.tasks) {
    const label = (t.status || "unknown").replace(/_/g, " ");
    let g = extra.find(x => x.label === label);
    if (!g) extra.push(g = { label, statuses: [t.status], tasks: [] });
    g.tasks.push(t);
  }
  return [...groups, ...extra].filter(g => g.tasks.length);
}

function railTone(label) {
  const value = String(label || "").toLowerCase();
  if (value.includes("hold") || value.includes("pending")) return "hold";
  if (value.includes("build") || value === "plan") return "building";
  if (value.includes("review") || value.includes("test")) return "review";
  if (value.includes("triage") || value.includes("planning")) return "triage";
  if (value.includes("inbox") || value.includes("intake")) return "intake";
  if (value.includes("closed") || value.includes("cancel")) return "closed";
  if (value.includes("done") || value.includes("complete") || value.includes("merge")) return "done";
  return "done";
}

function taskTone(status) {
  if (["on_hold", "pending_dispatch"].includes(status)) return "hold";
  if (["assigned", "in_progress"].includes(status)) return "building";
  if (["review", "in_review", "testing"].includes(status)) return "review";
  if (["planning", "triage", "triaging"].includes(status)) return "planning";
  if (["closed", "canceled", "cancelled"].includes(status)) return "closed";
  if (["done", "completed", "merged"].includes(status)) return "done";
  return "intake";
}

function openCount(task) {
  const st = parseTriage(task);
  return blockingQuestions(st && st.questions).length;
}

/**
 * Human actions that make a rail card part of the operator's queue.
 *
 * A paused task and an implementation problem are not enough by themselves: they
 * may be intentional or agent-resolvable. The amber treatment is reserved for a
 * concrete thing this page lets the operator do — answer, confirm, decide.
 *
 * Each reason is a discrete outstanding item with a count, which is what makes
 * the bell worth looking at: it names something specific, and it goes away when
 * that thing is dealt with. A *status* is not such a thing. `review` used to
 * qualify, and it was the one reason that could never be cleared from this page
 * — every task in review carried a permanent bell saying "this task is in
 * review", which its column already said. Marking the expected state of a whole
 * column as exceptional is how an attention signal stops being read at all, so
 * the amber is spent only where there is an actual item waiting on the operator.
 *
 * A task in review that *does* raise a checkpoint still lights up — via the
 * checkpoint, which is the concrete thing, rather than via its status.
 */
function ticketAttention(task, triageState) {
  if (!task || DONE.includes(task.status)) return [];
  const triage = triageState === undefined ? parseTriage(task) : triageState;
  const questions = (triage && triage.questions) || [];
  const open = blockingQuestions(questions).length;
  const checkpoints = Math.max(0, Number(task.pending_checkpoints) || 0);
  const preDispatch = ["inbox", "planning"].includes(task.status);
  const confirmation = !!triage && preDispatch && !triage.confirmed && open === 0
    && (questions.length === 0 || questions.every(q => q.answer));
  const reasons = [];
  if (open) reasons.push(`${open} open question${open === 1 ? "" : "s"}`);
  if (confirmation) reasons.push("confirmation");
  if (checkpoints) reasons.push(`${checkpoints} pending decision${checkpoints === 1 ? "" : "s"}`);
  return reasons;
}

function attentionBell(reasons) {
  if (!reasons.length) return "";
  const label = `Needs your attention: ${reasons.join(", ")}`;
  return `<span class="rt-needs-icon" role="img" aria-label="${esc(label)}" title="${esc(label)}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path>
    </svg></span>`;
}

/**
 * The top nav (design 2b, revised): where you are, and what is happening elsewhere.
 *
 * Every count is derived from the ticket list the rail already needed, so the bar
 * costs no extra request. Every tab points at a page that exists — the design's
 * "Knowledge" tab has no route behind it here, and a tab that goes nowhere is worse
 * than one that is absent. The dashboard filters are hash-driven, so Inbox/Swarm/
 * Review land on the list they name rather than all on the same unfiltered board.
 */
function renderNav(tasks, current) {
  const rows = tasks || [];
  const open = rows.filter(t => !DONE.includes(t.status));
  const needsYou = rows.filter(t => openCount(t) > 0).length;
  const running = rows.filter(t => t.status === "in_progress").length;
  const inReview = rows.filter(t => ["review", "in_review", "testing"].includes(t.status)).length;

  const tab = (label, href, count, cls, on) =>
    `<a class="tab ${on ? "on" : ""}" href="${href}">${esc(label)}${
      count ? `<span class="c ${cls}">${count}</span>` : ""}</a>`;

  return `<nav class="topnav">
    <a class="wordmark" href="/">MISSION CONTROL</a>
    <div class="tabs">
      ${tab("Inbox", "/#planning", needsYou, "need", false)}
      ${tab("Tickets", "/", open.length, "", true)}
      ${tab("Swarm", "/space", running, "run", false)}
      ${tab("Review", "/#review", inReview, "rev", false)}
    </div>
    <div class="navright">
      ${running ? `<span class="live"><i></i>${running} running</span>` : ""}
      ${needsYou ? `<span class="need">${needsYou} need${needsYou === 1 ? "s" : ""} you</span>` : ""}
    </div>
  </nav>`;
}

const DONE = ["done", "completed", "merged", "closed", "canceled", "cancelled"];

function renderRail(tasks, current, triage, planData = {}, planCache = {}) {
  const qs = (triage && triage.questions) || [];
  const settled = qs.filter(q => q.answer).length;
  const groups = railGroups(tasks && tasks.length ? tasks : (current ? [current] : []));

  // Once there is a plan the segments are the steps, because that is what is
  // moving. Before it, they are the questions — the only progress triage has.
  const steps = (planData.plan && planData.plan.steps) || [];
  const stepState = n => ((planData.progress && planData.progress.steps) || {})[String(n)] || {};
  const stepsDone = steps.filter(s => stepState(s.step).status === "completed").length;
  const track = steps.length
    ? { word: "step", n: stepsDone, total: steps.length,
        cls: steps.map(s => {
          const st = stepState(s.step).status;
          return st === "completed" ? "done" : st === "in_progress" ? "now" : "";
        }) }
    : qs.length
      ? { word: "triage", n: settled, total: qs.length,
          cls: qs.map((q, i) => q.answer ? "done" : (i === settled ? "now" : "")) }
      : null;

  const rows = groups.map(g => {
    // Past triage the ticket is the agent's, not yours: green rather than cyan.
    // A parked or unknown state is neither — it is not moving, so it gets neither
    // colour rather than borrowing the one that means "an agent has this".
    const tone = railTone(g.label);
    const building = ["Building", "Review", "Done"].includes(g.label);
    // Preserve the API's created-at ordering. Selecting a ticket changes only its
    // highlight; promoting it to the top made the whole rail jump on every click.
    const list = g.tasks.slice(0, 5).map(t => {
        const on = t.id === current?.id;
        const open = openCount(t);
        const attention = ticketAttention(t, on && triage ? triage : undefined);
        const badge = on
          ? `<span class="rt-badge ${building ? "ok" : tone === "hold" ? "q" : "now"}">${esc(
              tone === "hold" ? (since(t.updated_at) || "held") : building ? g.label.toLowerCase() : "now")}</span>`
          : open ? `<span class="rt-badge q">${open} q</span>`
          : `<span class="rt-badge ok">${esc((t.status || "").replace("_", " "))}</span>`;
        const remembered = planCache[t.id];
        const rememberedSteps = remembered?.plan?.steps || [];
        const rememberedStates = stepStates(
          remembered?.plan, remembered?.progress, remembered?.agentProgress);
        const rememberedTrack = rememberedSteps.length ? {
          word: "step",
          n: rememberedSteps.filter(s => rememberedStates[s.step] === "done").length,
          total: rememberedSteps.length,
          cls: rememberedSteps.map(s => rememberedStates[s.step] === "done" ? "done"
            : ["run", "blocked"].includes(rememberedStates[s.step]) ? "now" : ""),
        } : null;
        const rowQuestions = parseTriage(t)?.questions || [];
        const rowSettled = rowQuestions.filter(q => q.answer).length;
        const rowQuestionTrack = rowQuestions.length ? {
          word: "triage",
          n: rowSettled,
          total: rowQuestions.length,
          cls: rowQuestions.map((q, i) => q.answer ? "done" : (i === rowSettled ? "now" : "")),
        } : null;
        const leg = LEGS.findIndex(l => l.statuses.includes(t.status));
        const rowTrack = on && track ? track : rememberedTrack || rowQuestionTrack || {
          word: t.status === "on_hold" ? "held" : "stage",
          n: leg < 0 ? 0 : leg + 1,
          total: LEGS.length,
          cls: LEGS.map((_, i) => i < leg ? "done" : i === leg ? "now" : ""),
        };
        const bars = `<div class="rt-seg"><span class="dim">${esc(rowTrack.word)}</span>
             <span class="bars">${rowTrack.cls.map(c => `<i class="${c}"></i>`).join("")}</span>
             <span class="n">${rowTrack.n}/${rowTrack.total}</span></div>`;
        const live = `<div class="rt-live">${bars}${on
          ? `<div class="who"><span class="dim">updated ${esc(since(t.updated_at) || "just now")} ago</span></div>` : ""}</div>`;
        const classes = ["rt", attention.length ? "needs-you" : "",
          on ? (building ? "on build" : "on") : ""].filter(Boolean).join(" ");
        return `<a class="${classes}" href="/ticket?id=${encodeURIComponent(t.id)}">
          <div class="rt-top"><span class="rt-ref">${esc(taskRef(t))}</span>${attentionBell(attention)}${badge}</div>
          <div class="rt-title">${esc(taskTitle(t))}</div>${live}</a>`;
      }).join("");
    const heading = `${g.label.toUpperCase()} · ${g.tasks.length}`;
    return `<details class="rsection tone-${tone}" ${["done", "closed"].includes(tone) ? "" : "open"}>
      <summary class="rgroup tone-${tone}" aria-label="${esc(heading)}"><span>${esc(g.label.toUpperCase())}</span><b>${g.tasks.length}</b></summary>
      <div class="rlist tone-${tone}">${list}</div>
    </details>`;
  }).join("");

  return `<div class="rail">
    ${rows || `<div class="rgroup">NO OTHER TICKETS</div>`}
    <a class="foot" href="/">← all tasks</a>
  </div>`;
}

/* ─────────── the plan, as a map ─────────── */

const BOX_W = 208, BOX_H = 74, GAP_Y = 20, GAP_X = 74, PAD = 14;
// Decisions are one line each: a locked decision needs to be identifiable, not read
// in full — the collapsed list above has the wording.
const DEC_H = 30, DEC_GAP = 8;

/**
 * What state a step is in, as a subway map reads it: done, running, or ahead.
 *
 * Per-step status is authoritative when it exists, but it only exists under
 * multi-step dispatch, and that is off by default (`ENABLE_MULTI_STEP_PLANNING`) —
 * one agent takes the whole plan, so nothing ever writes it. That left every node
 * pending forever: MET-640 had step 01-01 written, verified and committed while the
 * map said "0 of 22 done, nothing running".
 *
 * So fall back to the signal that does move. The agent reports which *plan* it is
 * working as `step_label` ("01-02 Wire the canonical headers…"), and every step
 * carries the plan it came from. Plans before it are finished, its own are running,
 * later ones are ahead. Coarser than per-step — a plan's steps light up together —
 * but it is true, and it moves.
 */
function stepStates(plan, progress, agentProgress) {
  const perStep = (progress && progress.steps) || null;
  const out = {};
  const current = String(agentProgress?.step_label || "").match(/^(\d+-\d+)/);
  const running = agentProgress?.state === "running" || agentProgress?.state === "waiting";
  // The run finished, so nothing is still in flight and nothing is still ahead.
  // Without this the plan the agent stopped on stayed drawn as unreached — MET-640
  // sat at `state: done` with its last seven steps rendered pending, which reads as
  // work outstanding on a ticket that has moved to review.
  const finished = agentProgress?.state === "done";

  for (const s of (plan && plan.steps) || []) {
    const own = perStep && perStep[String(s.step)];
    if (own && own.status) {
      out[s.step] = own.status === "completed" ? "done"
        : own.status === "in_progress" ? "run"
        : (own.status === "blocked" || own.status === "failed") ? "blocked" : "";
      continue;
    }
    if (finished) { out[s.step] = "done"; continue; }
    if (!current || !s.plan) { out[s.step] = ""; continue; }
    // Plan ids are zero-padded ("01-02"), so a string compare is the right order.
    out[s.step] = s.plan < current[1] ? "done"
      : s.plan === current[1] ? (running ? "run" : "")
      : "";
  }
  return out;
}

/**
 * The short reference to print on a card.
 *
 * `external_id` was preferred, but for a Linear-sourced ticket that field holds
 * Linear's own UUID — 36 characters of it — so the card showed a full uuid wrapped
 * over two lines and squeezed the "1 q" badge into a vertical stack of single
 * characters. The human reference ("MET-597") is already in the title, so this
 * prefers a real ticket key where one exists and otherwise shows eight characters
 * of the internal id, which is enough to match against a log line.
 */
function taskRef(t) {
  const key = /\[([A-Z]{2,6}-\d+)\]/.exec(t.title || "");
  if (key) return key[1];
  const ext = String(t.external_id || "");
  // A uuid is not a reference anybody reads; anything shorter probably is one.
  const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(ext);
  if (ext && !isUuid && ext.length <= 16) return ext;
  return String(t.id || "").slice(0, 8);
}

/** The human title without repeating the ticket key already printed beside it. */
function taskTitle(t) {
  return String(t?.title || "").replace(/^\[[A-Z]{2,6}-\d+\]\s*/, "");
}

function planMap(plan, progress, triage, agentProgress) {
  const stepById = Object.fromEntries(plan.steps.map(s => [s.step, s]));
  const states = stepStates(plan, progress, agentProgress);
  const rounds = (plan.parallel_groups && plan.parallel_groups.length)
    ? plan.parallel_groups : plan.steps.map(s => [s.step]);

  // What the plan was actually built on. A question set aside is not a decision the
  // plan cites, and an escalation recorded as a pseudo-question is not a question at
  // all — MET-640's map opened on "D-01 Planning failed: planner finished with a GSD
  // project but…" drawn as an open decision, which is a failure notice wearing a
  // decision's clothes.
  const decisions = (triage?.questions || []).filter(q =>
    !q.deferred && !String(q.id || "").startsWith("agent_escalation"));
  const anyNoGsd = Object.values(progress?.steps || {}).some(st => st.gsd_ran === false);
  const open = decisions.filter(q => !q.answer);
  const cols = [decisions.length ? decisions : null, ...rounds].filter(Boolean);

  const colX = i => PAD + i * (BOX_W + GAP_X);
  // Every column is laid out at (height + GAP_Y) per node, so the canvas must be
  // measured the same way — reserving less clipped the decisions column top and bottom
  // as soon as answered questions accumulated.
  const tallest = Math.max(
    decisions.length * (DEC_H + DEC_GAP),
    ...rounds.map(g => g.length * (BOX_H + GAP_Y)));
  const height = PAD * 2 + 26 + tallest;
  const width = PAD * 2 + cols.length * BOX_W + (cols.length - 1) * GAP_X;

  const centre = (n, count, h, gap = GAP_Y) =>
    PAD + 26 + (tallest - count * (h + gap)) / 2 + n * (h + gap);
  const pos = {};
  const parts = [];
  const hasDec = decisions.length > 0;

  // Decisions column
  if (hasDec) {
    const x = colX(0);
    parts.push(`<text class="clab" x="${x}" y="${PAD + 12}">DECISIONS</text>`);
    decisions.forEach((q, i) => {
      const y = centre(i, decisions.length, DEC_H, DEC_GAP);
      pos[`d${i}`] = { x, y, w: BOX_W, h: DEC_H };
      const set = !!q.answer;
      const label = set ? (q.answer || "") : q.question;
      parts.push(`
        <g class="dec ${set ? "set" : "open"}">
          <rect x="${x}" y="${y}" width="${BOX_W}" height="${DEC_H}" rx="9"/>
          <text class="dt" x="${x + 11}" y="${y + 19}">D-${String(i + 1).padStart(2, "0")}</text>
          <text class="ds" x="${x + 44}" y="${y + 19}">${esc(clip(label, 22))}</text>
        </g>`);
    });
  }

  // Rounds
  rounds.forEach((group, gi) => {
    const ci = gi + (hasDec ? 1 : 0);
    const x = colX(ci);
    const waiting = group.some(n => !(stepById[n] || {}).step ? false : false);
    parts.push(`<text class="wv ${waiting ? "wait" : ""}" x="${x}" y="${PAD + 12}">ROUND ${gi + 1}${group.length > 1 ? ` · ${group.length}×` : ""}</text>`);
    group.forEach((n, i) => {
      const s = stepById[n];
      if (!s) return;
      const st = (progress?.steps || {})[String(n)] || {};
      const y = centre(i, group.length, BOX_H);
      pos[`s${n}`] = { x, y, w: BOX_W, h: BOX_H };
      const state = states[n] || "";
      // Provisional while decisions are still open — the plan may yet change.
      const ghost = open.length > 0 && !state ? "ghost" : "";
      const sel = String(selectedStep) === String(n) ? "sel" : "";
      // The runtime that ran it. Deliberately NOT the step category ("deep",
      // "quick", "review"): that is a routing hint for picking a profile, not
      // something a reader acts on, and it read as a label about the work itself.
      const model = st.agent_profile || "";
      const check = (s.verify_command || "").trim();
      // A step that produced no GSD artifacts was not spec-driven, whatever else it
      // achieved — the plan carrying the context is the whole premise.
      const noGsd = st.gsd_ran === false;
      parts.push(`
        <g class="stepg ${state} ${ghost} ${sel}" tabindex="0" role="button" data-step="${s.step}">
          <title>${esc(s.title)}${check ? `\n\n✓ ${esc(check)}` : ""}${noGsd ? `\n\n⚠ ${esc(st.gsd_reason || "no GSD artifacts — the work was not spec-driven")}` : ""}</title>
          <rect class="sbox" x="${x}" y="${y}" width="${BOX_W}" height="${BOX_H}" rx="10"/>
