<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket · Mission Control</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231A1F29'/%3E%3Cpath d='M8 20h16M8 20l4-8 4 5 3-4 5 7' stroke='%232563EB' stroke-width='1.8' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
  /* The dashboard's tokens, verbatim. Colour carries one meaning here: amber means
     a human is the blocker and nothing else may use it, green is live/settled,
     cyan is the current actionable thing, red is dead/denied. */
  :root {
    --bg-main:   #0a0a0f;
    --bg-card:   #12121a;
    --bg-drawer: #161622;
    --line:      #1a1a2e;
    --line-soft: rgba(255,255,255,.05);
    --ink:       #e0e0e0;
    --ink-2:     rgba(224,224,224,.86);
    --ink-3:     rgba(224,224,224,.44);
    --ink-4:     rgba(224,224,224,.34);
    --accent:    #00d4ff;
    --accent-bg: rgba(0,212,255,.06);
    --accent-line: rgba(0,212,255,.16);
    --amber:     #f59e0b;
    --amber-bg:  rgba(245,158,11,.05);
    --amber-line:rgba(245,158,11,.28);
    --green:     #00ff88;
    --green-bg:  rgba(0,255,136,.13);
    --cyan:      #00d4ff;
    --cyan-bg:   rgba(0,212,255,.08);
    --red:       #ef4444;
    --red-bg:    rgba(239,68,68,.1);
    --indigo:    #818cf8;
    --card:      #12121a;
    --sunk:      rgba(255,255,255,.035);
    --ground:    #0a0a0f;
    --shadow:    none;
    --ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg-main); color: var(--ink);
    font-family: var(--ui); font-size: 13.5px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  h1, h2 { margin: 0; font-weight: 600; }

  /* ─────────── the shell (design 2b) ─────────── */
  /* Three columns, full height, one scroller: the ticket rail on the left, the
     conversation in the middle, the record on the right. Laid out as a grid rather
     than nested boxes so the two rails run the full height beside a header that
     belongs only to the middle column — and so every part stays a flat sibling
     that renders on its own. */
  #root { height: 100dvh; }
  .shell {
    display: grid; height: 100dvh;
    grid-template-columns: 206px minmax(0, 1fr) 296px;
    grid-template-rows: 46px auto minmax(0, 1fr);
  }
  .topnav    { grid-column: 1 / 4; grid-row: 1; border-bottom: 1px solid var(--line-soft); }
  .rail      { grid-column: 1; grid-row: 2 / 4; border-right: 1px solid var(--line-soft); min-height: 0; }
  .ticket    { grid-column: 2; grid-row: 2; min-width: 0; }
  .convo     { grid-column: 2; grid-row: 3; min-width: 0; min-height: 0; }
  .decisions { grid-column: 3; grid-row: 2 / 4; border-left: 1px solid var(--line-soft); min-height: 0; }
  /* Below the rails' width the page stops being an app shell and becomes a
     document: one column, ordinary scroll, nothing overlapping. */
  @media (max-width: 1080px) {
    #root, .shell { height: auto; display: block; }
    .rail, .decisions { border: none; }
    .rail { display: none; }
  }

  /* ─────────── the top nav ─────────── */
  /* Where in the product you are, and what is happening elsewhere in it. The
     wordmark lives here rather than in the ticket rail: it names the app, and the
     rail names one list inside it. */
  .topnav { display: flex; align-items: center; gap: 24px; padding: 0 22px; min-width: 0; }
  .topnav .wordmark {
    font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .16em;
    color: var(--ink); text-decoration: none; flex: none;
  }
  .tabs { display: flex; gap: 2px; min-width: 0; overflow: hidden; }
  .tab {
    display: flex; gap: 5px; padding: 6px 11px; border-radius: 5px; font-size: 10.5px;
    color: rgba(224,224,224,.55); text-decoration: none; white-space: nowrap;
  }
  .tab:hover { color: var(--ink-2); background: rgba(255,255,255,.03); }
  .tab.on { background: rgba(0,212,255,.1); color: var(--cyan); }
  .tab.on .c { color: rgba(0,212,255,.7); }
  .tab .c { font-family: var(--mono); }
  .tab .c.need { color: var(--amber); }
  .tab .c.run  { color: var(--green); }
  .tab .c.rev  { color: var(--indigo); }
  .navright {
    margin-left: auto; display: flex; align-items: center; gap: 16px; flex: none;
    font-family: var(--mono); font-size: 10px; color: var(--ink-4);
  }
  .navright .live { display: flex; align-items: center; gap: 7px; }
  .navright .live i { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: mcpulse 1.9s ease-in-out infinite; }
  .navright .need { color: var(--amber); }
  .navright kbd {
    font-family: var(--mono); font-size: 10px; padding: 5px 10px;
    border: 1px solid rgba(255,255,255,.12); border-radius: 5px; color: rgba(224,224,224,.55);
  }
  /* The breadcrumb the design puts before the ticket id — the rail is one list
     among several now, so the header says which. */
  .tk-crumb { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); text-decoration: none; flex: none; }
  .tk-crumb:hover { color: var(--ink-2); }

  /* ─────────── the ticket rail ─────────── */
  /* Cross-ticket navigation. It is on the ticket page because the question you are
     answering here is regularly "what else is waiting on me" — and the answer
     should not cost a trip back to the board. */
  .rail { display: flex; flex-direction: column; padding: 18px 0; overflow-y: auto; }
  .rgroup {
    padding: 14px 18px 12px; font-family: var(--mono); font-size: 9.5px;
    letter-spacing: .14em; color: rgba(255,255,255,.3);
  }
  .rgroup:first-of-type { padding-top: 0; }
  .rlist { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
  .rt { display: block; padding: 10px 11px; border-radius: 6px; text-decoration: none; color: inherit;
        border-left: 2px solid transparent; }
  .rt:hover { background: rgba(255,255,255,.03); }
  .rt.on { background: rgba(255,255,255,.055); border-left-color: var(--cyan); }
  .rt.on.build { border-left-color: var(--green); }
  .rt-top { display: flex; gap: 8px; font-family: var(--mono); font-size: 9.5px; color: rgba(224,224,224,.38); margin-bottom: 5px; }
  .rt.on .rt-top { color: rgba(224,224,224,.42); }
  .rt-badge { margin-left: auto; }
  .rt-badge.q { color: var(--amber); }
  .rt-badge.now { color: var(--cyan); }
  .rt-badge.ok { color: var(--green); }
  .rt-title { font-size: 11.5px; line-height: 1.4; color: rgba(224,224,224,.68);
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rt.on .rt-title { color: #f4f4f6; }
  /* The active ticket carries its own state, because that is the one you are in. */
  .rt-live { margin-top: 9px; padding-top: 9px; border-top: 1px solid rgba(255,255,255,.07);
             display: flex; flex-direction: column; gap: 6px; font-family: var(--mono); font-size: 9.5px; color: rgba(224,224,224,.5); }
  .rt-live .who { display: flex; align-items: center; gap: 7px; }
  .rt-live .who i { width: 4px; height: 4px; border-radius: 50%; background: var(--green); animation: mcpulse 2s ease-in-out infinite; flex: none; }
  .rt-live .who .dim { color: rgba(224,224,224,.3); }
  .rt-seg { display: flex; align-items: center; gap: 7px; }
  .rt-seg .bars { display: flex; gap: 3px; }
  .rt-seg .bars i { width: 9px; height: 2px; border-radius: 1px; background: rgba(255,255,255,.12); }
  .rt-seg .bars i.done { background: var(--green); }
  .rt-seg .bars i.now  { background: var(--cyan); }
  .rt-seg .n { margin-left: auto; color: rgba(224,224,224,.4); font-variant-numeric: tabular-nums; }
  .rail .foot { display: block; text-decoration: none; margin-top: auto; padding: 18px 18px 0; font-family: var(--mono); font-size: 10px; color: rgba(224,224,224,.3); }

  /* ─────────── the ticket header ─────────── */
  .thead { display: flex; align-items: center; gap: 12px; padding: 16px 26px; border-bottom: 1px solid var(--line-soft); }
  .tk-id { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); text-decoration: none; flex: none; }
  .tk-id:hover { color: var(--accent); }
  h1.tk-title { font-size: 13.5px; font-weight: 600; color: #f4f4f6; line-height: 1.3;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tk-live { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10px; color: var(--ink-3); flex: none; }
  .tk-live i { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: mcpulse 2s ease-in-out infinite; }
  .tk-count { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); flex: none; font-variant-numeric: tabular-nums; }
  /* Green once nothing is blocking: the count stops being a tally of what you owe
     and becomes the fact that you owe nothing. */
  .tk-count.set { color: var(--green); }
  /* A status that is not a leg — parked, or waiting to dispatch. Named plainly,
     because the track cannot point at it. */
  .tk-off {
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--amber); border: 1px solid var(--amber-line); border-radius: 5px; padding: 3px 8px; flex: none;
  }

  .tband { padding: 16px 26px 20px; border-bottom: 1px solid var(--line-soft); }
  /* One line, and it stays one line however long the brief is. The band is the top
     of every screen this ticket has; a Linear description is not, and four lines of
     it above the conversation was the loudest thing on a page that exists for the
     conversation. It opens on ▾ rather than scrolling in place. */
  .tk-brief { display: flex; align-items: baseline; gap: 12px; max-width: 660px; margin-bottom: 11px; }
  .tk-brief .lead {
    font-size: 12.5px; line-height: 1.6; color: rgba(224,224,224,.6);
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tk-brief .more {
    flex: none; font-family: var(--mono); font-size: 10px; background: none; border: none;
    padding: 0; color: rgba(224,224,224,.55); cursor: pointer;
  }
  .tk-brief .more:hover { color: var(--ink-2); }
  .tk-brief .files { flex: none; font-family: var(--mono); font-size: 10px; color: rgba(224,224,224,.3); }
  .tk-brief .ext { flex: none; font-family: var(--mono); font-size: 10px; color: var(--cyan); text-decoration: none; }
  .tk-desc.rest {
    font-size: 12.5px; line-height: 1.65; color: rgba(224,224,224,.62); max-width: 74ch;
    white-space: pre-wrap; margin: -4px 0 12px; max-height: 26vh; overflow-y: auto;
  }
  .tk-meta { display: flex; gap: 18px; font-family: var(--mono); font-size: 10px; color: var(--ink-4);
             margin-bottom: 16px; flex-wrap: wrap; }
  .tk-meta b { color: rgba(224,224,224,.75); font-weight: 400; }
  .tk-meta .last { margin-left: auto; }

  /* ─────────── progress track ─────────── */
  /* A hairline with a ring on the current leg. The floating "now" pill it replaces
     said the same thing as the cyan label directly under the ring. */
  .tk-bar { position: relative; height: 3px; border-radius: 2px; background: rgba(255,255,255,.08); }
  .tk-fill { position: absolute; left: 0; top: 0; height: 3px; border-radius: 2px; background: var(--cyan);
             transition: width .45s cubic-bezier(.4,0,.2,1); }
  .tk-bar.finished .tk-fill { background: var(--green); }
  .tk-dots { position: absolute; top: 50%; left: 0; right: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
  .tk-dots i { justify-self: center; width: 4px; height: 4px; border-radius: 50%;
               background: rgba(255,255,255,.14); transform: translateY(-50%); }
  .tk-dots i.done { background: rgba(255,255,255,.5); }
  .tk-dots i.now {
    width: 9px; height: 9px; background: var(--ground); border: 2px solid var(--cyan);
  }
  .tk-bar.finished + .tk-labels .now .n, .tk-bar.finished .tk-dots i.now { border-color: var(--green); }
  .tk-labels { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; margin-top: 12px; text-align: center; }
  .tk-labels span { display: flex; flex-direction: column; gap: 3px; }
  .tk-labels .n { font-size: 10.5px; color: rgba(224,224,224,.28); }
  .tk-labels .done .n { color: rgba(224,224,224,.55); }
  .tk-labels .now .n { color: var(--cyan); }
  .tk-labels .t { font-family: var(--mono); font-size: 9.5px; color: rgba(224,224,224,.3); }
  .tk-labels .now .t { color: rgba(0,212,255,.7); }

  /* ─────────── cards ─────────── */
  /* The plan map and the pre-triage findings are the middle column's other two
     views. They scroll in the same well the stream does, so the header and the
     rails never move. */
  /* Row 3, the same row .convo occupies — row 2 is the ticket header. When the nav
     was added the grid gained a row and this was left behind, so the findings and
     the plan rendered on top of the header. */
  .pane { grid-column: 2; grid-row: 3; min-width: 0; min-height: 0; overflow: auto; padding: 20px 26px 40px; }
  @media (max-width: 1080px) { .pane { overflow: visible; } }
  .card { padding: 22px 0 0; border-top: 1px solid var(--line-soft); }
  .card:first-child { border-top: none; }
  .glab {
    font-family: var(--mono); font-size: 10.5px; font-weight: 400; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-4); margin: 0 0 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .glab .gn { margin-left: auto; font-family: var(--mono); font-size: 11px; letter-spacing: 0; font-weight: 500; }

  /* ─────────── plan map (SVG) ─────────── */
  .diagram-wrap { overflow-x: auto; padding: 4px 0 10px; }
  svg.plan-map { display: block; width: 100%; height: auto; }
  svg.plan-map text { font-family: var(--ui); }
  svg.plan-map .sbox { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
  svg.plan-map g.stepg:hover .sbox { stroke: var(--accent); }
  svg.plan-map .snum { fill: var(--ink-3); font-size: 11px; font-weight: 700; font-family: var(--mono); }
  svg.plan-map .stitle { fill: var(--ink); font-size: 13px; font-weight: 600; }
  svg.plan-map .srepo { fill: var(--ink-3); font-size: 11px; font-family: var(--mono); }
  svg.plan-map .flow { stroke: var(--ink-3); stroke-width: 1.5; fill: none; }
  svg.plan-map .cbox { fill: var(--green-bg); stroke: none; }
  svg.plan-map .ctext { fill: var(--green); font-size: 11.5px; font-weight: 600; font-family: var(--mono); }
  svg.plan-map .clab { fill: var(--ink-3); font-size: 10.5px; font-weight: 600; letter-spacing: .1em; font-family: var(--mono); }
  svg.plan-map .dec rect { stroke-width: 1.5; }
  svg.plan-map .dec.open rect { fill: var(--amber-bg); stroke: var(--amber); stroke-dasharray: 4 3; }
  svg.plan-map .dec.set rect { fill: var(--green-bg); stroke: var(--green); }
  svg.plan-map .dec .dt { font-family: var(--mono); font-size: 11px; font-weight: 700; }
  svg.plan-map .dec.open .dt, svg.plan-map .dec.open .ds { fill: var(--amber); }
  svg.plan-map .dec.set .dt, svg.plan-map .dec.set .ds { fill: var(--green); }
  svg.plan-map .dec .ds { font-size: 10.5px; }
  svg.plan-map .dlink { fill: none; stroke-width: 1.5; }
  svg.plan-map .dlink.open { stroke: var(--amber); stroke-dasharray: 4 3; }
  svg.plan-map .dlink.set { stroke: var(--green); opacity: .6; }
  svg.plan-map .nogsd-edge { fill: var(--amber); }
  svg.plan-map g.stepg { cursor: pointer; }
  svg.plan-map g.stepg.sel rect.sbox { stroke: var(--accent); stroke-width: 2.5; }
  svg.plan-map .wv { font-family: var(--mono); font-size: 9.5px; font-weight: 700; fill: var(--ink-3); letter-spacing: .1em; }
  svg.plan-map .wv.wait { fill: var(--amber); }
  svg.plan-map .ghost rect { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 4; }
  svg.plan-map .ghost .stitle, svg.plan-map .ghost .srepo { opacity: .55; }
  svg.plan-map .run rect.sbox { stroke: var(--cyan); stroke-width: 2; }
  svg.plan-map .done rect.sbox { fill: var(--green-bg); stroke: var(--green); }
  svg.plan-map .blocked rect.sbox { stroke: var(--red); }
  svg.plan-map .blocked .snum { fill: var(--red); }
  .sd { background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-top: 14px; }
  .sd-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
  .sd-num { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--ink-3); }
  .sd-title { font-size: 15px; font-weight: 600; letter-spacing: -.014em; }
  .sd-close { margin-left: auto; cursor: pointer; border: none; background: none; color: var(--ink-3); font-size: 18px; line-height: 1; }
  .sd-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-bottom: 10px; }
  .sd-sec { margin-top: 12px; }
  .sd-lab { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px; }
  .sd-body { font-size: 13.5px; color: var(--ink-2); white-space: pre-wrap; }
  .sd-cmd { font-family: var(--mono); font-size: 11.5px; background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; overflow-x: auto; white-space: pre; }
  .sd-ac { font-size: 13px; color: var(--ink-2); padding-left: 16px; position: relative; margin-bottom: 5px; }
  .sd-ac::before { content: "—"; position: absolute; left: 0; color: var(--ink-3); }
  .sd-warn { background: var(--amber-bg); border: 1px solid var(--amber-line); color: var(--amber); border-radius: 8px; padding: 9px 11px; font-size: 12.5px; }
  .maplegend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); padding-bottom: 10px; }
  .maplegend span { display: flex; align-items: center; gap: 6px; }
  .maplegend i { width: 14px; height: 2px; border-radius: 1px; display: block; }
  .maplegend i.f { background: var(--ink-3); }
  .maplegend i.d { background: var(--amber); }
  .maplegend i.s { background: var(--green); opacity: .6; }


  /* ─────────── conversation (design 2b) ─────────── */
  /* The middle column: the stream scrolls, the composer is pinned under it. Two
     scrollbars on one page is how a reader loses their place, so the shell holds
     the height and only .stream moves. */
  .convo { display: flex; flex-direction: column; min-height: 0; }
  @media (max-width: 1080px) { .convo { display: block; } }

  @keyframes mcpulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .stream { flex: 1; min-height: 0; overflow-y: auto; padding: 26px 0 8px; }
  /* Bottom-aligned, the way a conversation is: a short thread sits against the
     composer rather than stranded at the top of an empty column. */
  .stream-in { max-width: 668px; margin: 0 auto; padding: 0 26px; display: flex; flex-direction: column;
               justify-content: flex-end; gap: 26px; min-height: 100%; }
  @media (max-width: 1080px) { .stream { max-height: 58vh; } }
  .cmsg { display: grid; grid-template-columns: 24px 1fr; gap: 13px; align-items: start; }
  .cav {
    width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--mono); font-size: 9.5px; background: var(--green-bg); color: var(--green);
  }
  .cav.you { background: rgba(255,255,255,.07); color: var(--ink-3); }
  .crole {
    display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--ink-4); margin-bottom: 5px;
  }
  .cbody { font-size: 13.5px; line-height: 1.7; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
  /* A 500-character question must not push the composer off the screen. It scrolls
     where it stands: nothing is hidden and the answer box stays reachable. */
  .cq { font-size: 13.5px; line-height: 1.7; color: var(--ink); white-space: pre-wrap;
        max-height: 30vh; overflow-y: auto; }
  .cfind .fb { max-height: 18vh; overflow-y: auto; }

  /* A finding is amber because a human is the blocker — the one meaning amber has. */
  .cfind {
    border-left: 2px solid var(--amber); background: rgba(245,158,11,.035);
    border-radius: 0 7px 7px 0; padding: 11px 15px; margin-top: 13px;
  }
  .cfind .ft { font-size: 12.5px; font-weight: 600; color: #f4f4f6; margin-bottom: 5px; }
  .cfind .fb { font-size: 12px; line-height: 1.6; color: rgba(224,224,224,.6); white-space: normal; }

  /* The id the answer will bind. Without it on the question, the receipt below
     says "Recorded as D-02" and nothing on screen ever said which one D-02 was. */
  .cbecomes {
    display: inline-block; margin-top: 8px; font-family: var(--mono); font-size: 10px;
    letter-spacing: .06em; color: var(--ink-3); border: 1px solid rgba(255,255,255,.14);
    border-radius: 5px; padding: 2px 7px;
  }

  .crec { margin-top: 12px; font-size: 12px; color: var(--ink-3); }
  .crec b { color: var(--cyan); font-weight: 500; }

  .cpills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
  .cpill {
    font-family: inherit; font-size: 12.5px; padding: 9px 14px; border-radius: 16px;
    border: 1px solid rgba(255,255,255,.12); background: transparent;
    color: rgba(224,224,224,.72); cursor: pointer;
  }
  .cpill:hover { border-color: rgba(255,255,255,.28); color: var(--ink); }
  .cpill.rec { border-color: rgba(0,212,255,.3); color: var(--cyan); }
  .cpill.esc { color: var(--ink-3); }

  /* Your turn reads as yours: right-aligned, one corner squared off. */
  .cmsg.me { grid-template-columns: 1fr; }
  .cmsg.me .cbody {
    justify-self: end; max-width: 440px; background: rgba(255,255,255,.07);
    border-radius: 14px 14px 3px 14px; padding: 13px 16px; line-height: 1.65; color: #f0f0f4;
  }

  /* A decision is a receipt, not somebody speaking — so it carries no avatar and
     sits directly above whatever the agent said next. */
  .cdec { display: flex; flex-direction: column; gap: 4px; }
  .creceipt {
    display: flex; align-items: center; gap: 9px; font-family: var(--mono);
    font-size: 10.5px; color: var(--ink-3);
  }
  .creceipt .ok { color: var(--green); }
  .creceipt b { color: rgba(224,224,224,.75); font-weight: 400; }
  .cdec .cbody { font-size: 12.5px; }
  .creason { font-size: 12px; line-height: 1.6; color: rgba(224,224,224,.6); border-left: 2px solid rgba(255,255,255,.12); padding-left: 13px; }

  /* The thread's system half. An event is not somebody speaking, so it is a line
     rather than a message — no avatar, no bubble. Trouble is amber, which on this
     page means a human is the blocker, and that is what a failure makes you. */
  /* The run's own account of itself, in the rail. Newest first — the question it
     answers is "what is it doing now". */
  /* No fixed cap: the rail is already a column with its own scroll, and a second
     scroller inside it meant the newest entry could be hidden behind two of them.
     It takes what is left and shrinks when the sections above need room. */
  .dacts { display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto; }
  .cevent {
    display: flex; gap: 8px; align-items: baseline; font-family: var(--mono);
    font-size: 10px; line-height: 1.5; color: var(--ink-4);
  }
  .cevent .mk { flex: none; color: rgba(224,224,224,.28); }
  .cevent .ts { flex: none; color: rgba(224,224,224,.3); font-variant-numeric: tabular-nums; }
  .cevent.bad .ts { color: rgba(245,158,11,.75); }
  .cevent .tx { min-width: 0; overflow-wrap: anywhere; }
  /* How many times the same thing happened. Reads as a count, not as part of the
     sentence. */
  .cevent .xn {
    margin-left: 6px; padding: 1px 5px; border-radius: 4px;
    background: rgba(255,255,255,.07); color: rgba(224,224,224,.5);
  }
  .cevent.bad .xn { background: rgba(245,158,11,.14); color: var(--amber); }
  .cevent.bad { color: var(--amber); }
  .cevent.bad .mk { color: var(--amber); }
  /* Fifty repetitions of "heartbeat: running" is not a conversation, but silence
     is not honest either — the run becomes one line saying how many there were. */
  .cnoise {
    font-family: var(--mono); font-size: 10px; color: rgba(224,224,224,.22);
    padding-left: 18px;
  }
  /* Waiting on a reply. Three dots rather than a spinner: a spinner implies
     something is actively computing, and between polls nothing is. */
  .cthink { display: flex; align-items: center; gap: 5px; height: 24px; }
  .cthink i {
    width: 5px; height: 5px; border-radius: 50%; background: rgba(224,224,224,.35);
    animation: mcthink 1.3s ease-in-out infinite;
  }
  .cthink i:nth-child(2) { animation-delay: .18s; }
  .cthink i:nth-child(3) { animation-delay: .36s; }
  @keyframes mcthink {
    0%, 60%, 100% { opacity: .25; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-2px); }
  }
  .cwait {
    display: flex; align-items: center; gap: 9px; border: 1px solid rgba(255,255,255,.09);
    border-radius: 7px; padding: 9px 12px; font-family: var(--mono); font-size: 10.5px;
    color: var(--ink-3); margin-top: 13px;
  }
  .cwait i { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); animation: mcpulse 1.4s ease-in-out infinite; }
  .cwait .el { margin-left: auto; color: var(--green); }

  /* ─── the thread after triage settles (design 2c) ─── */
  /* The same thread keeps going: no new screen and no "submit". A rule marks the
     moment the questions stopped, so what came after is legible as consequence. */
  .cmark { display: flex; align-items: center; gap: 12px; }
  .cmark .ln { flex: 1; height: 1px; background: rgba(255,255,255,.07); }
  .cmark span:not(.ln) { font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; color: rgba(224,224,224,.35); }

  /* The plan, in the stream rather than on a page of its own. It arrives as a
     message because that is when it arrives, and the decisions it was built from
     are three lines above it. */
  .pcard { margin-top: 13px; border: 1px solid rgba(255,255,255,.1); border-radius: 9px; padding: 15px 17px; }
  .ph { display: flex; align-items: center; gap: 10px; margin-bottom: 13px; }
  .ph .pf { font-family: var(--mono); font-size: 11px; color: var(--cyan); }
  .ph .pc { font-family: var(--mono); font-size: 10px; color: rgba(224,224,224,.35); }
  .ph .popen {
    margin-left: auto; font-family: var(--mono); font-size: 10px; background: none;
    border: none; padding: 0; color: rgba(224,224,224,.5); cursor: pointer;
  }
  .ph .popen:hover { color: var(--ink-2); }
  .psteps { display: flex; flex-direction: column; gap: 9px; font-size: 11px; }
  .prow { display: flex; gap: 11px; align-items: baseline; }
  .prow .pm { flex: none; color: rgba(224,224,224,.28); }
  .prow .pt { color: rgba(224,224,224,.4); }
  .prow .pn { margin-left: auto; font-family: var(--mono); font-size: 10px; color: rgba(224,224,224,.25); }
  .prow.done .pm { color: var(--green); }
  .prow.done .pt { color: rgba(224,224,224,.55); }
  .prow.done .pn { color: rgba(224,224,224,.3); }
  .prow.run .pm { color: var(--cyan); }
  .prow.run .pt { color: #f4f4f6; }
  .prow.run .pn { color: rgba(224,224,224,.3); }
  .prow.blocked .pm, .prow.blocked .pn { color: var(--red); }
  .prow.blocked .pt { color: rgba(224,224,224,.55); }

  /* A settled question is the record, not the conversation. One line, openable. */
  .csettled { border-left: 2px solid var(--green); padding-left: 11px; }
  .csettled > summary {
    list-style: none; cursor: pointer; display: grid;
    grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: baseline;
  }
  .csettled > summary::-webkit-details-marker { display: none; }
  .csettled > summary:hover .cs-q { color: var(--ink); }
  .cs-tag { font-family: var(--mono); font-size: 10px; color: var(--green); }
  .cs-q { font-size: 11.5px; line-height: 1.5; color: rgba(224,224,224,.6);
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The outcome on a collapsed line is an identifier, not the answer in full — that
     is inside. Uncapped it ran off the column and got sliced mid-word by the edge. */
  .cs-a { font-family: var(--mono); font-size: 10px; color: var(--green);
          white-space: nowrap; max-width: 26ch; overflow: hidden; text-overflow: ellipsis; }
  .cs-n { grid-column: 2; font-family: var(--mono); font-size: 9.5px; color: var(--ink-4); }
  .csettled[open] > summary { margin-bottom: 16px; }
  .csettled[open] > summary .cs-q { white-space: normal; }
  .cs-body { display: flex; flex-direction: column; gap: 20px; }

  /* ─── composer ─── */
  /* The exits are pills beside the box rather than a sentence under it: "decide for
     me" and "ask me later" are answers to the question above, and they belong where
     the other answers are. */
  .composer { padding: 0 0 20px; flex: none; }
  /* Named `cin`, not `composer-in`: the test that there is exactly one composer
     counts `class="composer` prefixes, and a child sharing that prefix is a second
     one as far as a string match is concerned. */
  .cin { max-width: 668px; margin: 0 auto; padding: 0 26px; }
  .cactive { font-family: var(--mono); font-size: 10px; letter-spacing: .05em; color: var(--ink-4); margin-bottom: 11px; }
  .cactive b { color: var(--cyan); font-weight: 400; }
  /* Why the gate is being shown. A verdict you cannot see is one you cannot
     disagree with, which is the failure mode this whole gate replaces. */
  .cwhy { font-family: var(--mono); font-size: 10px; line-height: 1.6; color: var(--ink-4); margin-bottom: 11px; }
  .cwhy b { color: var(--ink-3); font-weight: 400; text-transform: uppercase; letter-spacing: .06em; }
  .cexits { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 11px; }
  .cexits .cpill { font-size: 12px; padding: 8px 13px; }
  .crow {
    display: flex; align-items: center; gap: 12px;
    border: 1px solid rgba(255,255,255,.13); border-radius: 12px; padding: 8px 10px 8px 16px;
  }
  .crow:focus-within { border-color: rgba(0,212,255,.4); }
  .crow input {
    flex: 1; min-width: 0; font-family: inherit; font-size: 13px; color: var(--ink);
    background: transparent; border: none; padding: 6px 0;
  }
  .crow input::placeholder { color: rgba(224,224,224,.32); }
  .crow input:focus { outline: none; }
  .csend {
    width: 26px; height: 26px; border-radius: 8px; border: none; background: rgba(0,212,255,.9);
    color: #031a20; font-size: 12px; cursor: pointer; flex: none; display: grid; place-items: center;
  }
  .csend:hover { filter: brightness(1.12); }
  /* Typed text is a message by default. Binding it as the decision is the deliberate
     press, so it reads as a command beside the box rather than a second submit. */
  .cbtn {
    font-family: var(--mono); font-size: 10px; letter-spacing: .05em; padding: 5px 8px;
    border-radius: 6px; border: 1px solid transparent; background: none; color: var(--ink-4); cursor: pointer; flex: none;
  }
  .cbtn:hover { color: var(--cyan); border-color: rgba(0,212,255,.3); }
  .cfoot { margin-top: 10px; font-family: var(--mono); font-size: 10px; color: rgba(224,224,224,.28); }

  /* ─── decision rail ─── */
  .decisions { padding: 22px 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
  .dsec > h2, .drail-h {
    display: flex; align-items: baseline; gap: 8px; font-family: var(--mono); font-size: 9.5px;
    font-weight: 400; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(255,255,255,.38); margin: 0 0 13px;
  }
  .drail-h .gn { margin-left: auto; letter-spacing: 0; color: var(--ink-3); font-size: 10px; }
  .dsec + .dsec { border-top: 1px solid var(--line-soft); padding-top: 18px; }
  /* Activity is the one section that grows without bound, so it is the one that
     gets the leftover height. */
  .dsec.grow { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .drow2 {
    display: block; width: 100%; text-align: left; font-family: inherit; cursor: pointer;
    background: none; border: none; border-left: 2px solid rgba(255,255,255,.12);
    padding: 0 0 0 11px; margin-bottom: 12px; color: inherit;
  }
  .drow2:last-of-type { margin-bottom: 0; }
  .drow2.set { border-left-color: var(--green); }
  .drow2.on  { border-left-color: var(--cyan); }
  .drow2.agent { border-left-color: var(--amber); }
  .drow2 .dtag {
    display: flex; gap: 7px; font-family: var(--mono); font-size: 10px;
    color: rgba(224,224,224,.4); margin-bottom: 4px;
  }
  .drow2 .dtag b { font-weight: 400; color: rgba(224,224,224,.4); }
  .drow2.set .dtag b { color: var(--green); }
  .drow2.on .dtag b { color: var(--cyan); }
  .drow2.agent .dtag b { color: var(--amber); }
  .drow2 .dq2 { font-size: 11.5px; line-height: 1.45; color: rgba(224,224,224,.6); display: -webkit-box;
                -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .drow2.set .dq2 { color: rgba(224,224,224,.78); }
  .drow2.on .dq2 { color: rgba(224,224,224,.6); }
  .drow2:not(.set):not(.on):not(.agent) .dq2 { color: rgba(224,224,224,.45); }
  /* Recalled knowledge: what this project already learned that bears on the ticket.
     Only rendered when the store actually returns something. */
  .dmem { font-size: 11px; line-height: 1.55; color: rgba(224,224,224,.55); }
  .dmem .src { margin-top: 8px; font-family: var(--mono); font-size: 9.5px; color: rgba(224,224,224,.3); }
  .drail-h .gn.set { color: var(--green); }
  .dnote { margin-top: 13px; font-size: 11px; line-height: 1.55; color: rgba(224,224,224,.4); }
  .dlist2 { display: flex; flex-direction: column; gap: 9px; }
  .drow3 { display: flex; gap: 8px; align-items: baseline; font-size: 10.5px; color: rgba(224,224,224,.6); text-decoration: none; }
  a.drow3:hover .nm { color: var(--ink); }
  .drow3 .ic { color: var(--cyan); flex: none; }
  .drow3 .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drow3 .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.2); flex: none; align-self: center; }
  .drow3 .dot.live { background: var(--green); animation: mcpulse 2.3s ease-in-out infinite; }
  .pmap { border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; }
  .dsum { margin-top: auto; padding-top: 18px; font-size: 10px; line-height: 1.6; color: rgba(224,224,224,.3); }
  .dsum b { color: var(--amber); font-weight: 400; }
  .dsum code { font-family: var(--mono); }

  /* ─────────── what triage found, before it has asked anything ─────────── */
  .fitem { padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
  .fitem:last-child { border-bottom: none; padding-bottom: 0; }
  .fitem:first-child { padding-top: 0; }
  .fk { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--amber); background: var(--amber-bg); border-radius: 4px; padding: 1px 6px; display: inline-block; margin-bottom: 5px; }
  .ftx { font-size: 13px; color: var(--ink-2); }
  .empty { color: var(--ink-3); font-size: 13px; }
  .err { background: var(--amber-bg); border: 1px solid var(--amber-line); color: var(--amber); padding: 12px 16px; border-radius: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="root"><p class="empty" style="padding:26px">Loading…</p></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Which ticket the page is showing. Not a constant: the rail switches between
// tickets in place, so a full document load — refetching the page, the rail and
// every ticket in it just to change one column — is work nobody asked for.
let taskId = new URLSearchParams(location.search).get("id") || "";
let selectedStep = null;
/** The agent's mark in the stream. One identity, not one per internal stage. */
const AVATAR = "mc";

const LEGS = [
  { label: "Intake",  statuses: ["inbox"] },
  { label: "Triage",  statuses: ["planning"] },
  { label: "Plan",    statuses: ["assigned"] },
  { label: "Build",   statuses: ["in_progress"] },
  { label: "Review",  statuses: ["review", "in_review", "testing"] },
  { label: "Done",    statuses: ["done", "completed", "merged"] },
];

async function getJson(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`${path} → ${res.status}`);
  return res.json();
}

function parseTriage(task) {
  const raw = task.triage_state;
  if (!raw) return null;
  try { return typeof raw === "string" ? JSON.parse(raw) : raw; } catch { return null; }
}

const pick = (re, s) => (re.exec(s || "") || [])[1] || "";

/** Activity types that mark a leg being reached, newest write wins. */
const LEG_MARKERS = {
  triage: [/triage/i, /clarification/i, /planning_questions/i],
  plan:   [/plan_created/i, /execution plan/i],
  build:  [/step_dispatched/i, /spawned/i],
  review: [/review/i],
  done:   [/completed successfully/i, /merged/i],
};

function legTimes(task, activities) {
  const t = { intake: task.created_at };
  for (const a of activities || []) {
    const hay = `${a.activity_type || ""} ${a.message || ""}`;
    for (const [leg, pats] of Object.entries(LEG_MARKERS)) {
      if (!t[leg] && pats.some(p => p.test(hay))) t[leg] = a.created_at;
    }
  }
  return t;
}

const shortTime = iso => {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const today = new Date().toDateString() === d.toDateString();
  return today
    ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
    : d.toLocaleDateString([], { month: "short", day: "numeric" });
};

/** How long ago, in the units the design uses: "12m", "3h", "2d". */
function since(iso) {
  if (!iso) return "";
  const ms = Date.now() - new Date(iso).getTime();
  if (!isFinite(ms) || ms < 0) return "";
  const m = Math.round(ms / 60000);
  if (m < 60) return `${Math.max(1, m)}m`;
  const h = Math.round(m / 60);
  return h < 48 ? `${h}h` : `${Math.round(h / 24)}d`;
}

/**
 * The brief, as prose rather than as its source.
 *
 * A Linear description arrives with the attachment URLs inline, and MET-635's are
 * 140 characters each: rendered raw they were the loudest thing on the page, four
 * lines of signed S3 query string above the conversation the page exists for. They
 * are not nothing, though — an attachment is a thing triage was holding — so they
 * are counted rather than dropped, and the label of a markdown link survives as the
 * words somebody wrote.
 *
 * The two lines the meta row repeats verbatim (base branch, target app) come out.
 */
function brief(description) {
  const lines = (description || "").split("\n")
    .filter(l => l.trim() && !/^\s*(base[- ]?branch|target app)\s*:/i.test(l));
  const raw = lines.join("\n");
  const attachments = (raw.match(/https?:\/\/\S+/g) || []).length;
  const prose = raw
    .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")   // markdown link → the words in it
    .replace(/<https?:\/\/[^>]*>/g, "")        // an angle-bracketed bare url
    .replace(/https?:\/\/\S+/g, "")            // anything still a url
    .replace(/\(\s*\)/g, "")
    .split("\n").map(l => l.replace(/[ \t]{2,}/g, " ").trim()).filter(Boolean);
  const full = prose.join("\n");
  // The lead is one line's worth; the band clips it and ▾ opens the whole thing.
  return { lead: prose.join(" "), full, attachments };
}

/**
 * The header, per design 2b: one line of identity, then the brief and the track.
 *
 * The status pill went. It named the leg the tracker was already pointing at, in a
 * second vocabulary ("planning" against "Triage"), and two names for one state on
 * one line is how a page stops being read.
 */
function renderTicket(task, triage, activities, extra = {}) {
  // -1 when the status is not a leg at all (on_hold, pending_dispatch). Clamping
  // that to 0 claimed the ticket was in Intake — a parked ticket that had already
  // planned and built read as one nothing had happened to yet.
  const legIndex = LEGS.findIndex(l => l.statuses.includes(task.status));
  const offTrack = legIndex < 0;
  const finished = !offTrack && legIndex >= LEGS.length - 1;
  // The fill stops at the centre of the current leg's slice, where its dot is.
  const pct = offTrack ? 0 : ((legIndex + 0.5) / LEGS.length) * 100;

  const repos = [...new Set(((triage && triage.triage_repos) || []).map(r => `${r.project}/${r.repo}`))];
  const base = pick(/^\s*base[- ]?branch:\s*(\S+)\s*$/im, task.description);
  const app = pick(/^\s*target app:\s*`?([^`\s(]+)/im, task.description);

  const { lead, full, attachments } = brief(task.description);

  const times = legTimes(task, activities);
  const dots = LEGS.map((_, i) =>
    `<i class="${i < legIndex ? "done" : i === legIndex ? "now" : ""}"></i>`).join("");
  const labels = LEGS.map((l, i) => {
    const here = i === legIndex;
    // A leg the ticket has not reached carries no date. The activity patterns are
    // loose on purpose — "review" appears in plenty of messages — so a leg ahead of
    // the current one was picking up a stamp and claiming the ticket had been there.
    const stamp = here ? `now · ${since(times[l.label.toLowerCase()] || task.updated_at)}`
                       : i < legIndex ? shortTime(times[l.label.toLowerCase()]) : "";
    return `<span class="${i < legIndex ? "done" : here ? "now" : ""}">
      <span class="n">${esc(l.label)}</span>
      ${stamp ? `<span class="t">${esc(stamp)}</span>` : ""}</span>`;
  }).join("");

  const qs = (triage && triage.questions) || [];
  const settled = qs.filter(q => q.answer).length;

  return `
    <div class="ticket">
      <div class="thead">
        <a class="tk-crumb" href="/">Tickets ›</a>
        <span class="tk-id">${esc(task.external_id || task.id.slice(0, 8))}</span>
        <h1 class="tk-title">${esc(task.title)}</h1>
        ${offTrack ? `<span class="tk-off">${esc((task.status || "").replace(/_/g, " "))}</span>` : ""}
        ${extra.agent && !offTrack ? `<span class="tk-live"><i></i>${esc(extra.agent)}</span>` : ""}
        <span class="tk-count ${qs.length && settled === qs.length ? "set" : ""}">${
          qs.length ? `${settled} of ${qs.length} settled` : ""}</span>
      </div>
      <div class="tband">
        <div class="tk-brief">
          <div class="lead">${esc(lead)}</div>
          ${full ? `<button class="more" data-more="1" aria-expanded="false">▾ description</button>` : ""}
          ${attachments ? `<span class="files">${attachments} file${attachments > 1 ? "s" : ""}</span>` : ""}
          ${task.external_url
            ? `<a class="ext" href="${esc(task.external_url)}" target="_blank" rel="noopener">${esc(task.external_id || "source")} ↗</a>` : ""}
        </div>
        ${full ? `<p class="tk-desc rest" data-fulldesc hidden>${esc(full)}</p>` : ""}
        <div class="tk-meta">
          ${repos.length ? `<span>repo <b>${esc(repos.join(", "))}</b></span>` : ""}
          ${base ? `<span>base <b>${esc(base)}</b></span>` : ""}
          ${app ? `<span>app <b>${esc(app)}</b></span>` : ""}
          <span class="last">updated <b>${esc(since(task.updated_at) || "—")} ago</b></span>
        </div>
        <div class="tk-bar ${finished ? "finished" : ""}">
          <div class="tk-fill" style="width:${pct}%"></div>
          <div class="tk-dots">${dots}</div>
        </div>
        <div class="tk-labels">${labels}</div>
      </div>
    </div>`;
}

/**
 * The ticket rail — what else is waiting on you, without a trip back to the board.
 *
 * Grouped by the same legs the tracker uses, so a ticket sits under the same word
 * in both places. The badge is the count of questions blocking that ticket, because
 * that is the only reason one of these rows is your problem rather than an agent's.
 */
/**
 * Every ticket, grouped by leg. The rail is the thread list for the whole board.
 *
 * It used to build groups from LEGS alone and drop anything that matched none —
 * so `on_hold`, `testing` and `pending_dispatch` tickets simply were not there,
 * while the nav counted them. A parked ticket disappearing from the list is the
 * worst case: it is parked precisely because someone needs to come back to it.
 *
 * Done is kept, last and collapsed to a few, so the list stays a work queue rather
 * than an archive.
 */
function railGroups(tasks) {
  const groups = LEGS.map(l => ({ label: l.label, statuses: l.statuses, tasks: [] }));
  const other = { label: "Other", statuses: [], tasks: [] };
  for (const t of tasks || []) {
    const g = groups.find(x => x.statuses.includes(t.status));
    (g || other).tasks.push(t);
  }
  // Anything the legs do not name still has to show, under the status it actually
  // has rather than under a heading that would be a guess.
  const extra = [];
  for (const t of other.tasks) {
    const label = (t.status || "unknown").replace(/_/g, " ");
    let g = extra.find(x => x.label === label);
    if (!g) extra.push(g = { label, statuses: [t.status], tasks: [] });
    g.tasks.push(t);
  }
  return [...groups, ...extra].filter(g => g.tasks.length);
}

function openCount(task) {
  const st = parseTriage(task);
  return blockingQuestions(st && st.questions).length;
}

/**
 * The top nav (design 2b, revised): where you are, and what is happening elsewhere.
 *
 * Every count is derived from the ticket list the rail already needed, so the bar
 * costs no extra request. Every tab points at a page that exists — the design's
 * "Knowledge" tab has no route behind it here, and a tab that goes nowhere is worse
 * than one that is absent. The dashboard filters are hash-driven, so Inbox/Swarm/
 * Review land on the list they name rather than all on the same unfiltered board.
 */
function renderNav(tasks, current) {
  const rows = tasks || [];
  const open = rows.filter(t => !DONE.includes(t.status));
  const needsYou = rows.filter(t => openCount(t) > 0).length;
  const running = rows.filter(t => t.status === "in_progress").length;
  const inReview = rows.filter(t => ["review", "in_review", "testing"].includes(t.status)).length;

  const tab = (label, href, count, cls, on) =>
    `<a class="tab ${on ? "on" : ""}" href="${href}">${esc(label)}${
      count ? `<span class="c ${cls}">${count}</span>` : ""}</a>`;

  return `<nav class="topnav">
    <a class="wordmark" href="/">MISSION CONTROL</a>
    <div class="tabs">
      ${tab("Inbox", "/#planning", needsYou, "need", false)}
      ${tab("Tickets", "/", open.length, "", true)}
      ${tab("Swarm", "/space", running, "run", false)}
      ${tab("Review", "/#review", inReview, "rev", false)}
    </div>
    <div class="navright">
      ${running ? `<span class="live"><i></i>${running} running</span>` : ""}
      ${needsYou ? `<span class="need">${needsYou} need${needsYou === 1 ? "s" : ""} you</span>` : ""}
    </div>
  </nav>`;
}

const DONE = ["done", "completed", "merged", "cancelled"];

function renderRail(tasks, current, triage, planData = {}) {
  const qs = (triage && triage.questions) || [];
  const settled = qs.filter(q => q.answer).length;
  const groups = railGroups(tasks && tasks.length ? tasks : (current ? [current] : []));

  // Once there is a plan the segments are the steps, because that is what is
  // moving. Before it, they are the questions — the only progress triage has.
  const steps = (planData.plan && planData.plan.steps) || [];
  const stepState = n => ((planData.progress && planData.progress.steps) || {})[String(n)] || {};
  const stepsDone = steps.filter(s => stepState(s.step).status === "completed").length;
  const track = steps.length
    ? { word: "step", n: stepsDone, total: steps.length,
        cls: steps.map(s => {
          const st = stepState(s.step).status;
          return st === "completed" ? "done" : st === "in_progress" ? "now" : "";
        }) }
    : qs.length
      ? { word: "triage", n: settled, total: qs.length,
          cls: qs.map((q, i) => q.answer ? "done" : (i === settled ? "now" : "")) }
      : null;

  const rows = groups.map(g => {
    // Past triage the ticket is the agent's, not yours: green rather than cyan.
    // A parked or unknown state is neither — it is not moving, so it gets neither
    // colour rather than borrowing the one that means "an agent has this".
    const building = ["Plan", "Build", "Review", "Done"].includes(g.label);
    const list = g.tasks
      // The one you are on always shows, however long the group is.
      .sort((a, b) => (a.id === current?.id ? -1 : b.id === current?.id ? 1 : 0))
      .slice(0, 5).map(t => {
        const on = t.id === current?.id;
        const open = openCount(t);
        const badge = on
          ? `<span class="rt-badge ${building ? "ok" : "now"}">${esc(building ? g.label.toLowerCase() : "now")}</span>`
          : open ? `<span class="rt-badge q">${open} q</span>`
          : `<span class="rt-badge ok">${esc((t.status || "").replace("_", " "))}</span>`;
        const bars = on && track
          ? `<div class="rt-seg"><span class="dim">${esc(track.word)}</span>
               <span class="bars">${track.cls.map(c => `<i class="${c}"></i>`).join("")}</span>
               <span class="n">${track.n}/${track.total}</span></div>`
          : "";
        const live = on
          ? `<div class="rt-live">${bars}<div class="who"><span class="dim">updated ${esc(since(t.updated_at) || "just now")} ago</span></div></div>`
          : "";
        return `<a class="rt ${on ? (building ? "on build" : "on") : ""}" href="/ticket?id=${encodeURIComponent(t.id)}">
          <div class="rt-top">${esc(t.external_id || t.id.slice(0, 8))}${badge}</div>
          <div class="rt-title">${esc(t.title || "")}</div>${live}</a>`;
      }).join("");
    return `<div class="rgroup">${esc(g.label.toUpperCase())} · ${g.tasks.length}</div>
      <div class="rlist">${list}</div>`;
  }).join("");

  return `<div class="rail">
    ${rows || `<div class="rgroup">NO OTHER TICKETS</div>`}
    <a class="foot" href="/">← all tasks</a>
  </div>`;
}

/* ─────────── the plan, as a map ─────────── */

const BOX_W = 208, BOX_H = 74, GAP_Y = 20, GAP_X = 74, PAD = 14;
// Decisions are one line each: a locked decision needs to be identifiable, not read
// in full — the collapsed list above has the wording.
const DEC_H = 30, DEC_GAP = 8;

function planMap(plan, progress, triage) {
  const stepById = Object.fromEntries(plan.steps.map(s => [s.step, s]));
  const rounds = (plan.parallel_groups && plan.parallel_groups.length)
    ? plan.parallel_groups : plan.steps.map(s => [s.step]);

  const decisions = (triage?.questions || []);
  const anyNoGsd = Object.values(progress?.steps || {}).some(st => st.gsd_ran === false);
  const open = decisions.filter(q => !q.answer);
  const cols = [decisions.length ? decisions : null, ...rounds].filter(Boolean);

  const colX = i => PAD + i * (BOX_W + GAP_X);
  // Every column is laid out at (height + GAP_Y) per node, so the canvas must be
  // measured the same way — reserving less clipped the decisions column top and bottom
  // as soon as answered questions accumulated.
  const tallest = Math.max(
    decisions.length * (DEC_H + DEC_GAP),
    ...rounds.map(g => g.length * (BOX_H + GAP_Y)));
  const height = PAD * 2 + 26 + tallest;
  const width = PAD * 2 + cols.length * BOX_W + (cols.length - 1) * GAP_X;

  const centre = (n, count, h, gap = GAP_Y) =>
    PAD + 26 + (tallest - count * (h + gap)) / 2 + n * (h + gap);
  const pos = {};
  const parts = [];
  const hasDec = decisions.length > 0;

  // Decisions column
  if (hasDec) {
    const x = colX(0);
    parts.push(`<text class="clab" x="${x}" y="${PAD + 12}">DECISIONS</text>`);
    decisions.forEach((q, i) => {
      const y = centre(i, decisions.length, DEC_H, DEC_GAP);
      pos[`d${i}`] = { x, y, w: BOX_W, h: DEC_H };
      const set = !!q.answer;
      const label = set ? (q.answer || "") : q.question;
      parts.push(`
        <g class="dec ${set ? "set" : "open"}">
          <rect x="${x}" y="${y}" width="${BOX_W}" height="${DEC_H}" rx="9"/>
          <text class="dt" x="${x + 11}" y="${y + 19}">D-${String(i + 1).padStart(2, "0")}</text>
          <text class="ds" x="${x + 44}" y="${y + 19}">${esc(clip(label, 22))}</text>
        </g>`);
    });
  }

  // Rounds
  rounds.forEach((group, gi) => {
    const ci = gi + (hasDec ? 1 : 0);
    const x = colX(ci);
    const waiting = group.some(n => !(stepById[n] || {}).step ? false : false);
    parts.push(`<text class="wv ${waiting ? "wait" : ""}" x="${x}" y="${PAD + 12}">ROUND ${gi + 1}${group.length > 1 ? ` · ${group.length}×` : ""}</text>`);
    group.forEach((n, i) => {
      const s = stepById[n];
      if (!s) return;
      const st = (progress?.steps || {})[String(n)] || {};
      const y = centre(i, group.length, BOX_H);
      pos[`s${n}`] = { x, y, w: BOX_W, h: BOX_H };
      const state = st.status === "completed" ? "done"
        : st.status === "in_progress" ? "run"
        : (st.status === "blocked" || st.status === "failed") ? "blocked" : "";
      // Provisional while decisions are still open — the plan may yet change.
      const ghost = open.length > 0 && !state ? "ghost" : "";
      const sel = String(selectedStep) === String(n) ? "sel" : "";
      // The runtime that ran it. Deliberately NOT the step category ("deep",
      // "quick", "review"): that is a routing hint for picking a profile, not
      // something a reader acts on, and it read as a label about the work itself.
      const model = st.agent_profile || "";
      const check = (s.verify_command || "").trim();
      // A step that produced no GSD artifacts was not spec-driven, whatever else it
      // achieved — the plan carrying the context is the whole premise.
      const noGsd = st.gsd_ran === false;
      parts.push(`
        <g class="stepg ${state} ${ghost} ${sel}" tabindex="0" role="button" data-step="${s.step}">
          <title>${esc(s.title)}${check ? `\n\n✓ ${esc(check)}` : ""}${noGsd ? `\n\n⚠ ${esc(st.gsd_reason || "no GSD artifacts — the work was not spec-driven")}` : ""}</title>
          <rect class="sbox" x="${x}" y="${y}" width="${BOX_W}" height="${BOX_H}" rx="10"/>
          <text class="snum" x="${x + 12}" y="${y + 18}">STEP ${esc(String(s.step))}</text>
          ${model ? `<text class="srepo" x="${x + BOX_W - 12}" y="${y + 18}" text-anchor="end">${esc(clip(model, 14))}</text>` : ""}
          <text class="stitle" x="${x + 12}" y="${y + 38}">${esc(clip(s.title, 26))}</text>
          ${noGsd ? `<rect class="nogsd-edge" x="${x}" y="${y}" width="4" height="${BOX_H}" rx="2"/>` : ""}
          ${check ? `
            <rect class="cbox" x="${x + 12}" y="${y + 48}" width="${BOX_W - 24}" height="18" rx="5"/>
            <text class="ctext" x="${x + 18}" y="${y + 61}">✓ ${esc(clip(check.split("&&")[0].trim(), 22))}</text>` : ""}
        </g>`);
    });
  });

  // Edges: step → step from declared dependencies, decisions → the roots.
  const edges = [];
  const link = (a, b, cls) => {
    if (!a || !b) return;
    const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
    const dx = Math.max(20, (x2 - x1) / 2);
    edges.push(`<path class="${cls}" d="M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}"/>`);
  };
  for (const s of plan.steps) {
    for (const dep of s.depends_on || []) link(pos[`s${dep}`], pos[`s${s.step}`], "flow");
  }
  if (hasDec) {
    const roots = plan.steps.filter(s => !(s.depends_on || []).length);
    decisions.forEach((q, i) => {
      for (const r of roots) link(pos[`d${i}`], pos[`s${r.step}`], `dlink ${q.answer ? "set" : "open"}`);
    });
  }

  return `
    <div class="maplegend">
      <span><i class="f"></i> depends on</span>
      ${hasDec ? `<span><i class="s"></i> decision locked</span>` : ""}
      ${open.length ? `<span><i class="d"></i> decision open — work is provisional</span>` : ""}
      ${anyNoGsd ? `<span><i class="d"></i> no GSD — step ran without task decomposition</span>` : ""}
    </div>
    <div class="diagram-wrap">
      <svg class="plan-map" viewBox="0 0 ${width} ${height}" style="min-width:${width}px">
        ${edges.join("")}${parts.join("")}
      </svg>
    </div>
    <div id="stepdetail"></div>`;
}

/** Full detail for one step — the node itself is all truncation. */
function stepDetail(plan, progress, num) {
  const s = (plan.steps || []).find(x => String(x.step) === String(num));
  if (!s) return "";
  const st = (progress?.steps || {})[String(num)] || {};
  const acs = (s.acceptance_criteria || s.done_when || []);
  const deps = (s.depends_on || []);
  return `
    <div class="sd">
      <div class="sd-head">
        <span class="sd-num">STEP ${esc(String(s.step))}</span>
        <span class="sd-title">${esc(s.title)}</span>
        <button class="sd-close" id="sd-close" title="Close">×</button>
      </div>
      <div class="sd-meta">
        ${esc(st.status || "pending")}
        ${st.agent_profile ? ` · ran on ${esc(st.agent_profile)}` : ""}
        ${!st.agent_profile && (st.category || s.category) ? ` · routed as ${esc(st.category || s.category)}` : ""}
        ${st.retry_count ? ` · attempt ${st.retry_count + 1}` : ""}
        ${deps.length ? ` · needs step ${deps.join(", ")}` : " · no dependencies"}
        ${s.repo ? ` · ${esc(s.repo)}` : ""}
      </div>
      ${st.gsd_ran === false ? `<div class="sd-warn">Not spec-driven: ${esc(st.gsd_reason || "no GSD artifacts")}</div>` : ""}
      ${st.outcome ? `<div class="sd-sec"><div class="sd-lab">Outcome</div><div class="sd-body">${esc(st.outcome)}</div></div>` : ""}
      ${s.description ? `<div class="sd-sec"><div class="sd-lab">What it does</div><div class="sd-body">${esc(s.description)}</div></div>` : ""}
      ${acs.length ? `<div class="sd-sec"><div class="sd-lab">Done when</div>${acs.map(c => `<div class="sd-ac">${esc(c)}</div>`).join("")}</div>` : ""}
      ${s.verify_command ? `<div class="sd-sec"><div class="sd-lab">Checked by</div><div class="sd-cmd">${esc(s.verify_command)}</div></div>` : ""}
    </div>`;
}

const clip = (s, n) => (String(s).length > n ? String(s).slice(0, n - 1) + "…" : String(s));

function renderPlan(plan, progress, triage) {
  if (!plan || !(plan.steps || []).length) {
    return `<div class="card">
      <div class="glab">The plan</div>
      <p class="empty">No plan yet — it's written once the questions are answered.</p></div>`;
  }
  const rounds = (plan.parallel_groups && plan.parallel_groups.length) ? plan.parallel_groups.length : plan.steps.length;
  return `<div class="card">
    <div class="glab">The plan <span class="gn">${plan.steps.length} steps · ${rounds} rounds</span></div>
    ${planMap(plan, progress, triage)}
  </div>`;
}

/* ─────────── findings and questions ─────────── */

/**
 * The ticket before it has any questions.
 *
 * "Nothing yet — triage hasn't run" was the only empty state, so a ticket triage
 * had read and passed as ready looked identical to one it had never seen. Those
 * are opposite facts: the first means nobody needs to do anything, the second
 * means nothing has happened yet. Triage having no questions is also the case that
 * dispatches without a confirmation, so it is exactly the one worth naming.
 */
function renderFound(triage, activities) {
  const items = [];
  if (triage?.triage_reasoning) items.push({ kind: "Read", text: triage.triage_reasoning });
  (triage?.questions || []).filter(q => q.answer && q.answered_by === "agent")
    .forEach(q => items.push({ kind: "Worked out", text: `${q.question}\n→ ${q.answer}` }));

  // A ticket triage passes as ready persists no triage_state at all —
  // `post_planning_questions` only runs on the not-ready branch — so "did triage
  // run" cannot be read from the state. The activity log still carries the marker,
  // and it is the only trace that the ticket was assessed and waved through.
  const triagedActivity = (activities || []).some(a =>
    /triaged as ready/i.test(a.message || ""));
  const ranWithNoQuestions = triagedActivity || (!!triage && !(triage.questions || []).length);
  const empty = ranWithNoQuestions
    ? `<p class="empty">Triage read this and had no questions. Nothing has been created yet —
       confirm below to branch and start planning.</p>`
    : `<p class="empty">Nothing yet — triage hasn't run.</p>`;

  return `<div class="card">
    <div class="glab">What triage found</div>
    ${items.length ? items.map(i => `<div class="fitem"><span class="fk">${esc(i.kind)}</span><div class="ftx">${esc(i.text)}</div></div>`).join("") : empty}
  </div>`;
}

/** Questions raised by the planner, not by triage. Deferred ones no longer block. */
function followUps(qs) {
  return qs.filter(q => !q.answer && !q.deferred && (q.source === "planner" || q.round > 1));
}

/** The conversation about a question, plus the box to add to it. */
/** Questions raised by the planner, not by triage. Deferred ones no longer block. */
function followUps(qs) {
  return qs.filter(q => !q.answer && !q.deferred && (q.source === "planner" || q.round > 1));
}

/**
 * One conversation, not a page of forms.
 *
 * The question cards put a text box on every question, scattered down a list that
 * re-renders on a timer. That fought itself in every direction: typing raced the
 * poll, each render restacked listeners, and the actual conversation was buried
 * inside whichever card you had opened.
 *
 * So the agent has one surface. Everything it has asked, everything you have said
 * back, and everything that got decided runs down a single stream, with one
 * composer at the bottom. The panel beside it is the durable record — what is
 * settled, what is still blocking — because that is the thing a transcript is
 * worst at and the thing this page exists to answer.
 *
 * The split that matters: clicking decides, typing talks. An option or "decide for
 * me" settles the question immediately; anything you type is a message in the
 * conversation, not a silent answer to a form.
 */

/** Everything that has happened, in order, across every question. */
function chatTimeline(questions) {
  const events = [];
  (questions || []).forEach((q, i) => {
    const seq = String(i).padStart(4, "0");
    events.push({
      at: q.asked_at || "", seq, kind: "asked", q,
      role: q.source === "planner" ? "planner" : "triage",
    });
    (q.thread || []).forEach(m => events.push({
      at: m.at || "", seq, kind: "said", q, role: m.role, text: m.text, model: m.model || "",
    }));
    if (q.answer) {
      events.push({
        at: q.answered_at || "", seq, kind: "decided", q,
        role: q.answered_by === "agent" ? "agent" : "you",
      });
    } else if (q.deferred) {
      events.push({ at: q.deferred_at || "", seq, kind: "deferred", q, role: "you" });
    }
  });
  // Question order first, time only within a question. Sorting on the timestamp
  // first put every question at the front — they carry no asked_at, and an empty
  // string sorts before everything — so any reply you typed trailed at the very
  // bottom, detached from the question it answered and looking like it came from
  // nowhere. A conversation reads: question, what was said about it, what it
  // settled; then the next question.
  return events.sort((a, b) =>
    a.seq.localeCompare(b.seq) || (a.at || "").localeCompare(b.at || ""));
}

/**
 * One message in the stream, per design 2b.
 *
 * Agent turns get an avatar and run full width; yours is a right-aligned bubble
 * with one corner squared off, so whose turn it was is legible without reading.
 * A decision is a receipt line rather than a message, because it records something
 * settled rather than somebody speaking.
 */
function renderChatEvent(ev) {
  // One avatar for the agent, and the role spelled out beside it only where it
  // means something. The split between triage, research and planner is our
  // plumbing; from the reader's side it is all the agent, so triage — the default
  // voice on this page — says nothing, and planner and research say who they are
  // because "the plan stopped" and "this was looked up" are different claims.
  const role = { planner: "planner", triage: "triage", research: "research" }[ev.role] || "agent";
  const tag = ev.q.becomes ? esc(ev.q.becomes) : "";

  if (ev.kind === "asked") {
    // Why it is asked renders as a finding — amber, which in this design means one
    // thing only: a human is the blocker.
    const why = ev.q.why
      ? `<div class="cfind"><div class="ft">Why this is being asked</div><div class="fb">${esc(ev.q.why)}</div></div>`
      : "";
    // Suggested replies as pills. Cyan means the agent recommended that option — so
    // it is only ever worn by an option the data actually names. Highlighting the
    // first one because it is first invents a recommendation nobody made, and reads
    // as a value already selected on a question that is still wide open.
    // A settled question is the record. Offering its options again invites you to
    // answer something already decided, and the receipt below already says so.
    const settled = ev.q.answer || ev.q.deferred;
    const pills = settled ? "" : (ev.q.options || []).map(o =>
      `<button class="cpill${o === ev.q.recommended ? " rec" : ""}" data-answer="${esc(o)}" data-q="${esc(ev.q.id)}">${esc(o)}</button>`).join("");
    const escapePill = settled ? "" : `<button class="cpill esc" data-act="delegate" data-q="${esc(ev.q.id)}">You decide</button>`;
    const rec = ev.q.recommended
      ? `<div class="crec">research suggests <b>${esc(ev.q.recommended)}</b> — still your call</div>` : "";
    const owed = (ev.q.thread || []).length && ev.q.thread[ev.q.thread.length - 1].role === "you";
    const waiting = owed
      ? `<div class="cwait"><i></i>working it out<span class="el">read-only</span></div>` : "";
    return `<div class="cmsg" data-for="${esc(ev.q.id)}">
      <span class="cav">${esc(AVATAR)}</span>
      <div>${ev.role === "planner" ? `<span class="crole">${esc(role)}</span>` : ""}
      <div class="cq">${esc(ev.q.question)}</div>
      ${tag ? `<span class="cbecomes">becomes ${tag}</span>` : ""}${why}
      ${settled ? "" : `${rec}<div class="cpills">${pills}${escapePill}</div>${waiting}`}</div></div>`;
  }

  if (ev.kind === "said") {
    if (ev.role === "you") {
      return `<div class="cmsg me" data-for="${esc(ev.q.id)}"><div class="cbody">${esc(ev.text)}</div></div>`;
    }
    // Which model said it, so an answer can be weighed rather than just read.
    const by = ev.model ? ` · ${esc(ev.model)}` : "";
    return `<div class="cmsg" data-for="${esc(ev.q.id)}">
      <span class="cav">${esc(AVATAR)}</span>
      <div><span class="crole">${esc(role)}${by}</span><div class="cbody">${esc(ev.text)}</div></div></div>`;
  }

  if (ev.kind === "deferred") {
    return `<div class="cdec" data-for="${esc(ev.q.id)}">
      <div class="creceipt"><span>◦</span>${tag} set aside — not blocking planning
      <button class="cbtn" data-act="undefer" data-q="${esc(ev.q.id)}">bring it back</button></div></div>`;
  }

  // A decision is a receipt: it records something settled rather than somebody
  // speaking, so it carries no avatar and sits inline where the answer landed.
  const byAgent = ev.role === "agent";
  // Amber on this page means one thing — a human is the blocker — so the reasoning
  // behind a settled decision is not amber. It is the record explaining itself.
  const reason = ev.q.reason ? `<div class="creason">${esc(ev.q.reason)}</div>` : "";
  const undo = byAgent
    ? `<button class="cbtn" data-act="reopen" data-q="${esc(ev.q.id)}">change it</button>` : "";
  return `<div class="cdec" data-for="${esc(ev.q.id)}">
    <div class="creceipt"><span class="ok">✓</span>Recorded as <b>${tag}</b> — the plan has to cite it${undo}</div>
    <div class="cbody">${esc(ev.q.answer)}${byAgent ? " · chosen for you" : ""}</div>
    ${reason}</div>`;
}

/**
 * The moment triage stopped asking (design 2c).
 *
 * The same thread keeps going rather than handing off to a new screen, so the
 * transition needs a mark or the plan arrives looking like another answer.
 */
function renderSettledMark(questions) {
  const stamps = (questions || []).map(q => q.answered_at || q.deferred_at || "").filter(Boolean).sort();
  const at = stamps.length ? shortTime(stamps[stamps.length - 1]) : "";
  return `<div class="cmark"><span class="ln"></span>
    <span>TRIAGE SETTLED${at ? ` · ${esc(at)}` : ""}</span><span class="ln"></span></div>`;
}

/**
 * The plan, as a message in the same thread.
 *
 * It was a separate view, below the conversation and below the fold, which put the
 * decomposition on the far side of a scroll from the decisions it was built out of.
 * The design's answer is that the plan is something the agent hands you at a moment
 * in the conversation — so it arrives as one, compact, with the full map behind
 * "open ▸" for when the shape of the thing is the question.
 *
 * "from D-01 · D-02" is deliberately not "cites": what is true is that those
 * decisions were settled and passed to the planner. Whether the plan text cites
 * them is a claim about a document nobody here has read.
 */
function renderPlanCard(plan, progress, questions, open = false) {
  const steps = (plan && plan.steps) || [];
  if (!steps.length) return "";
  const waves = (plan.parallel_groups && plan.parallel_groups.length) || steps.length;
  const st = n => (progress && progress.steps && progress.steps[String(n)]) || {};
  const waveOf = n => {
    const groups = plan.parallel_groups || [];
    const i = groups.findIndex(g => g.includes(n));
    return i < 0 ? 0 : i + 1;
  };

  const done = steps.filter(s => st(s.step).status === "completed").length;
  const running = steps.find(s => st(s.step).status === "in_progress");
  const lead = running
    ? `The plan is in — ${steps.length} steps, ${waves} ${waves === 1 ? "wave" : "waves"}. Step ${running.step} is running.`
    : done === steps.length
      ? `All ${steps.length} steps are done.`
      : done
        ? `The plan is in — ${steps.length} steps, ${waves} ${waves === 1 ? "wave" : "waves"}. ${done} done, nothing running.`
        : `The plan is in — ${steps.length} steps, ${waves} ${waves === 1 ? "wave" : "waves"}. Nothing dispatched yet.`;

  const cites = (questions || []).filter(q => q.answer).map(q => q.becomes).filter(Boolean);

  const rows = steps.map(s => {
    const p = st(s.step);
    const state = p.status === "completed" ? "done"
      : p.status === "in_progress" ? "run"
      : (p.status === "blocked" || p.status === "failed") ? "blocked" : "";
    const mark = state === "done" ? "✓" : state === "run" ? "▸" : state === "blocked" ? "!" : "○";
    const note = state === "done" ? (p.agent_profile || "done")
      : state === "run" ? "running"
      : state === "blocked" ? esc(p.status)
      : waves > 1 ? `wave ${waveOf(s.step)}` : "pending";
    return `<div class="prow ${state}">
      <span class="pm">${mark}</span><span class="pt">${esc(s.title)}</span><span class="pn">${note}</span></div>`;
  }).join("");

  return `<div class="cmsg" data-plan>
    <span class="cav">${esc(AVATAR)}</span>
    <div><div class="cbody">${esc(lead)}</div>
      <div class="pcard">
        <div class="ph">
          <span class="pf">PLAN</span>
          ${cites.length ? `<span class="pc">from ${esc(cites.join(" · "))}</span>` : ""}
          <button class="popen" data-planopen aria-expanded="${open}">${open ? "close ▾" : "open ▸"}</button>
        </div>
        <div class="psteps">${rows}</div>
      </div>
    </div></div>`;
}

/**
 * Talking to the ticket, not to a question.
 *
 * Every message used to be scoped to a question, so once the last one settled the
 * box went dead — exactly when "how was this implemented" and "actually, change
 * this" start being the things you want to say. The channel for that already
 * existed: the dashboard drawer posts to `/api/tasks/:id/activities` with a type
 * chosen by ticket status, and `bridge.py:4561` collects unacknowledged
 * `manual_feedback` and feeds it into a relaunch. Nothing new was needed — the
 * ticket page simply never wired to it.
 *
 * The type mapping is the drawer's, verbatim (`app.js:1839`). Diverging would mean
 * a note typed here and a note typed there reach the agent differently.
 */
function noteType(status) {
  if (status === "planning") return "planning_answer";
  if (status === "review" || status === "testing" || status === "in_review") return "manual_feedback";
  return "updated";
}

/** What the bridge writes itself. Echoing it back as conversation is noise. */
const BRIDGE_MARKERS = [
  "Bridge needs clarification", "Bridge picked up", "Completed by bridge",
  "Bridge agent completed", "Bridge agent acknowledged", "Needs clarification before work",
  "Change request received", "Self-answered", "All questions answered",
  "Triage could not identify target repos", "posted a repo-selection follow-up",
  "Could not identify target repos even after", "Repo not found on disk",
  "Multi-repo task detected", "Decided on your behalf", "Settled without asking",
  "dispatching for", "Task triaged as ready", "Agent spawn failed", "Checkpoint",
];
const isBridgeGenerated = m => BRIDGE_MARKERS.some(x => (m || "").includes(x));

/**
 * The ticket-level exchange, from the activity log.
 *
 * Attribution has to be positive, never inferred from a missing field. The first
 * version treated "no agent_id" as "the human said this", and MC writes plenty of
 * agent-less activities — so 37 entries on MET-635, almost all identical
 * heartbeats, rendered as right-aligned messages from the user. A note the page
 * sends now says so in its metadata; nothing else is ever attributed to a person.
 *
 * `updated` cannot be used as the signal either: it is both the drawer's type for
 * a human note on an in-progress ticket and MC's catch-all for narrating itself.
 */
const HUMAN_TYPES = ["manual_feedback", "planning_answer", "linear_comment"];
const HUMAN_MARK = '"source":"human"';

/** Routine chatter. True every 60 seconds, worth reading approximately never. */
const NOISE = /^Agent heartbeat|^Lease |lease (claimed|released)|^Prompt sent|^Liveness/i;
/** The full prompt an agent was handed. Useful in a transcript, not in a column. */
const NOISE_TYPES = ["liveness", "prompt_sent", "lease_claimed", "lease_released"];
/** Things that went wrong. These are never collapsed, whatever else is.
 *  No `attempt \d` here: a heartbeat says "(attempt 1/3)" on every beat, so it
 *  matched every one of them as a failure. The real failures say so in words. */
const TROUBLE = /^(agent spawn failed|spawn failed|escalated to human|verification failed|step failed|planning failed|could not create|failed to)/i;
/** Types that mean trouble whatever the wording. */
const TROUBLE_TYPES = ["step_escalated", "step_retry", "checkpoint_raised", "needs_human"];
/** Events worth a line in the thread even though nobody said them. */
const MILESTONE_TYPES = ["step_dispatched", "step_completed", "step_escalated", "step_retry",
  "plan_created", "checkpoint_raised", "checkpoint_resolved", "spawned", "status_changed", "needs_human"];

function classifyActivity(a) {
  const msg = a.message || "";
  const meta = typeof a.metadata === "string" ? a.metadata : JSON.stringify(a.metadata || "");
  if (!msg.trim()) return null;
  if ((meta || "").includes(HUMAN_MARK)) return "human";
  if (HUMAN_TYPES.includes(a.activity_type) && !isBridgeGenerated(msg)) return "human";
  if (a.activity_type === "agent_reply") return "agent";
  // Noise is tested first: a heartbeat is routine even when its wording overlaps
  // whatever a failure would say. Nothing that repeats every 60 seconds is news.
  if (NOISE.test(msg) || NOISE_TYPES.includes(a.activity_type)) return "noise";
  if (TROUBLE_TYPES.includes(a.activity_type) || TROUBLE.test(msg.trim())) return "trouble";
  if (MILESTONE_TYPES.includes(a.activity_type)) return "event";
  return "noise";
}

function ticketNotes(activities) {
  return (activities || [])
    .map(a => ({ a, kind: classifyActivity(a) }))
    .filter(x => x.kind)
    .sort((x, y) => (x.a.created_at || "").localeCompare(y.a.created_at || ""));
}

/**
 * The thread's system half: milestones and trouble in full, routine chatter
 * collapsed to a count. Fifty repetitions of "heartbeat: running (attempt 1/3)"
 * is not a conversation, but neither is silence — the run of them becomes one
 * line saying how many there were.
 */
/**
 * The chat: only what was said. Machine events moved to the rail — a conversation
 * interleaved with "step 2 completed" every few lines is a log with speech in it,
 * and the two are read at different moments for different reasons.
 */
function renderNotes(activities) {
  const rows = ticketNotes(activities).filter(x => x.kind === "human" || x.kind === "agent");
  if (!rows.length) return "";
  const out = rows.map(({ a, kind }) => kind === "human"
    ? `<div class="cmsg me"><div class="cbody">${esc(a.message)}</div></div>`
    : `<div class="cmsg"><span class="cav">${esc(AVATAR)}</span>
        <div><span class="crole">agent</span><div class="cbody">${esc(a.message)}</div></div></div>`);
  // You said something and nothing has come back. Without this the message just
  // sits there and the page looks broken — the reply is a poll away at best, and
  // on a busy bridge a minute or more.
  if (rows[rows.length - 1].kind === "human") {
    out.push(`<div class="cmsg"><span class="cav">${esc(AVATAR)}</span>
      <div class="cthink"><i></i><i></i><i></i></div></div>`);
  }
  return out.join("");
}

/**
 * What the machine did, in the rail beneath the decisions.
 *
 * Newest first: the question this answers is "what is it doing now", and making
 * someone scroll a column to reach the answer defeats having a column. Routine
 * chatter still collapses to a count, and trouble is never collapsed.
 */
function renderActivity(activities) {
  const rows = ticketNotes(activities).filter(x => x.kind === "event" || x.kind === "trouble" || x.kind === "noise");
  if (!rows.length) return "";
  const out = [];
  let run = 0;
  // The stamp of the most recent one in the run — reading newest first, that is
  // the one that answers "when did this stop".
  let runAt = "";
  const flush = () => {
    if (!run) return;
    out.push(`<div class="cnoise">${run} routine update${run > 1 ? "s" : ""}${
      runAt ? ` · ${esc(runAt)}` : ""}</div>`);
    run = 0;
    runAt = "";
  };
  // Repetition is collapsed by identity, not by pattern. A retry loop posts the
  // same sentence over and over and it is usually *trouble*, so the noise rules
  // never touched it: thirteen identical amber blocks buried everything else in
  // the column. Saying it once with a count says strictly more.
  const seen = [];
  for (const { a, kind } of rows.slice().reverse()) {
    const last = seen[seen.length - 1];
    if (last && last.kind === kind && last.a.message === a.message) { last.n++; continue; }
    seen.push({ a, kind, n: 1 });
  }

  for (const { a, kind, n } of seen) {
    const at = shortTime(a.created_at);
    if (kind === "noise") { if (!run) runAt = at; run += n; continue; }
    flush();
    // Without a time this is a list of things that happened in no particular
    // when — and "is it stuck?" is the question the column exists to answer.
    out.push(`<div class="cevent ${kind === "trouble" ? "bad" : ""}">
      <span class="mk">${kind === "trouble" ? "!" : "·"}</span>
      <span class="ts">${esc(at)}</span>
      <span class="tx">${esc(clip(a.message, 110))}${
        n > 1 ? `<span class="xn">×${n}</span>` : ""}</span></div>`);
  }
  flush();
  return `<div class="dsec grow"><h2>Activity</h2><div class="dacts">${out.join("")}</div></div>`;
}

/** The question the composer is currently pointed at. */
function activeQuestion(questions, wantedId) {
  const open = blockingQuestions(questions);
  if (wantedId) {
    const found = (questions || []).find(q => q.id === wantedId);
    if (found) return found;
  }
  // Planner questions first: work is halted behind those.
