  }).catch(() => {});
  const q = (task.title || "").slice(0, 200);
  if (!q) return;
  getJson(`/api/knowledge/recall?query=${encodeURIComponent(q)}&limit=1`).then(res => {
    const hit = (res?.results || [])[0];
    if (hit?.text) { sideData.recalled = hit; load({ force: true }); }
  }).catch(() => {});
}

async function load({ force = false } = {}) {
  const root = $("#root");
  if (!taskId) {
    root.innerHTML = `<div class="err">No ticket id. Open as <code>/ticket?id=&lt;task-id&gt;</code>.</div>`;
    return;
  }
  // A background poll must never interrupt typing. Forced loads — after you submit
  // or use one of the exits — still go through, and carry drafts across.
  if (!force && isEditing()) return;
  const drafts = captureDrafts();
  try {
    const fetchedTask = await getJson(`/api/tasks/${encodeURIComponent(taskId)}`);
    const taskIndex = sideData.tasks.findIndex(row => row.id === fetchedTask.id);
    // The list endpoint enriches tasks with cross-ticket signals such as pending
    // checkpoints and preview state. Keep those while applying the fresher detail.
    const task = taskIndex >= 0 ? { ...sideData.tasks[taskIndex], ...fetchedTask } : fetchedTask;
    const planData = await getJson(`/api/tasks/${encodeURIComponent(taskId)}/plan`).catch(() => ({}));
    // Activity history is what dates the tracker; never let it hide the ticket.
    const activities = await getJson(`/api/tasks/${encodeURIComponent(taskId)}/activities`).catch(() => []);
    const checkpointData = await getJson(`/api/tasks/${encodeURIComponent(taskId)}/checkpoints`).catch(() => []);
    const checkpoints = Array.isArray(checkpointData) ? checkpointData : [];
    task.pending_checkpoints = checkpoints.filter(c => c.status === "pending").length;
    if (taskIndex >= 0) sideData.tasks[taskIndex] = task;
    // The task-level progress record. In single-PR mode — the default — one agent
    // works the whole plan and nothing writes per-step status, so `planData.progress`
    // stays empty and the map read "0 of 22 done" while step 01-01 was committed.
    // This is the one signal that does move: `step_label` names the plan being worked.
    const agentProgress = await getJson(`/api/tasks/${encodeURIComponent(taskId)}/progress`).catch(() => ({}));
    ticketPlanCache[task.id] = { ...planData, agentProgress };
    const triage = parseTriage(task);
    const qs = (triage?.questions || []);

    // A poll that changes nothing must not touch the DOM. Replacing #root resets
    // the stream's scroll, re-collapses every open group and moves the page under
    // whoever is reading it — fifteen seconds later, again.
    const key = JSON.stringify([task.status, task.updated_at, triage, planData.plan, planData.progress, agentProgress,
                                focusedQuestion, planOpen,
                                sideData.tasks.map(t => [t.id, t.status, t.updated_at,
                                  t.pending_checkpoints, t.triage_state]), !!sideData.recalled,
                                sideData.children.length, sideData.deliverables.length,
                                sideData.repoOptions,
                                // A note posted by you or a reply written by an agent
                                // changes nothing else on the ticket, so without this
                                // the poll would decide the page was unchanged.
                                ticketNotes(activities).length,
                                checkpoints.map(c => [c.id, c.status, c.prompt, c.kind, c.options, c.response])]);
    if (!force && key === lastRenderKey) return;
    lastRenderKey = key;

    // What to put back after the swap.
    const streamEl = $("#stream");
    const keptScroll = streamEl
      ? { top: streamEl.scrollTop, atBottom: streamEl.scrollHeight - streamEl.scrollTop - streamEl.clientHeight < 40 }
      : null;
    const openGroups = [...document.querySelectorAll("details.csettled[open]")]
      .map(d => d.querySelector("[data-for]")?.dataset.for).filter(Boolean);

    // Design 2c: one thread, start to finish. The plan is not another view of the
    // ticket reached by a switch — it is something the agent hands you at a point
    // in the conversation, so it lands in the stream where that happened, with the
    // full map behind "open ▸" for when the shape of the thing is the question.
    const side = {
      task,
      recalled: sideData.recalled,
      children: sideData.children,
      deliverables: sideData.deliverables,
      repoOptions: sideData.repoOptions,
      plan: planData.plan,
      progress: planData.progress,
      agentProgress,
      planOpen,
      status: runStatus(task, planData.plan, planData.progress, qs, agentProgress),
      // How much process the bridge assessed this ticket needs, and why. Shown at
      // the gate so the call can be argued with rather than merely obeyed.
      assessedLevel: triage?.assessed_level || "",
      assessedWhy: triage?.assessed_why || [],
      // The ticket-level conversation, and the status that decides which channel a
      // new message goes down.
      activities,
      checkpoints,
      taskStatus: task.status,
    };

    root.innerHTML = `<div class="shell">`
      + renderNav(sideData.tasks.length ? sideData.tasks : [task], task)
      + renderRail(sideData.tasks, task, triage, planData, ticketPlanCache)
      + renderTicket(task, triage, activities, {
          agent: liveAgent(task, planData.progress),
          plan: planData.plan,
          progress: planData.progress,
          agentProgress,
          deliverables: sideData.deliverables,
          repoOptions: sideData.repoOptions,
        })
      // One surface, always. A ticket with no questions used to get a different
      // page — findings and a plan, no stream and no composer — so the tickets
      // triage was most confident about were the ones you could say least about.
      // Every ticket is a thread now; what differs is what is in it.
      + renderConversation(triage, focusedQuestion, side)
      + `</div>`;

    restoreDrafts(drafts);
    wireConversation(triage, keptScroll, openGroups);
    wireHeader();
    wireGraph(planData.plan, planData.progress);
    loadSideData(task);
  } catch (e) {
    root.innerHTML = `<div class="err">Couldn't load this ticket: ${esc(e.message || e)}</div>`;
  }
}

/** Clicking a node opens its detail; clicking it again closes it. */
function wireGraph(plan, progress) {
  const detail = $("#stepdetail");
  if (!detail || !plan) return;
  const paint = () => {
    detail.innerHTML = selectedStep == null ? "" : stepDetail(plan, progress, selectedStep);
    document.querySelectorAll("g.stepg").forEach(g =>
      g.classList.toggle("sel", String(g.dataset.step) === String(selectedStep)));
    const close = $("#sd-close");
    if (close) close.addEventListener("click", () => { selectedStep = null; paint(); });
  };
  document.querySelectorAll("g.stepg").forEach(g => {
    const open = () => {
      selectedStep = String(g.dataset.step) === String(selectedStep) ? null : g.dataset.step;
      paint();
    };
    g.addEventListener("click", open);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  });
  paint();
}

/** Refresh the active ticket as soon as its bridge progress changes. */
function wireLiveUpdates() {
  if (typeof EventSource === "undefined") return;
  try {
    let refreshTimer = null;
    let refreshRail = false;
    const events = new EventSource("/api/stream");
    events.onmessage = message => {
      let event;
      try { event = JSON.parse(message.data || "{}"); } catch { return; }
      const affectedTask = event.taskId || event.parentId || event.childTaskId;
      // A different ticket may have just raised or cleared a human action. Refresh
      // the queue instead of ignoring it so the bell changes without a page reload.
      if (affectedTask && affectedTask !== taskId) refreshRail = true;
      if (refreshTimer) return;
      refreshTimer = setTimeout(async () => {
        refreshTimer = null;
        if (refreshRail) await refreshRailTasks().catch(() => {});
        refreshRail = false;
        load();
      }, 250);
    };
  } catch {}
}

// ---- BOOTSTRAP ---- everything above is pure and testable; nothing below is.
// Delegated once, not per render: the question list is replaced on every poll.
wireQuestionActions();
wireRailNavigation();
wireLiveUpdates();
load();
// The bridge changes tickets out of band, so re-read the queue and active ticket
// periodically. Not forced: a poll that lands mid-sentence skips rather than
// discarding it, while refreshed rail data waits for the next safe render.
setInterval(() => refreshRailTasks().catch(() => {}).then(() => load()), 15000);
</script>
<dialog class="safety-dialog" id="safety-confirm">
  <form method="dialog">
    <h2 data-safety-title>Confirm action</h2>
    <p data-safety-message></p>
    <div class="safety-actions">
      <button class="summary-action" value="cancel">Keep task running</button>
      <button class="summary-action hold" value="confirm" data-safety-confirm>Confirm</button>
    </div>
  </form>
</dialog>
</body>
</html>
