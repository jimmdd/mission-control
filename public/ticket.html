<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket · Mission Control</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231A1F29'/%3E%3Cpath d='M8 20h16M8 20l4-8 4 5 3-4 5 7' stroke='%232563EB' stroke-width='1.8' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
  :root {
    --ground:   #F7F8FA;
    --card:     #FFFFFF;
    --sunk:     #F2F4F7;
    --line:     #E5E8EE;
    --line-soft:#EFF1F5;
    --ink:      #1A1F29;
    --ink-2:    #5B6673;
    --ink-3:    #8B95A3;
    --accent:   #2563EB;
    --accent-bg:#EFF4FE;
    --accent-line:#C7D9FC;
    --amber:    #B45309;
    --amber-bg: #FEF6EC;
    --amber-line:#F5DFC0;
    --green:    #16794C;
    --green-bg: #EDF7F1;
    --cyan:     #0E7490;
    --cyan-bg:  #ECF7FA;
    --red:      #B42318;
    --red-bg:   #FEF0EE;
    --shadow:   0 1px 2px rgba(26,31,41,.04), 0 1px 3px rgba(26,31,41,.03);
    --shadow-lift: 0 2px 4px rgba(26,31,41,.05), 0 8px 20px -12px rgba(26,31,41,.18);
    --ui: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#1B2029; --card:#232935; --sunk:#1F2530; --line:#333B49; --line-soft:#2B323E;
      --ink:#EDF0F5; --ink-2:#A9B4C2; --ink-3:#7C8798;
      --accent:#7BA5FA; --accent-bg:#293448; --accent-line:#3D4F6E;
      --amber:#F0B45E; --amber-bg:#3A3226; --amber-line:#5C4B32;
      --green:#5FCB94; --green-bg:#26362F; --cyan:#4FC7DD; --cyan-bg:#22363C;
      --red:#F0918A; --red-bg:#3A2725;
    }
  }
  :root[data-theme="dark"] {
    --ground:#1B2029; --card:#232935; --sunk:#1F2530; --line:#333B49; --line-soft:#2B323E;
    --ink:#EDF0F5; --ink-2:#A9B4C2; --ink-3:#7C8798;
    --accent:#7BA5FA; --accent-bg:#293448; --accent-line:#3D4F6E;
    --amber:#F0B45E; --amber-bg:#3A3226; --amber-line:#5C4B32;
    --green:#5FCB94; --green-bg:#26362F; --cyan:#4FC7DD; --cyan-bg:#22363C;
    --red:#F0918A; --red-bg:#3A2725;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--ui); font-size: 14px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1180px; margin: 0 auto; padding: 26px 22px 90px; }
  a { color: var(--accent); }
  h1, h2 { margin: 0; font-weight: 600; }
  .crumb { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 12.5px; }
  .crumb .brand { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-size: 11px; }

  /* ─────────── ticket ─────────── */
  .ticket {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 26px 28px 24px; box-shadow: var(--shadow);
  }
  .tk-row1 { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .tk-id {
    display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono);
    font-size: 12px; font-weight: 600; color: var(--ink-2); text-decoration: none;
  }
  .tk-id:hover { color: var(--accent); }
  .state { font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 20px; display: inline-flex; align-items: center; gap: 6px; }
  .state i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .state.s-plan { color: var(--amber); background: var(--amber-bg); }
  .state.s-run  { color: var(--cyan);  background: var(--cyan-bg); }
  .state.s-rev  { color: var(--green); background: var(--green-bg); }
  .tk-meta { margin-left: auto; display: flex; gap: 18px; font-size: 12.5px; color: var(--ink-3); flex-wrap: wrap; }
  .tk-meta b { color: var(--ink-2); font-weight: 500; font-family: var(--mono); }
  h1.tk-title { font-size: 25px; letter-spacing: -.028em; margin: 0 0 9px; line-height: 1.22; }
  .tk-desc { font-size: 14.5px; color: var(--ink-2); margin: 0; max-width: 74ch; }

  /* ─────────── progress track ─────────── */
  .tracker { margin-top: 24px; padding-top: 8px; border-top: 1px solid var(--line-soft); }
  /* overflow-x:auto clips vertically too, so the pill's headroom must live on the
     scrolling element itself — negative margin keeps it from pushing the layout down */
  .track-scroll { overflow-x: auto; overflow-y: hidden; padding: 48px 10px 2px; margin: -6px -10px 0; }
  .track-inner { min-width: 700px; }
  .tk-bar { position: relative; height: 6px; border-radius: 3px; background: var(--line); }
  .tk-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--cyan); transition: width .45s cubic-bezier(.4,0,.2,1); }
  .tk-bar.finished .tk-fill { background: var(--green); }
  .tk-tick { position: absolute; top: 50%; width: 3px; height: 3px; border-radius: 50%; background: var(--card); transform: translate(-50%,-50%); opacity: .8; }
  .tk-knob {
    position: absolute; top: 50%; width: 17px; height: 17px; border-radius: 50%;
    background: var(--card); border: 3px solid var(--cyan);
    transform: translate(-50%,-50%); z-index: 3; transition: left .45s cubic-bezier(.4,0,.2,1);
  }
  .tk-bar.finished .tk-knob { border-color: var(--green); }
  .tk-pill {
    position: absolute; bottom: 21px; left: 50%; transform: translateX(-50%);
    white-space: nowrap; background: var(--ink); color: var(--ground);
    font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 8px;
  }
  .tk-pill .dim { opacity: .6; font-weight: 500; margin-right: 5px; }
  .tk-pill::after { content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: var(--ink); }
  .tk-labels { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; margin-top: 13px; }
  .tk-labels span { display: flex; flex-direction: column; gap: 1px; align-items: center; text-align: center; }
  .tk-labels .n { font-size: 12px; color: var(--ink-3); }
  .tk-labels .done .n { color: var(--ink-2); }
  .tk-labels .now .n { color: var(--cyan); font-weight: 600; }

  /* ─────────── cards ─────────── */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; box-shadow: var(--shadow); margin-top: 20px; }
  .card.sunk { background: var(--sunk); box-shadow: none; }
  .glab {
    font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink-3); margin: 0 0 13px; display: flex; align-items: center; gap: 8px;
  }
  .glab .gn { margin-left: auto; font-family: var(--mono); font-size: 11px; letter-spacing: 0; font-weight: 500; }
  .cols { display: grid; grid-template-columns: 1fr 1.9fr; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

  /* ─────────── plan map (SVG) ─────────── */
  .diagram-wrap { overflow-x: auto; padding: 4px 0 10px; }
  svg.plan-map { display: block; width: 100%; height: auto; }
  svg.plan-map text { font-family: var(--ui); }
  svg.plan-map .sbox { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
  svg.plan-map g.stepg:hover .sbox { stroke: var(--accent); }
  svg.plan-map .snum { fill: var(--ink-3); font-size: 11px; font-weight: 700; font-family: var(--mono); }
  svg.plan-map .stitle { fill: var(--ink); font-size: 13px; font-weight: 600; }
  svg.plan-map .srepo { fill: var(--ink-3); font-size: 11px; font-family: var(--mono); }
  svg.plan-map .flow { stroke: var(--ink-3); stroke-width: 1.5; fill: none; }
  svg.plan-map .cbox { fill: var(--green-bg); stroke: none; }
  svg.plan-map .ctext { fill: var(--green); font-size: 11.5px; font-weight: 600; font-family: var(--mono); }
  svg.plan-map .clab { fill: var(--ink-3); font-size: 10.5px; font-weight: 600; letter-spacing: .1em; font-family: var(--mono); }
  svg.plan-map .dec rect { stroke-width: 1.5; }
  svg.plan-map .dec.open rect { fill: var(--amber-bg); stroke: var(--amber); stroke-dasharray: 4 3; }
  svg.plan-map .dec.set rect { fill: var(--green-bg); stroke: var(--green); }
  svg.plan-map .dec .dt { font-family: var(--mono); font-size: 11px; font-weight: 700; }
  svg.plan-map .dec.open .dt, svg.plan-map .dec.open .ds { fill: var(--amber); }
  svg.plan-map .dec.set .dt, svg.plan-map .dec.set .ds { fill: var(--green); }
  svg.plan-map .dec .ds { font-size: 10.5px; }
  svg.plan-map .dlink { fill: none; stroke-width: 1.5; }
  svg.plan-map .dlink.open { stroke: var(--amber); stroke-dasharray: 4 3; }
  svg.plan-map .dlink.set { stroke: var(--green); opacity: .6; }
  svg.plan-map .nogsd-edge { fill: var(--amber); }
  svg.plan-map g.stepg { cursor: pointer; }
  svg.plan-map g.stepg.sel rect.sbox { stroke: var(--accent); stroke-width: 2.5; }
  svg.plan-map .wv { font-family: var(--mono); font-size: 9.5px; font-weight: 700; fill: var(--ink-3); letter-spacing: .1em; }
  svg.plan-map .wv.wait { fill: var(--amber); }
  svg.plan-map .ghost rect { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 4; }
  svg.plan-map .ghost .stitle, svg.plan-map .ghost .srepo { opacity: .55; }
  svg.plan-map .run rect.sbox { stroke: var(--cyan); stroke-width: 2; }
  svg.plan-map .done rect.sbox { fill: var(--green-bg); stroke: var(--green); }
  svg.plan-map .blocked rect.sbox { stroke: var(--red); }
  svg.plan-map .blocked .snum { fill: var(--red); }
  .sd { background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-top: 14px; }
  .sd-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
  .sd-num { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--ink-3); }
  .sd-title { font-size: 15px; font-weight: 600; letter-spacing: -.014em; }
  .sd-close { margin-left: auto; cursor: pointer; border: none; background: none; color: var(--ink-3); font-size: 18px; line-height: 1; }
  .sd-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-bottom: 10px; }
  .sd-sec { margin-top: 12px; }
  .sd-lab { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px; }
  .sd-body { font-size: 13.5px; color: var(--ink-2); white-space: pre-wrap; }
  .sd-cmd { font-family: var(--mono); font-size: 11.5px; background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; overflow-x: auto; white-space: pre; }
  .sd-ac { font-size: 13px; color: var(--ink-2); padding-left: 16px; position: relative; margin-bottom: 5px; }
  .sd-ac::before { content: "—"; position: absolute; left: 0; color: var(--ink-3); }
  .sd-warn { background: var(--amber-bg); border: 1px solid var(--amber-line); color: var(--amber); border-radius: 8px; padding: 9px 11px; font-size: 12.5px; }
  .maplegend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); padding-bottom: 10px; }
  .maplegend span { display: flex; align-items: center; gap: 6px; }
  .maplegend i { width: 14px; height: 2px; border-radius: 1px; display: block; }
  .maplegend i.f { background: var(--ink-3); }
  .maplegend i.d { background: var(--amber); }
  .maplegend i.s { background: var(--green); opacity: .6; }

  /* ─────────── questions ─────────── */
  .qbox { border-bottom: 1px solid var(--line-soft); padding: 16px 0; }
  .qbox:first-of-type { padding-top: 0; }
  .qbox:last-of-type { border-bottom: none; padding-bottom: 0; }
  .qhead { display: flex; gap: 9px; align-items: baseline; margin-bottom: 11px; }
  .qnum { font-family: var(--mono); font-size: 11px; color: var(--ink-3); flex: 0 0 auto; }
  .qtext { font-size: 14.5px; letter-spacing: -.012em; line-height: 1.42; }
  .qfrom { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; flex: 0 0 auto; }
  .choices { display: flex; flex-direction: column; gap: 7px; margin-left: 26px; }
  .choice {
    display: flex; gap: 9px; align-items: flex-start; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
    background: var(--card); font-size: 13.5px; transition: border-color .12s, background .12s;
  }
  .choice:hover { border-color: var(--accent-line); }
  .choice.on { border-color: var(--accent); background: var(--accent-bg); }
  .choice input { margin-top: 3px; accent-color: var(--accent); flex: 0 0 auto; }
  .qadd {
    margin: 8px 0 0 26px; width: calc(100% - 26px); min-height: 54px; resize: vertical;
    font-family: inherit; font-size: 13.5px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
  }
  .qadd:focus { outline: none; border-color: var(--accent); }
  .qdone { margin-left: 26px; padding: 10px 12px; border-radius: 9px; background: var(--green-bg); font-size: 13.5px; color: var(--ink-2); }
  .qdone .fby { font-size: 11px; color: var(--ink-3); display: block; margin-top: 4px; }

  .footbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-top: 16px; margin-top: 4px; border-top: 1px solid var(--line-soft); }
  .btn {
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    border-radius: 9px; padding: 9px 16px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .why { font-size: 12.5px; color: var(--ink-3); }

  /* ─────────── settled decisions ─────────── */
  .qdone-wrap { margin-top: 20px; }
  details.settled { background: var(--sunk); border: 1px solid var(--line); border-radius: 14px; }
  details.settled > summary { list-style: none; cursor: pointer; padding: 15px 20px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  details.settled > summary::-webkit-details-marker { display: none; }
  details.settled > summary::before { content: "▸"; color: var(--ink-3); }
  details.settled[open] > summary::before { content: "▾"; }
  details.settled .sct { font-size: 14px; font-weight: 600; }
  .dlist { padding: 0 20px 16px; }
  .drow { padding: 11px 0; border-top: 1px solid var(--line-soft); display: flex; gap: 11px; }
  .dtag { font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--green); background: var(--green-bg); border-radius: 4px; padding: 1px 6px; height: fit-content; flex: 0 0 auto; }
  .dq { font-size: 13px; color: var(--ink-3); }
  .da { font-size: 13.5px; color: var(--ink); margin-top: 2px; }

  /* Follow-ups are the one thing blocking progress, so they lead and they are loud. */
  .card.fu { border-color: var(--amber-line); background: var(--amber-bg); }
  .glab.hot { color: var(--amber); }
  .fu-why { font-size: 13px; color: var(--ink-2); margin: 0 0 14px; max-width: 70ch; }
  .card.fu .choice { background: var(--card); }
  .fitem { padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
  .fitem:last-child { border-bottom: none; padding-bottom: 0; }
  .fitem:first-child { padding-top: 0; }
  .fk { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--amber); background: var(--amber-bg); border-radius: 4px; padding: 1px 6px; display: inline-block; margin-bottom: 5px; }
  .ftx { font-size: 13px; color: var(--ink-2); }
  .empty { color: var(--ink-3); font-size: 13px; }
  .err { background: var(--amber-bg); border: 1px solid var(--amber-line); color: var(--amber); padding: 12px 16px; border-radius: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="crumb">
      <span class="brand">Mission Control</span>
      <a href="/">← All tasks</a>
    </div>
    <div id="root"><p class="empty">Loading…</p></div>
  </div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const taskId = new URLSearchParams(location.search).get("id") || "";
let selectedStep = null;

const LEGS = [
  { label: "Intake",  statuses: ["inbox"] },
  { label: "Triage",  statuses: ["planning"] },
  { label: "Plan",    statuses: ["assigned"] },
  { label: "Build",   statuses: ["in_progress"] },
  { label: "Review",  statuses: ["review", "in_review", "testing"] },
  { label: "Done",    statuses: ["done", "completed", "merged"] },
];

async function getJson(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`${path} → ${res.status}`);
  return res.json();
}

function parseTriage(task) {
  const raw = task.triage_state;
  if (!raw) return null;
  try { return typeof raw === "string" ? JSON.parse(raw) : raw; } catch { return null; }
}

const pick = (re, s) => (re.exec(s || "") || [])[1] || "";

function renderTicket(task, triage) {
  const legIndex = Math.max(0, LEGS.findIndex(l => l.statuses.includes(task.status)));
  const finished = legIndex >= LEGS.length - 1;
  // Knob sits at the centre of the current leg's slice.
  const pct = ((legIndex + 0.5) / LEGS.length) * 100;
  const stateClass = legIndex >= 4 ? "s-rev" : legIndex >= 3 ? "s-run" : "s-plan";

  const repos = [...new Set(((triage && triage.triage_repos) || []).map(r => `${r.project}/${r.repo}`))];
  const base = pick(/^\s*base[- ]?branch:\s*(\S+)\s*$/im, task.description);
  const app = pick(/^\s*target app:\s*`?([^`\s(]+)/im, task.description);

  const desc = (task.description || "").split("\n")
    .filter(l => l.trim() && !/^\s*(base[- ]?branch|target app)\s*:/i.test(l)).slice(0, 2).join(" ");

  const ticks = LEGS.map((_, i) => i === 0 ? "" :
    `<div class="tk-tick" style="left:${(i / LEGS.length) * 100}%"></div>`).join("");
  const labels = LEGS.map((l, i) =>
    `<span class="${i < legIndex ? "done" : i === legIndex ? "now" : ""}"><span class="n">${esc(l.label)}</span></span>`).join("");

  return `
    <div class="ticket">
      <div class="tk-row1">
        ${task.external_url
          ? `<a class="tk-id" href="${esc(task.external_url)}" target="_blank" rel="noopener">${esc(task.external_id || task.id.slice(0, 8))} ↗</a>`
          : `<span class="tk-id">${esc(task.external_id || task.id.slice(0, 8))}</span>`}
        <span class="state ${stateClass}"><i></i>${esc((task.status || "").replace("_", " "))}</span>
        <div class="tk-meta">
          ${repos.length ? `<span>repo <b>${esc(repos.join(", "))}</b></span>` : ""}
          ${base ? `<span>branch <b>${esc(base)}</b></span>` : ""}
          ${app ? `<span>app <b>${esc(app)}</b></span>` : ""}
        </div>
      </div>
      <h1 class="tk-title">${esc(task.title)}</h1>
      <p class="tk-desc">${esc(desc)}</p>
      <div class="tracker">
        <div class="track-scroll"><div class="track-inner">
          <div class="tk-bar ${finished ? "finished" : ""}">
            <div class="tk-fill" style="width:${pct}%"></div>
            ${ticks}
            <div class="tk-knob" style="left:${pct}%">
              <div class="tk-pill"><span class="dim">now</span>${esc(LEGS[legIndex].label)}</div>
            </div>
          </div>
          <div class="tk-labels">${labels}</div>
        </div></div>
      </div>
    </div>`;
}

/* ─────────── the plan, as a map ─────────── */

const BOX_W = 208, BOX_H = 74, GAP_Y = 20, GAP_X = 74, PAD = 14, DEC_H = 46;
// Beyond this the decisions column dwarfs the work; the rest stay in the list above.
const MAX_DEC = 5;

function planMap(plan, progress, triage) {
  const stepById = Object.fromEntries(plan.steps.map(s => [s.step, s]));
  const rounds = (plan.parallel_groups && plan.parallel_groups.length)
    ? plan.parallel_groups : plan.steps.map(s => [s.step]);

  const decisions = (triage?.questions || []);
  const anyNoGsd = Object.values(progress?.steps || {}).some(st => st.gsd_ran === false);
  const open = decisions.filter(q => !q.answer);
  const cols = [decisions.length ? decisions : null, ...rounds].filter(Boolean);

  const colX = i => PAD + i * (BOX_W + GAP_X);
  // Every column is laid out at (height + GAP_Y) per node, so the canvas must be
  // measured the same way — reserving less clipped the decisions column top and bottom
  // as soon as answered questions accumulated.
  const decShown = Math.min(decisions.length, MAX_DEC);
  const tallest = Math.max(
    decShown * (DEC_H + GAP_Y) + (decisions.length > MAX_DEC ? DEC_H + GAP_Y : 0),
    ...rounds.map(g => g.length * (BOX_H + GAP_Y)));
  const height = PAD * 2 + 26 + tallest;
  const width = PAD * 2 + cols.length * BOX_W + (cols.length - 1) * GAP_X;

  const centre = (n, count, h) => PAD + 26 + (tallest - count * (h + GAP_Y)) / 2 + n * (h + GAP_Y);
  const pos = {};
  const parts = [];
  const hasDec = decisions.length > 0;

  // Decisions column
  if (hasDec) {
    const x = colX(0);
    parts.push(`<text class="clab" x="${x}" y="${PAD + 12}">DECISIONS</text>`);
    decisions.slice(0, MAX_DEC).forEach((q, i) => {
      const y = centre(i, decShown + (decisions.length > MAX_DEC ? 1 : 0), DEC_H);
      pos[`d${i}`] = { x, y, w: BOX_W, h: DEC_H };
      const set = !!q.answer;
      const label = set ? (q.answer || "") : q.question;
      parts.push(`
        <g class="dec ${set ? "set" : "open"}">
          <rect x="${x}" y="${y}" width="${BOX_W}" height="${DEC_H}" rx="9"/>
          <text class="dt" x="${x + 12}" y="${y + 18}">D-${String(i + 1).padStart(2, "0")}</text>
          <text class="ds" x="${x + 12}" y="${y + 34}">${esc(clip(label, 30))}</text>
        </g>`);
    });
    if (decisions.length > MAX_DEC) {
      const y = centre(MAX_DEC, decShown + 1, DEC_H);
      parts.push(`
        <g class="dec set">
          <rect x="${x}" y="${y}" width="${BOX_W}" height="${DEC_H}" rx="9"/>
          <text class="ds" x="${x + 12}" y="${y + 28}">+${decisions.length - MAX_DEC} more, listed above</text>
        </g>`);
    }
  }

  // Rounds
  rounds.forEach((group, gi) => {
    const ci = gi + (hasDec ? 1 : 0);
    const x = colX(ci);
    const waiting = group.some(n => !(stepById[n] || {}).step ? false : false);
    parts.push(`<text class="wv ${waiting ? "wait" : ""}" x="${x}" y="${PAD + 12}">ROUND ${gi + 1}${group.length > 1 ? ` · ${group.length}×` : ""}</text>`);
    group.forEach((n, i) => {
      const s = stepById[n];
      if (!s) return;
      const st = (progress?.steps || {})[String(n)] || {};
      const y = centre(i, group.length, BOX_H);
      pos[`s${n}`] = { x, y, w: BOX_W, h: BOX_H };
      const state = st.status === "completed" ? "done"
        : st.status === "in_progress" ? "run"
        : (st.status === "blocked" || st.status === "failed") ? "blocked" : "";
      // Provisional while decisions are still open — the plan may yet change.
      const ghost = open.length > 0 && !state ? "ghost" : "";
      const sel = String(selectedStep) === String(n) ? "sel" : "";
      const model = st.agent_profile || st.category || s.category || "";
      const check = (s.verify_command || "").trim();
      // A step that produced no GSD artifacts was not spec-driven, whatever else it
      // achieved — the plan carrying the context is the whole premise.
      const noGsd = st.gsd_ran === false;
      parts.push(`
        <g class="stepg ${state} ${ghost} ${sel}" tabindex="0" role="button" data-step="${s.step}">
          <title>${esc(s.title)}${check ? `\n\n✓ ${esc(check)}` : ""}${noGsd ? `\n\n⚠ ${esc(st.gsd_reason || "no GSD artifacts — the work was not spec-driven")}` : ""}</title>
          <rect class="sbox" x="${x}" y="${y}" width="${BOX_W}" height="${BOX_H}" rx="10"/>
          <text class="snum" x="${x + 12}" y="${y + 18}">STEP ${esc(String(s.step))}</text>
          ${model ? `<text class="srepo" x="${x + BOX_W - 12}" y="${y + 18}" text-anchor="end">${esc(clip(model, 14))}</text>` : ""}
          <text class="stitle" x="${x + 12}" y="${y + 38}">${esc(clip(s.title, 26))}</text>
          ${noGsd ? `<rect class="nogsd-edge" x="${x}" y="${y}" width="4" height="${BOX_H}" rx="2"/>` : ""}
          ${check ? `
            <rect class="cbox" x="${x + 12}" y="${y + 48}" width="${BOX_W - 24}" height="18" rx="5"/>
            <text class="ctext" x="${x + 18}" y="${y + 61}">✓ ${esc(clip(check.split("&&")[0].trim(), 22))}</text>` : ""}
        </g>`);
    });
    if (decisions.length > MAX_DEC) {
      const y = centre(MAX_DEC, decShown + 1, DEC_H);
      parts.push(`
        <g class="dec set">
          <rect x="${x}" y="${y}" width="${BOX_W}" height="${DEC_H}" rx="9"/>
          <text class="ds" x="${x + 12}" y="${y + 28}">+${decisions.length - MAX_DEC} more, listed above</text>
        </g>`);
    }
  });

  // Edges: step → step from declared dependencies, decisions → the roots.
  const edges = [];
  const link = (a, b, cls) => {
    if (!a || !b) return;
    const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
    const dx = Math.max(20, (x2 - x1) / 2);
    edges.push(`<path class="${cls}" d="M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}"/>`);
  };
  for (const s of plan.steps) {
    for (const dep of s.depends_on || []) link(pos[`s${dep}`], pos[`s${s.step}`], "flow");
  }
  if (hasDec) {
    const roots = plan.steps.filter(s => !(s.depends_on || []).length);
    decisions.forEach((q, i) => {
      for (const r of roots) link(pos[`d${i}`], pos[`s${r.step}`], `dlink ${q.answer ? "set" : "open"}`);
    });
  }

  return `
    <div class="maplegend">
      <span><i class="f"></i> depends on</span>
      ${hasDec ? `<span><i class="s"></i> decision locked</span>` : ""}
      ${open.length ? `<span><i class="d"></i> decision open — work is provisional</span>` : ""}
      ${anyNoGsd ? `<span><i class="d"></i> no GSD — step ran without task decomposition</span>` : ""}
    </div>
    <div class="diagram-wrap">
      <svg class="plan-map" viewBox="0 0 ${width} ${height}" style="min-width:${width}px">
        ${edges.join("")}${parts.join("")}
      </svg>
    </div>
    <div id="stepdetail"></div>`;
}

/** Full detail for one step — the node itself is all truncation. */
function stepDetail(plan, progress, num) {
  const s = (plan.steps || []).find(x => String(x.step) === String(num));
  if (!s) return "";
  const st = (progress?.steps || {})[String(num)] || {};
  const acs = (s.acceptance_criteria || s.done_when || []);
  const deps = (s.depends_on || []);
  return `
    <div class="sd">
      <div class="sd-head">
        <span class="sd-num">STEP ${esc(String(s.step))}</span>
        <span class="sd-title">${esc(s.title)}</span>
        <button class="sd-close" id="sd-close" title="Close">×</button>
      </div>
      <div class="sd-meta">
        ${esc(st.status || "pending")}
        ${st.agent_profile ? ` · ran on ${esc(st.agent_profile)}` : ""}
        ${st.retry_count ? ` · attempt ${st.retry_count + 1}` : ""}
        ${deps.length ? ` · needs step ${deps.join(", ")}` : " · no dependencies"}
        ${s.repo ? ` · ${esc(s.repo)}` : ""}
      </div>
      ${st.gsd_ran === false ? `<div class="sd-warn">Not spec-driven: ${esc(st.gsd_reason || "no GSD artifacts")}</div>` : ""}
      ${st.outcome ? `<div class="sd-sec"><div class="sd-lab">Outcome</div><div class="sd-body">${esc(st.outcome)}</div></div>` : ""}
      ${s.description ? `<div class="sd-sec"><div class="sd-lab">What it does</div><div class="sd-body">${esc(s.description)}</div></div>` : ""}
      ${acs.length ? `<div class="sd-sec"><div class="sd-lab">Done when</div>${acs.map(c => `<div class="sd-ac">${esc(c)}</div>`).join("")}</div>` : ""}
      ${s.verify_command ? `<div class="sd-sec"><div class="sd-lab">Checked by</div><div class="sd-cmd">${esc(s.verify_command)}</div></div>` : ""}
    </div>`;
}

const clip = (s, n) => (String(s).length > n ? String(s).slice(0, n - 1) + "…" : String(s));

function renderPlan(plan, progress, triage) {
  if (!plan || !(plan.steps || []).length) {
    return `<div class="card">
      <div class="glab">The plan</div>
      <p class="empty">No plan yet — it's written once the questions are answered.</p></div>`;
  }
  const rounds = (plan.parallel_groups && plan.parallel_groups.length) ? plan.parallel_groups.length : plan.steps.length;
  return `<div class="card">
    <div class="glab">The plan <span class="gn">${plan.steps.length} steps · ${rounds} rounds</span></div>
    ${planMap(plan, progress, triage)}
  </div>`;
}

/* ─────────── findings and questions ─────────── */

function renderFound(triage) {
  const items = [];
  if (triage?.triage_reasoning) items.push({ kind: "Blocking", text: triage.triage_reasoning });
  (triage?.questions || []).filter(q => q.answer && q.answered_by === "agent")
    .forEach(q => items.push({ kind: "Worked out", text: `${q.question}\n→ ${q.answer}` }));
  return `<div class="card sunk">
    <div class="glab">What we found</div>
    ${items.length ? items.map(i => `<div class="fitem"><span class="fk">${esc(i.kind)}</span><div class="ftx">${esc(i.text)}</div></div>`).join("")
      : `<p class="empty">Nothing yet — triage hasn't run.</p>`}
  </div>`;
}

/** Questions raised by the planner, not by triage. Only the unanswered ones. */
function followUps(qs) {
  return qs.filter(q => !q.answer && (q.source === "planner" || q.round > 1));
}

function renderFollowUps(open) {
  return `<div class="card fu">
    <div class="glab hot">Follow-up questions — planning is waiting on these
      <span class="gn">${open.length} open</span></div>
    <p class="fu-why">The plan cannot be written until these are settled, and no code
      should be written before the plan. Answering them resumes planning.</p>
    ${open.map((q, i) => {
      const head = `<div class="qhead"><span class="qnum">F${String(i + 1).padStart(2, "0")}</span>
        <span class="qtext">${esc(q.question)}</span>
        <span class="qfrom">${esc(q.category || "planner")}</span></div>`;
      const choices = (q.options || []).map(o => `
        <label class="choice"><input type="radio" name="q-${esc(q.id)}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("");
      return `<div class="qbox">${head}<div class="choices">${choices}</div>
        <textarea class="qadd" data-free="${esc(q.id)}" placeholder="Or answer in your own words."></textarea></div>`;
    }).join("")}
    <div class="footbar">
      <button class="btn primary" id="submit" disabled>Submit answers</button>
      <span class="why" id="hint">Answer all ${open.length} to resume planning.</span>
    </div>
  </div>`;
}

function renderSettled(qs) {
  return `<div class="qdone-wrap"><details class="settled">
    <summary><span class="sct">${qs.length} decisions locked</span>
      <span class="why">Answered — the plan below is built on them.</span></summary>
    <div class="dlist">${qs.map((q, i) => `
      <div class="drow">
        <span class="dtag">D-${String(i + 1).padStart(2, "0")}</span>
        <div><div class="dq">${esc(q.question)}</div><div class="da">${esc(q.answer || "")}</div></div>
      </div>`).join("")}</div>
  </details></div>`;
}

function renderQuestions(triage) {
  const qs = (triage?.questions || []);
  const open = qs.filter(q => !q.answer);
  const body = qs.length === 0 ? `<p class="empty">No open questions.</p>` : qs.map((q, i) => {
    const head = `<div class="qhead"><span class="qnum">${String(i + 1).padStart(2, "0")}</span>
      <span class="qtext">${esc(q.question)}</span><span class="qfrom">${esc(q.category || "")}</span></div>`;
    if (q.answer) {
      return `<div class="qbox">${head}<div class="qdone">${esc(q.answer)}
        <span class="fby">answered by ${esc(q.answered_by || "you")}</span></div></div>`;
    }
    const choices = (q.options || []).map(o => `
      <label class="choice"><input type="radio" name="q-${esc(q.id)}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("");
    return `<div class="qbox">${head}<div class="choices">${choices}</div>
      <textarea class="qadd" data-free="${esc(q.id)}" placeholder="Or answer in your own words — this wins over the options above."></textarea></div>`;
  }).join("");

  return `<div class="card">
    <div class="glab">${open.length ? "Answer these to start" : "Questions"}
      <span class="gn">${qs.length - open.length}/${qs.length}</span></div>
    ${body}
    ${open.length ? `<div class="footbar">
      <button class="btn primary" id="submit" disabled>Submit answers</button>
      <span class="why" id="hint">Answer all ${open.length} to continue.</span></div>` : ""}
  </div>`;
}

function wireQuestions(triage) {
  const btn = $("#submit");
  if (!btn) return;
  // Whatever is rendered unanswered is what the button gates on — follow-ups when
  // planning is blocked, the original set otherwise.
  const open = (triage.questions || []).filter(q =>
    !q.answer && document.querySelector(`[data-free="${CSS.escape(q.id)}"]`));
  const answerFor = q => {
    const free = document.querySelector(`[data-free="${CSS.escape(q.id)}"]`);
    if (free && free.value.trim()) return free.value.trim();
    const picked = document.querySelector(`input[name="q-${CSS.escape(q.id)}"]:checked`);
    return picked ? picked.value : "";
  };
  const refresh = () => {
    document.querySelectorAll(".choice").forEach(o => o.classList.toggle("on", !!o.querySelector("input")?.checked));
    const filled = open.filter(q => answerFor(q)).length;
    btn.disabled = filled < open.length;
    $("#hint").textContent = btn.disabled ? `${filled}/${open.length} answered.`
      : "Ready — this hands the ticket to the planner.";
  };
  document.addEventListener("input", refresh);
  document.addEventListener("change", refresh);
  refresh();

  btn.addEventListener("click", async () => {
    btn.disabled = true;
    $("#hint").textContent = "Saving…";
    const now = new Date().toISOString();
    const next = JSON.parse(JSON.stringify(triage));
    next.questions.forEach(q => {
      if (q.answer) return;
      const a = answerFor(q);
      if (a) { q.answer = a; q.answered_at = now; q.answered_by = "you"; }
    });
    try {
      const res = await fetch(`/api/tasks/${encodeURIComponent(taskId)}/triage-state`, {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(next),
      });
      if (!res.ok) throw new Error(`save failed (${res.status})`);
      load();
    } catch (e) {
      $("#hint").textContent = String(e.message || e);
      btn.disabled = false;
    }
  });
}

async function load() {
  const root = $("#root");
  if (!taskId) {
    root.innerHTML = `<div class="err">No ticket id. Open as <code>/ticket?id=&lt;task-id&gt;</code>.</div>`;
    return;
  }
  try {
    const task = await getJson(`/api/tasks/${encodeURIComponent(taskId)}`);
    const planData = await getJson(`/api/tasks/${encodeURIComponent(taskId)}/plan`).catch(() => ({}));
    const triage = parseTriage(task);
    const qs = (triage?.questions || []);
    // Settled = nothing left to answer, or the work has already moved past asking.
    const settled = (qs.length > 0 && qs.every(q => q.answer))
      || ["assigned", "in_progress", "review", "in_review", "done", "completed", "merged"].includes(task.status);

    // A follow-up outranks everything: planning is stopped until it is answered, and
    // nothing should be built before the plan exists.
    const fu = followUps(qs);
    root.innerHTML = renderTicket(task, triage)
      + (fu.length ? renderFollowUps(fu) : "")
      + (settled
        // Once the decisions are made the plan is the thing; they collapse above it.
        ? renderSettled(qs.filter(q => q.answer)) + renderPlan(planData.plan, planData.progress, triage)
        : `<div class="cols">${renderFound(triage)}${renderQuestions(triage)}</div>`
          + renderPlan(planData.plan, planData.progress, triage));

    if (triage && (fu.length || !settled)) wireQuestions(triage);
    wireGraph(planData.plan, planData.progress);
  } catch (e) {
    root.innerHTML = `<div class="err">Couldn't load this ticket: ${esc(e.message || e)}</div>`;
  }
}

/** Clicking a node opens its detail; clicking it again closes it. */
function wireGraph(plan, progress) {
  const detail = $("#stepdetail");
  if (!detail || !plan) return;
  const paint = () => {
    detail.innerHTML = selectedStep == null ? "" : stepDetail(plan, progress, selectedStep);
    document.querySelectorAll("g.stepg").forEach(g =>
      g.classList.toggle("sel", String(g.dataset.step) === String(selectedStep)));
    const close = $("#sd-close");
    if (close) close.addEventListener("click", () => { selectedStep = null; paint(); });
  };
  document.querySelectorAll("g.stepg").forEach(g => {
    const open = () => {
      selectedStep = String(g.dataset.step) === String(selectedStep) ? null : g.dataset.step;
      paint();
    };
    g.addEventListener("click", open);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  });
  paint();
}

// ---- BOOTSTRAP ---- everything above is pure and testable; nothing below is.
load();
// The bridge changes this ticket out of band, so re-read it periodically.
setInterval(load, 15000);
</script>
</body>
